institution: institut-de-l-entreprise
candidats: [le-pen]
theme: fiscalite-budget
date: 2026-10-06
perimetre: >-
  Contre-budget présenté par le RN le 6 octobre 2026 (trajectoire 2027-2032, 125 mesures de son annexe). La note
  reprend les montants par mesure de l'annexe du RN et classe chaque mesure selon la solidité de son rendement ; le
  document précise que ce classement « relève d'un jugement d'analyse » et que ses estimations « ne constituent pas
  des prévisions ». Il ne porte pas sur le reste du programme du RN.
resume: >-
  La note est titrée « 140 milliards affichés, moins de 10 milliards crédibles ». L'Institut de l'Entreprise chiffre
  à 7,5 Md€ les économies que dégagerait le projet à la fin du quinquennat, « dans une hypothèse optimiste », sans les
  effets récessifs. Il relève que, selon l'annexe du RN elle-même, la baisse nette des dépenses n'atteint que
  112,6 Md€ en 2031, et que 23,5 Md€ d'économies affichées n'améliorent pas le déficit au sens de Maastricht. Il juge
  l'effet récessif de la baisse des dépenses sous-évalué (0,5 point retenu par le RN, environ 1,6 point en appliquant
  le repère du FMI de 2010) et classe 92 % des montants attendus de l'immigration et la totalité de ceux attendus de
  l'Union européenne parmi des mesures « non documentées ou juridiquement fragiles ». Il critique aussi les baisses
  d'impôts, qu'il estime mal ciblées, et les nouveaux prélèvements sur les grandes entreprises.
sources: [idep-2026-10-06-contre-budget-rn]
