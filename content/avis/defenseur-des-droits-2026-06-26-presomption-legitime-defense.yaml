institution: defenseur-des-droits
candidats: [le-pen]
theme: securite-justice
date: 2026-06-26
perimetre: >-
  Proposition de loi visant à reconnaître une présomption de légitime défense pour les forces de l'ordre (groupe
  Droite républicaine), avant son examen en séance le 7 juillet 2026. La présomption de légitime défense des policiers
  et des gendarmes figure dans le livret « Sécurité » du RN (2022). L'avis ne porte pas sur le programme d'un candidat
  ni sur la version adoptée le 7 juillet, qui prévoit une « présomption d'usage légitime de l'arme ».
resume: >-
  La Défenseure des droits, Claire Hédon, estime qu'une telle présomption « est de nature à porter atteinte aux
  garanties attachées au droit fondamental à la vie, à l'accès au juge, à la manifestation de la vérité et à
  l'effectivité des voies de recours ». Elle « viendrait inutilement complexifier le régime actuel », sans renforcer
  la sécurité juridique des forces de l'ordre, et pourrait inverser la charge de la preuve au détriment des victimes.
sources: [defenseurdesdroits-2026-06-26-avis-26-05]
