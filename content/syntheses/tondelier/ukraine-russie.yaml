candidat: tondelier
theme: ukraine-russie
phrase: Soutien militaire (frappe à longue portée, défense antiaérienne), arrêt des importations d'énergie et d'engrais
  russes, avoirs russes gelés pour les réparations, négociations d'adhésion à l'UE (programme du parti).
reponses:
  aide: Matériel y compris à longue portée, défense antiaérienne, formation, renseignement, fonds bilatéral et Facilité
    européenne pour la paix
  negociation: Soutenir la stratégie de négociation de l'Ukraine (frontières de 1991) ; garanties de sécurité via la « Coalition
    des volontaires »
  sanctions: Arrêt immédiat des importations de gaz, d'uranium et d'engrais russes ; contre le contournement des sanctions
    ; 140 Md€ d'avoirs gelés pour les réparations
  adhesion: Ouvrir les négociations d'adhésion de l'Ukraine à l'Union européenne
