candidat: le-pen
theme: securite-justice
phrase: "Abaisser la majorité pénale à 16 ans, présumer la légitime défense des policiers et des gendarmes, instaurer des peines minimales."
reponses:
  maintien-ordre: Utiliser la force « lorsque cela est nécessaire » ; présomption de légitime défense pour les policiers et les gendarmes (livret de 2022)
  police: 7 000 postes de policiers et gendarmes ; police municipale obligatoire au-delà de 10 000 habitants (livret de 2022)
  peines: Peines minimales ; réductions de peine jamais automatiques ; 85 000 places de prison d'ici 2028 (livret de 2022)
  mineurs: Majorité pénale à 16 ans, par référendum (annonce du RN, octobre 2026)
