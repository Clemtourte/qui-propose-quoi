etat_des_lieux:
- nature: fait
  texte: 'Le projet de loi de financement de la Sécurité sociale pour 2027, déposé le 1er octobre 2026, ramène le déficit
    des régimes obligatoires de base de 21,8 Md€ en 2026 à 12,7 Md€ en 2027. L''objectif de dépenses d''assurance maladie
    (Ondam) est fixé à 278,7 Md€, soit +2,0 % à champ constant contre une tendance de +3,4 %. Le texte ajoute 5,1 Md€ d''économies
    (3,9 Md€ nettes de 1,2 Md€ de dépenses nouvelles) : médicaments 2,1 Md€, indemnités journalières (arrêts maladie) 1,0
    Md€, efficience de l''hôpital et du médico-social 0,9 Md€, remboursements et transferts aux complémentaires 0,7 Md€,
    soins de ville 0,3 Md€. Selon l''annexe, le déficit remonterait à 17,0 Md€ en 2030. Le texte n''est pas adopté.'
  date: '2026-10-01'
  sources:
  - caducee-2026-10-05-plfss-2027
  - cdc-2026-10-20-securite-sociale-redressement-2027
  chiffres_cles:
  - valeur: 12,7 Md€
    libelle: déficit prévu des régimes obligatoires de base de la Sécurité sociale en 2027 (21,8 Md€ attendus en 2026)
  - valeur: 278,7 Md€
    libelle: objectif de dépenses d'assurance maladie (Ondam) pour 2027, en hausse de 2,0 %
  reperes:
  - mesure: 5,1 Md€ d'économies supplémentaires sur la santé en 2027
    equivalent: environ 74 € par habitant, soit 0,17 % du PIB de 2025 ; 0,30 % des dépenses publiques de 2025
    calcul: '5,1 Md€ / 69,082 millions d''habitants = 74 € ; 5,1 / 2 990 Md€ de PIB = 0,17 % ; 5,1 / 1 714,2 Md€ de dépenses
      publiques = 0,30 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d''environ 2 990
      Md€, déduit des chiffres de l''Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations
      publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Montant annuel pour 2027,
      selon le projet de loi.'
    sources:
    - insee-2026-05-29-comptes-apu-2025
    - insee-2026-01-13-bilan-demographique-2025
- nature: jugement
  auteur: Cour des comptes, publication du 20 octobre 2026
  texte: La Cour des comptes juge que les 3,9 Md€ d'économies sur l'Ondam en 2027 sont surtout paramétriques et que leur
    acceptabilité « semble de moins en moins garantie ». Elle relève que certaines mesures ne sont pas définies et que certains
    risques ne sont pas provisionnés, et estime que l'objectif de la loi de financement de 2026 ne sera pas tenu (déficit
    de 21,8 Md€). Elle recommande de documenter une trajectoire de retour à l'équilibre, visé à l'horizon 2030 si l'effort
    de 2027 est confirmé, et évoque une reprise de la dette de l'Acoss par la Cades « avant la fin 2027 ».
  date: '2026-10-20'
  sources:
  - cdc-2026-10-20-securite-sociale-redressement-2027
- nature: fait
  texte: Selon la Drees (étude du 20 mai 2026, relayée par la presse), sept hôpitaux publics sur dix sont en déficit en
    2024, pour un déficit cumulé de 2,9 Md€. L'encours de dette des hôpitaux a reculé pour la troisième année consécutive,
    à 29,9 Md€.
  date: '2026-05-20'
  sources:
  - economiematin-2026-05-20-hopitaux-deficit-drees
  chiffres_cles:
  - valeur: 7 sur 10
    libelle: hôpitaux publics en déficit en 2024, pour 2,9 Md€ au total (Drees, via la presse)
  reperes:
  - mesure: 2,9 Md€ de déficit cumulé des hôpitaux publics en 2024
    equivalent: environ 42 € par habitant, soit 0,10 % du PIB de 2025 ; 0,17 % des dépenses publiques de 2025
    calcul: '2,9 Md€ / 69,082 millions d''habitants = 42 € ; 2,9 / 2 990 Md€ de PIB = 0,10 % ; 2,9 / 1 714,2 Md€ de dépenses
      publiques = 0,17 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d''environ 2 990
      Md€, déduit des chiffres de l''Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations
      publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Montant de l''année 2024.'
    sources:
    - insee-2026-05-29-comptes-apu-2025
    - insee-2026-01-13-bilan-demographique-2025
- nature: fait
  texte: Selon le dernier zonage publié par le Gouvernement, 75,7 % des Français vivent sur des territoires où l'accès aux
    soins médicaux est insuffisant (Sénat, mai 2026). En 2025, 6,4 millions d'assurés sont sans médecin traitant. La densité
    de médecins généralistes a diminué de 18 % entre 2000 et 2021, celle des spécialistes de 9 %. Selon la Drees, les 10
    % de la population les mieux dotés en généralistes ont accès à 5,6 consultations par an, les 10 % les moins bien dotés
    à 1,4.
  date: 2026-05
  sources:
  - senat-2026-05-lutter-contre-deserts-medicaux
  chiffres_cles:
  - valeur: 6,4 millions
    libelle: assurés sans médecin traitant en 2025 (Sénat, mai 2026)
  - valeur: 75,7 %
    libelle: des Français vivent sur un territoire à accès aux soins insuffisant, selon le zonage du Gouvernement (Sénat,
      mai 2026)
raisonnements:
- question: Vais-je trouver un médecin près de chez moi ?
  lectures:
  - auteur: Guillaume Garot, député socialiste, mai 2025
    date: '2025-05-07'
    texte: >-
      Sa proposition, votée par l'Assemblée (99 voix contre 9), crée une autorisation préalable à l'installation : de droit dans les zones manquant de
      médecins, conditionnée dans les zones bien dotées. Selon lui, « nous avons remis un peu de République dans notre organisation collective ».
    sources: [lcp-2025-05-07-loi-garot]
  - auteur: Yannick Neuder, alors ministre de la Santé, mai 2025
    date: '2025-05-07'
    texte: >-
      Opposé à cette régulation, il estime que la lutte contre les déserts médicaux sera efficace dès lors que l'on « formera plus de médecins ».
    sources: [lcp-2025-05-07-loi-garot]
  - auteur: Conseil national de l'Ordre des médecins, 21 mai 2026
    date: '2026-05-21'
    texte: >-
      Il y voit « une réponse simpliste » qui risque d'aggraver les difficultés d'accès aux soins, et défend l'incitation et l'organisation coordonnée.
    sources: [cnom-2026-05-21-ppl-garot]
  - auteur: Corinne Imbert, rapporteure au Sénat, juin 2026
    date: 2026-06
    texte: >-
      Le texte imposerait « la restriction la plus stricte jamais imposée à une profession de santé ». Le Sénat préfère un engagement d'exercice partiel en
      zone sous-dotée pour s'installer en zone bien dotée. Le texte n'est pas adopté.
    sources: [banquedesterritoires-2026-06-deserts-medicaux]
  camps:
  - libelle: Plus de centres de santé, de lieux publics de soins
    candidats: [glucksmann, tondelier]
  - libelle: Moduler la rémunération des médecins selon le lieu (2022)
    candidats: [le-pen]
  - libelle: Médecins salariés par l'État dans les territoires sous-dotés (2022)
    candidats: [zemmour]
  - libelle: Un assistant médical d'intelligence artificielle
    candidats: [attal]
  - libelle: Pas de mesure détaillée relevée dans nos entrées
    candidats: [melenchon, philippe, retailleau]
- question: Les arrêts maladie coûtent-ils trop cher, et à cause de quoi ?
  lectures:
  - auteur: Caisse nationale d'assurance maladie et Cour des comptes, citées par Public Sénat, juillet 2025
    date: '2025-07-22'
    texte: >-
      De 2019 à 2023, 58 % de la hausse s'explique par des facteurs démographiques et économiques, et 42 % par un recours accru, notamment chez les jeunes, et
      des arrêts plus longs. Les plus de 55 ans font 18,3 % des actifs et 27 % des journées indemnisées en 2022.
    sources: [publicsenat-2025-07-22-arrets-maladie]
  - auteur: franceinfo, Vrai ou faux, 28 août 2026
    date: '2026-08-28'
    texte: >-
      Sur « l'open bar » : les arrêts par téléconsultation représentent 2 à 4 % des arrêts, et « le cadre dans lequel ils sont délivrés reste parfois flou ».
    sources: [franceinfo-2026-08-28-vof-philippe-arrets-travail]
  - auteur: Fondation iFRAP, septembre 2023
    date: '2023-09-19'
    texte: >-
      Elle juge que se concentrer sur le privé est une erreur de diagnostic : selon son estimation, non officielle, le public pèse 40 % des indemnités pour 20 %
      de l'emploi.
    sources: [ifrap-2023-09-19-arrets-maladie]
  camps:
  - libelle: Plus de jours de carence pour tous (3 jours)
    candidats: [philippe]
  - libelle: Un jour de carence obligatoire dans le privé et 4 Md€ d'économies
    candidats: [retailleau]
  - libelle: Un plan contre la « dérive », non détaillé
    candidats: [attal]
  - libelle: Pas de mesure relevée sur ce point dans nos entrées
    candidats: [glucksmann, le-pen, melenchon, tondelier, zemmour]
- question: L'hôpital manque-t-il de lits, d'argent ou d'organisation ?
  lectures:
  - auteur: Drees, panorama du 9 juillet 2026, cité par l'AFP
    nature: fait
    date: 2026-07
    texte: >-
      Selon la Drees, fin 2024 : 367 100 lits d'hospitalisation complète, en baisse depuis plus de vingt ans, et des capacités de jour et à domicile en hausse. La baisse
      ralentit : −0,6 % en 2024, contre −1,2 % en 2023.
    sources: [afp-2026-07-lits-hopitaux-drees]
  - auteur: Cour des comptes, 20 octobre 2026
    date: '2026-10-20'
    texte: >-
      Sur le budget 2027, elle juge que l'acceptabilité des économies sur l'assurance maladie « semble de moins en moins garantie » et demande une trajectoire
      documentée de retour à l'équilibre.
    sources: [cdc-2026-10-20-securite-sociale-redressement-2027]
  - auteur: Institut de l'Entreprise, note sur le contre-budget du RN, 6 octobre 2026
    date: '2026-10-06'
    texte: >-
      Elle estime que les économies attendues sur les coûts hospitaliers et le parcours de soins (8,3 Md€ en 2031) ne reposent sur « aucune mesure détaillée ».
    sources: [idep-2026-10-06-contre-budget-rn]
  camps:
  - libelle: Plus de personnels, de salaires et de lits (2022 pour Le Pen, Mélenchon et Zemmour)
    candidats: [le-pen, melenchon, tondelier, zemmour]
  - libelle: Changer le financement, moins de tarification à l'acte
    candidats: [glucksmann, tondelier]
  - libelle: Gains d'efficience réinvestis, dépenses sans engagement chiffré
    candidats: [retailleau]
  - libelle: Pas de mesure relevée sur ce point dans nos entrées
    candidats: [attal, philippe]
