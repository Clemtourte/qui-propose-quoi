etat_des_lieux:
  - nature: fait
    texte: >-
      En 2025, selon le bilan définitif du service statistique du ministère de l'Intérieur (délinquance enregistrée
      par la police et la gendarmerie), les violences physiques augmentent de 5 % et les violences sexuelles de 8 %
      (viols et tentatives de viol : +9 %). 975 personnes ont été victimes d'homicide, un nombre stable sur un an.
      Les infractions liées aux stupéfiants progressent (usage +7 %, trafic +9 %). Les cambriolages de logement
      baissent de 3 %, les vols avec armes de 8 %, les vols de véhicule et les vols dans les véhicules de 9 %.
    date: 2026-07-09
    sources: [ssmsi-2026-07-09-insecurite-delinquance-2025]
    chiffres_cles:
      - valeur: "+5 %"
        libelle: "violences physiques enregistrées en 2025 (+8 % par an en moyenne depuis 2016)"
      - valeur: "975"
        libelle: "victimes d'homicide en 2025, un nombre stable sur un an"
  - nature: fait
    texte: >-
      Au 1er octobre 2026, selon la statistique trimestrielle du ministère de la Justice, 89 400 personnes sont
      détenues en France hors collectivités d'outre-mer (90 900 en les incluant), soit 7,0 % de plus en un an.
      Parmi elles, 24 400 sont prévenues, c'est-à-dire en détention provisoire, présumées innocentes (+10,8 % en un
      an). Par ailleurs, 17 400 personnes condamnées exécutent une peine de prison ferme hors d'un établissement
      pénitentiaire (surveillance électronique ou placement à l'extérieur).
    date: 2026-10-01
    sources: [justice-sser-2026-10-infos-rapides-45]
    chiffres_cles:
      - valeur: "89 400"
        libelle: "personnes détenues au 1er octobre 2026, hors outre-mer (+7 % sur un an)"
  - nature: fait
    texte: >-
      Au 1er septembre 2026, 90 020 personnes sont détenues, un record (+6,8 % sur un an), pour 63 348 places
      opérationnelles (+1,2 %). La densité carcérale atteint 142,1 % en moyenne et 176,1 % dans les maisons d'arrêt,
      où sont détenues les personnes en attente de jugement et les condamnés à de courtes peines. 8 347 matelas sont
      posés au sol faute de lits (+51,8 % sur un an). Chiffres mensuels du ministère de la Justice rapportés par
      l'AFP.
    date: 2026-09-01
    sources: [sudradio-2026-10-03-detenus-record, cnews-2026-10-03-detenus-record]
    chiffres_cles:
      - valeur: "142,1 %"
        libelle: "densité carcérale au 1er septembre 2026 (176,1 % dans les maisons d'arrêt)"
  - nature: fait
    texte: >-
      Le projet de loi de finances pour 2027, présenté le 1er octobre 2026, porte les crédits de la mission
      « Justice » à près de 11 milliards d'euros, contre 10,7 milliards en 2026. Il prévoit 1 301 emplois
      supplémentaires, dont 287 magistrats et 334 greffiers, et la livraison de 326 places de prison en 2027
      (830 en 2026).
    date: 2026-10-01
    sources: [jss-2026-10-01-budget-justice-2027]
  - nature: jugement
    auteur: Contrôleur général des lieux de privation de liberté, avis publié au Journal officiel du 2 juillet 2026
    texte: >-
      Près de trois ans après son avis de septembre 2023, le CGLPL constate « qu'aucune mesure d'envergure nationale
      n'a été prise » contre la surpopulation carcérale. Il réitère sa recommandation d'inscrire dans la loi « un
      mécanisme contraignant de régulation carcérale », géré localement sous la responsabilité de l'autorité
      judiciaire, pour résorber la surpopulation des maisons d'arrêt dans un délai fixé par la loi.
    date: 2026-07-02
    sources: [cglpl-2026-07-02-avis-surpopulation]
raisonnements:
  - question: Juger les mineurs comme des majeurs, que disent les chiffres et le droit ?
    lectures:
      - auteur: Inspection générale de la justice, mission d'appui, juillet 2025
        date: 2025-07
        texte: >-
          Le constat d'une baisse du nombre de mineurs mis en cause « fait consensus », à analyser avec prudence. La hausse dans
          les infractions violentes « paraît fondée », tandis que le rajeunissement « ne peut être véritablement objectivé ».
          La mission a écarté de son analyse l'abaissement de la majorité pénale à 16 ans.
        sources: [justice-2025-07-mission-delinquance-mineurs]
      - auteur: Conseil constitutionnel, décision du 19 juin 2025
        date: 2025-06-19
        texte: >-
          Il censure la comparution immédiate des mineurs d'au moins 16 ans et la règle qui écartait par principe l'atténuation
          des peines des récidivistes de plus de 16 ans, au nom du principe d'atténuation de la responsabilité pénale selon l'âge.
        sources: [conseil-constitutionnel-2025-06-19-2025-886-dc]
    camps:
      - libelle: Abaisser la majorité pénale à 16 ans, référendum envisagé
        candidats: [le-pen]
      - libelle: L'abaisser à 15 ans pour les faits les plus graves
        candidats: [retailleau]
      - libelle: Lever l'excuse de minorité pour le narcotrafic
        candidats: [philippe]
      - libelle: Auteur de la loi de 2025, en partie censurée
        candidats: [attal]
      - libelle: Pas de position relevée sur ce point dans nos entrées
        candidats: [glucksmann, melenchon, tondelier, zemmour]
  - question: Peine plus lourde, plus courte ou autre chose, qu'est-ce qui limite la récidive ?
    lectures:
      - auteur: Aurélie Ouss et Arnaud Philippe, Institut des politiques publiques, mars 2024
        date: 2024-03
        texte: >-
          La loi de 2007 « a eu un effet très important sur l'incarcération en France, mais un effet dissuasif de faible ampleur ».
          L'adaptation constatée est « spécifique au nouveau dispositif » et ne génère pas « une baisse globale » de la délinquance.
        sources: [ipp-2024-03-peines-planchers]
      - auteur: Brigitte Barèges, rapporteure UDR de la proposition de loi sur les peines planchers, 17 juin 2025
        date: 2025-06-17
        texte: >-
          À partir de la même note, elle retient une hausse nette des peines et juge que les effets « apparaissent positifs pour
          les personnes qui ont véritablement été ciblées ». Elle veut des peines « véritablement dissuasives ».
        sources: [an-2025-06-17-rapport-1586-peines-planchers]
      - auteur: Garde des Sceaux, réponse à une question écrite, 25 décembre 2012
        date: 2012-12-25
        texte: >-
          Selon cette réponse, l'impact des peines planchers « a été en effet quasi nul sur le niveau des délits graves et des
          crimes », alors qu'elles accroissent « les courtes peines de prison dont on sait qu'elles sont génératrices de
          récidive ». Position d'un gouvernement qui préparait leur abrogation.
        sources: [an-qe-14-1961-peines-planchers]
      - auteur: Contrôleur général des lieux de privation de liberté, avis publié le 2 juillet 2026
        date: 2026-07-02
        texte: >-
          Il constate « qu'aucune mesure d'envergure nationale n'a été prise » contre la surpopulation et recommande « un mécanisme
          contraignant de régulation carcérale ».
        sources: [cglpl-2026-07-02-avis-surpopulation]
    camps:
      - libelle: Peines minimales ou planchers
        candidats: [le-pen, zemmour]
      - libelle: Peines planchers pour les faits les plus graves et courtes peines dès la première infraction
        candidats: [philippe]
      - libelle: Numerus clausus et moratoire sur les nouvelles places
        candidats: [tondelier]
      - libelle: Pas de position relevée sur ce point dans nos entrées
        candidats: [attal, glucksmann, melenchon, retailleau]
  - question: Maintien de l'ordre et usage de la force, quel cadre ?
    lectures:
      - auteur: Défenseur des droits, fiche de novembre 2023 et avis du 26 juin 2026
        date: 2026-06-26
        texte: >-
          L'institution recommande d'interdire le LBD 40x46 dans le maintien de l'ordre. Sur la présomption de légitime défense,
          Claire Hédon estime qu'elle « viendrait inutilement complexifier le régime actuel ». Son avis ne porte pas sur la version
          adoptée le 7 juillet 2026.
        sources: [ddd-2023-11-fiche-maintien-ordre, defenseurdesdroits-2026-06-26-avis-26-05]
      - auteur: Laurent Nuñez, ministre de l'Intérieur, 7 juillet 2026
        date: 2026-07-07
        texte: >-
          « Ce texte n'organise aucune irresponsabilité pénale des policiers et des gendarmes » ; « n'importe quel procureur pourra
          renverser cette présomption ». Les partisans du texte invoquent le besoin de ne pas être « automatiquement » suspectés.
        sources: [lcp-2026-07-07-presomption-usage-arme]
      - auteur: Conseil national des barreaux, octobre 2026
        date: 2026-10-13
        texte: >-
          Il rappelle son opposition au texte, qui selon lui « fragiliserait les garanties attachées à l'État de droit », et note
          que l'article L. 435-1 instaure déjà depuis 2017 un régime spécifique d'usage des armes.
        sources: [cnb-2026-10-13-presomption]
    camps:
      - libelle: Assumer l'usage de la force, présomption en faveur des forces de l'ordre
        candidats: [attal, le-pen, retailleau]
      - libelle: Désescalade, fin des LBD et de la Brav-M
        candidats: [melenchon, tondelier]
      - libelle: Réponse « extrêmement ferme », doctrine non détaillée
        candidats: [glucksmann]
      - libelle: Pas de position relevée sur ce point dans nos entrées
        candidats: [philippe, zemmour]
recherches:
  avis: >-
    Recherché le 21 octobre 2026 : un avis de la Défenseure des droits sur la présomption de légitime défense des
    forces de l'ordre, mesure du livret sécurité du RN. Aucun avis d'institution trouvé sur l'abaissement de la
    majorité pénale (RN, Bruno Retailleau), ni sur les mesures d'Édouard Philippe, de La France insoumise ou des
    Écologistes. L'avis de la CGLPL sur la surpopulation carcérale, qui ne vise aucun candidat, figure dans l'état
    des lieux ; la décision du Conseil constitutionnel du 19 juin 2025 sur la loi de Gabriel Attal, dans son bilan.
  verifications: >-
    Recherché le 21 octobre 2026 dans les pages des rubriques « Vrai ou faux » et « Le vrai du faux » de franceinfo
    (publications de février à octobre 2026) et sur la page d'accueil d'AFP Factuel (depuis le 18 septembre 2026).
    Retenues : les vérifications d'une affirmation d'un candidat ou d'une mesure de son programme. Les vérifications
    visant des élus qui ne sont pas candidats (Marion Maréchal, Manuel Bompard, Éric Coquerel, élus RN) ne sont pas
    retenues. Les Décodeurs (Le Monde) restent inaccessibles.
  promesses: Pas encore recherché.
