etat_des_lieux:
- nature: fait
  texte: >-
    Les émissions françaises de gaz à effet de serre ont baissé de 2,1 % en 2025, soit 7,6 millions de tonnes équivalent
    CO2 hors puits de carbone, selon l'estimation du Citepa publiée en juin 2026. Une première estimation, en janvier
    2026, donnait −1,6 %, un rythme jugé par le Citepa « en deçà du rythme nécessaire » pour les objectifs de 2030.
  date: '2026-07-09'
  sources:
  - connaissancedesenergies-2026-07-09-hcc-rapport-2026
  - linfodurable-2026-01-13-citepa-2025
  chiffres_cles:
  - valeur: −2,1 %
    libelle: émissions de gaz à effet de serre en 2025 par rapport à 2024 (Citepa, juin 2026)
- nature: jugement
  auteur: Haut Conseil pour le climat, rapport annuel du 9 juillet 2026
  texte: >-
    Le Haut Conseil pour le climat note de « premiers progrès » mais juge que « cela est tout à fait insuffisant
    » (Jean-François Soussana, son président). Le rythme de baisse « va devoir au moins doubler », avec plus de
    4 % par an en 2026, 2027 et 2028 ; « la seule poursuite des politiques climatiques actuelles ne permettra pas
    » d'y répondre. Au premier trimestre 2026, les émissions ont baissé de 4,8 %.
  date: '2026-07-09'
  sources:
  - connaissancedesenergies-2026-07-09-hcc-rapport-2026
- nature: fait
  texte: >-
    En 2025, 95,2 % de l'électricité produite en France métropolitaine est bas carbone, selon le Bilan électrique
    de RTE. Le nucléaire en fournit 68,1 % (373 TWh, +3 % sur un an), l'hydraulique 11,4 % et le solaire 6 %. La
    production d'origine fossile (18,7 TWh) est la plus faible depuis près de 75 ans. Le facteur de charge de l'éolien
    terrestre (21,4 %) est le plus bas des dix dernières années, en raison de vents faibles.
  date: '2026-02-25'
  sources:
  - connaissancedesenergies-2026-02-25-rte-bilan-2025
  chiffres_cles:
  - valeur: 68,1 %
    libelle: part du nucléaire dans la production d'électricité en 2025 (95,2 % bas carbone au total)
- nature: fait
  texte: >-
    La troisième programmation pluriannuelle de l'énergie (PPE), adoptée par décret le 12 février 2026 sans vote
    du Parlement, couvre 2026-2035. Elle prolonge les réacteurs existants jusqu'à 60 ans « voire au-delà », prévoit
    six réacteurs EPR2 (premier mis en service visé en 2038) et huit en option, et vise 15 GW d'éolien en mer en
    2035. Elle veut passer d'environ 60 % d'énergies fossiles dans le mix énergétique en 2023 à 60 % d'énergie bas
    carbone en 2030. Les objectifs renouvelables attribués après 2028 pourront être ajustés à la demande d'électricité.
  date: '2026-02-13'
  sources:
  - maireinfo-2026-02-13-ppe3
  - europe1-2026-02-13-ppe3
  chiffres_cles:
  - valeur: 6 + 8
    libelle: réacteurs EPR2 prévus et en option dans la PPE de février 2026 (premier en 2038)
  reperes:
  - mesure: 6 réacteurs EPR2 prévus
    equivalent: environ 10 GW, soit 16 % de la puissance du parc nucléaire actuel (63 GW)
    calcul: >-
      6 × 1,67 GW (puissance brute d'un EPR2) = 10,0 GW ; 10,0 / 63,0 = 16 %. Ordre de grandeur : puissance brute
      des EPR2 et puissance installée du parc RTE ne sont pas définies de la même façon.
    sources:
    - connaissancedesenergies-epr2-technologie-projets
    - rte-2026-02-bilan-electrique-2025-principaux-resultats
  - mesure: 15 GW d'éolien en mer en 2035
    equivalent: environ 8 fois la puissance installée fin 2025 (1,9 GW)
    calcul: >-
      15 / 1,9 = 7,9. Comparaison de puissances installées ; la production d'une éolienne en mer dépend du vent et
      reste inférieure à sa puissance installée.
    sources:
    - rte-2026-02-bilan-electrique-2025-principaux-resultats
raisonnements:
- question: Que coûte la programmation de l'énergie, et que faut-il compter ?
  lectures:
  - auteur: Matignon, cité par Public Sénat, février 2026
    date: '2026-02-12'
    texte: >-
      Selon les scénarios de prix de l'énergie, de l'ordre de 115 Md€ de coût sur 45 ans si les prix sont bas, ou 35 Md€ de gain
      s'ils sont hauts.
    sources: [publicsenat-2026-02-12-ppe-300-milliards]
  - auteur: Andreas Rüdinger (Iddri) et Nicolas Goldberg (Terra Nova), février 2026
    date: '2026-02-12'
    texte: >-
      Pour le premier, les investissements dans les réseaux servent à les « adapter » au changement climatique, à
      l'électrification et à toutes les nouvelles capacités, et le RN retient un scénario de prix bas pour le soutien aux
      renouvelables. Le second relève que le calcul du RN ne compte pas les 6 EPR, qui avec le financement « avoisineront les
      100 milliards ».
    sources: [publicsenat-2026-02-12-ppe-300-milliards]
  - auteur: Fondation iFRAP, mai 2025
    date: '2025-05-06'
    texte: >-
      À partir des chiffres du comité de gestion des charges de service public, elle retient 130 à 159 Md€ d'engagements de soutien
      aux renouvelables sur 2024-2060 à prix médians, et voit un « tournant » dans l'appel du Premier ministre à un développement
      « raisonné ».
    sources: [ifrap-2025-05-06-couts-renouvelables]
  camps:
  - libelle: Contestent la programmation adoptée par décret
    candidats: [le-pen, retailleau]
  - libelle: Pas de position relevée sur son coût dans nos entrées
    candidats: [attal, glucksmann, melenchon, philippe, tondelier, zemmour]
- question: Nucléaire, renouvelables, ou les deux ?
  lectures:
  - auteur: RTE, Futurs énergétiques 2050, octobre 2021
    date: '2021-10-25'
    texte: >-
      « Atteindre la neutralité carbone est impossible sans un développement significatif des énergies renouvelables. » Selon RTE,
      « construire de nouveaux réacteurs nucléaires est pertinent » : l'écart serait de l'ordre de 10 Md€ par an, à cause des
      réseaux et de la flexibilité. RTE dit présenter les options sans en choisir une. Compte rendu de la Banque des Territoires.
    sources: [banquedesterritoires-2021-10-25-rte-futurs-energetiques]
  - auteur: RTE, Bilan prévisionnel, décembre 2025
    date: '2025-12-09'
    texte: >-
      « Fermer de manière anticipée des réacteurs nucléaires, ou arrêter complètement le développement des renouvelables écarterait
      la possibilité d'une décarbonation rapide à l'horizon de 5-10 ans. » Les réseaux « peuvent devenir bloquants plus rapidement
      que la production ».
    sources: [rte-2025-12-09-bilan-previsionnel-resume]
  - auteur: Bertrand Château, Global Chance, débat public de janvier 2023
    date: '2023-01-24'
    texte: >-
      Il conteste les hypothèses de coût de RTE : le coût de production des EPR2 « serait plutôt de l'ordre de 100 €/MWh a minima »,
      contre 60 à 75 €/MWh retenus selon lui par RTE.
    sources: [globalchance-2023-01-24-epr2-facture]
  - auteur: Bernard Kasriel, Fondation iFRAP, mars 2025
    date: '2025-03-25'
    texte: >-
      Il juge que le projet de programmation « ne répond à aucun des impératifs de puissance garantie, de pilotabilité ou de
      souveraineté » et voit dans l'exemple allemand « le modèle à ne pas suivre ». Son texte porte sur la version de 2025.
    sources: [ifrap-2025-03-25-ppe3-souverainete]
  camps:
  - libelle: Nucléaire et renouvelables ensemble
    candidats: [attal, glucksmann, philippe]
  - libelle: Nucléaire, et arrêt des soutiens ou de l'éolien (2022 pour Le Pen et Zemmour)
    candidats: [le-pen, retailleau, zemmour]
  - libelle: Sortie du nucléaire (2022 pour Mélenchon, calendrier 2027 non documenté)
    candidats: [melenchon, tondelier]
- question: Sortir des énergies fossiles, à quel rythme ?
  lectures:
  - auteur: Haut Conseil pour le climat, rapport du 9 juillet 2026
    date: '2026-07-09'
    texte: >-
      Le rythme de baisse des émissions « va devoir au moins doubler », et « la seule poursuite des politiques climatiques actuelles
      ne permettra pas » d'y répondre.
    sources: [connaissancedesenergies-2026-07-09-hcc-rapport-2026]
  - auteur: RTE, Bilan prévisionnel, décembre 2025
    date: '2025-12-09'
    texte: >-
      Dans sa trajectoire de décarbonation rapide, la consommation d'électricité augmenterait de 135 TWh en dix ans et les importations
      de combustibles fossiles baisseraient d'environ 500 TWh. RTE relève un « retard pris dans l'électrification depuis 2023 ».
    sources: [rte-2025-12-09-bilan-previsionnel-resume]
  camps:
  - libelle: Un plan de 100 jours, non chiffré à ce stade
    candidats: [glucksmann]
  - libelle: Une loi de programmation
    candidats: [attal, tondelier]
  - libelle: Prix du carbone aux frontières, capture du carbone, électrification
    candidats: [philippe]
  - libelle: Pas de calendrier relevé dans nos entrées
    candidats: [le-pen, melenchon, retailleau, zemmour]
recherches:
  avis: >-
    Recherché le 21 octobre 2026 : aucun avis d'institution (RTE, ADEME, Cour des comptes, Haut Conseil pour le
    climat) trouvé sur le programme énergétique d'un candidat pour 2027. RTE a jugé en 2025 qu'un moratoire sur
    les renouvelables compromettrait la réindustrialisation (repéré par un résumé de recherche, non ouvert, non
    publié). Nouvelle recherche le 22 octobre 2026 (avis de RTE sur le moratoire de juin 2025, avis du Haut Conseil
    pour le climat sur la programmation de l'énergie, Cour des comptes sur les EPR2) : rien d'exploitable trouvé par
    le moteur de recherche ; Pages de publications de RTE, du Haut Conseil pour le climat et de la Cour des comptes parcourues directement le même jour : rien sur les mesures d'un candidat (dernier avis du HCC sur la programmation de l'énergie : 31 janvier 2025 ; avis sur la SNBC 3 : 12 mars 2026).
  verifications: >-
    Recherché le 21 octobre 2026 dans les recherches précédentes des rubriques « Vrai ou faux » et « Le vrai du
    faux » de franceinfo et d'AFP Factuel : aucune vérification retenue sur ce thème. Le chiffrage de la PPE à «
    300 milliards d'euros » par le RN n'a pas été trouvé vérifié.
  promesses: Pas encore recherché.
