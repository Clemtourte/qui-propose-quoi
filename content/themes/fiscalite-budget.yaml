etat_des_lieux:
  - nature: fait
    texte: >-
      En 2025, le déficit public atteint 152,5 milliards d'euros, soit 5,1 % du PIB. La dette publique s'élève
      à 3 460,5 milliards d'euros fin 2025, soit 115,7 % du PIB.
    date: 2026-05-29
    sources: [insee-2026-05-29-comptes-apu-2025]
    chiffres_cles:
      - valeur: "5,1 % du PIB"
        libelle: "déficit public en 2025 (152,5 milliards d'euros)"
      - valeur: "115,7 % du PIB"
        libelle: "dette publique fin 2025 (3 460,5 milliards d'euros)"
  - nature: fait
    texte: >-
      En 2025, les prélèvements obligatoires (nets des crédits d'impôt) représentent 43,6 % du PIB et les dépenses
      publiques 57,3 % du PIB.
    date: 2026-05-29
    sources: [insee-2026-05-29-comptes-apu-2025]
    chiffres_cles:
      - valeur: "43,6 % du PIB"
        libelle: "prélèvements obligatoires en 2025"
      - valeur: "57,3 % du PIB"
        libelle: "dépenses publiques en 2025"
  - nature: fait
    texte: >-
      Le projet de loi de finances pour 2027, présenté le 1er octobre 2026, vise un déficit public de 5,0 % du PIB
      en 2027, après 5,4 % attendus en 2026. Le gouvernement annonce un effort de 54 milliards d'euros, dont
      43 milliards de mesures nouvelles.
    date: 2026-10-01
    sources: [touteleurope-2026-10-02-budget-2027]
  - nature: jugement
    auteur: Haut Conseil des finances publiques, avis sur les PLF et PLFSS pour 2027, octobre 2026
    texte: >-
      Le HCFP juge l'actualisation du déficit 2026 à 5,4 % « plausible mais encore des aléas significatifs », et la
      prévision de croissance de 1,0 % pour 2027 « paraissant optimiste au regard des dernières évolutions ». Pour 2027,
      il relève « un effort budgétaire qui serait important (près de 40 Md€ hors charge d'intérêts), mais une réduction
      du déficit limitée ». Il estime que la dette continue d'augmenter et que « la stabiliser nécessite un ajustement
      significatif dès à présent puis de poursuivre les efforts dans la durée ».
    date: 2026-10
    sources: [hcfp-2026-10-avis-plf-2027]
recherches:
  avis: >-
    Recherché le 22 octobre 2026 (presse, sites de l'Institut de l'Entreprise, du CAE, de l'OFCE) : une note
    d'analyse sur le contre-budget du RN (Institut de l'Entreprise, 6 octobre 2026, lue en entier). Pour le contre-budget
    de LFI (14 octobre), seuls des économistes interrogés par l'AFP ont commenté, sans publication d'institution
    trouvée. Pour le plan de Bruno Retailleau (12 octobre), aucune contre-expertise indépendante trouvée. Pour les
    autres candidats, pas encore recherché. Le Conseil d'analyse économique a publié le 8 octobre 2026 une base de
    chiffrage de plus de 150 mesures (Focus n° 147), qui n'est pas un avis sur un candidat. Sites de l'OFCE et de
    l'IPP parcourus directement le 22 octobre 2026 : aucune analyse d'un programme de candidat ; l'OFCE a publié le
    16 octobre une note sur le projet de budget du gouvernement et le 19 octobre une note sur la taxation des plus
    riches (Guillaume Allègre, Xavier Timbeau), sans lien avec un candidat.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026. Retenues : les vérifications d'une affirmation d'un candidat
    ou d'une mesure de son programme. Autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  promesses: Pas encore recherché.
