titre: "Après le 17 octobre : « Il faut la revoir et vite »"
citation:
  texte: "J'en ai ras-le-bol de la doctrine de maintien de l'ordre dans ce pays. Il faut la revoir et vite car ça finit par être une atteinte aux libertés publiques et, en plus, cela met tout le monde en danger : les manifestants et les policiers."
  date: 2026-10-17
  contexte: Propos devant plusieurs médias, dont BFMTV, dans le cortège parisien
texte: >-
  Le lendemain, sur France Inter et France 2, elle condamne les violences (« Personne ne peut tolérer ça ») et juge
  qu'« il n'y a pas de gagnant de la journée de samedi, il n'y a que des perdants », parmi lesquels elle cite « les
  policiers qui ont été blessés » et « les commerçants qui ont été vandalisés ».
