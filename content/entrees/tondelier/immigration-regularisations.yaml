candidat: tondelier
theme: immigration
rubrique: mesure
nature: position
titre: "Régularisations, regroupement familial et droit du sol (programme du parti)"
texte: >-
  Le programme des Écologistes propose de « régulariser les travailleur·ses, les étudiant·es et les parents d'enfants
  scolarisés sur la base de critères objectifs » (durée de résidence, lien familial, activité professionnelle), de
  supprimer les OQTF « automatiques ou inapplicables » et de « rendre effectif le droit au regroupement familial » par
  un renouvellement automatique et pluriannuel des titres de séjour. Il veut garantir le droit du sol « pour les enfants
  nés en France indépendamment de la situation des parents », supprimer le régime dérogatoire à Mayotte et abroger les
  lois asile et immigration adoptées sous Emmanuel Macron. Il ne fixe pas d'objectif chiffré d'entrées.
date: 2026-07
sources: [lesecologistes-2026-07-programme]
appui:
  faits: >-
    Le programme avance, sans source : « Une personne française sur quatre a désormais un grand-parent étranger. »
  raisonnement: >-
    « Arrêter la fabrique juridique des sans-papiers par la complexification croissante du droit des étrangers. » Et : « Au
    regard des enjeux démographiques, nous devons refaire de la France un pays attractif pour les migrant·es. »
  sources: [lesecologistes-2026-07-programme]
  donnees:
    - texte: >-
        Cour des comptes (janvier 2024) : 133 modifications du cadre législatif en moins de dix ans et 447 257 obligations de
        quitter le territoire prononcées de 2019 à 2022, dont « autour de 10 % » exécutées. Aucune donnée officielle n'a été
        lue sur la part de Français ayant un grand-parent étranger.
      sources: [ccomptes-2024-01-04-immigration-irreguliere, macommune-2024-01-04-cour-comptes-expulsions]
