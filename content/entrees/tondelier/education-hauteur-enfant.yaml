appui:
  faits: >-
    Le programme des Écologistes cite « 83 % des enfants de cadres ou de professions intellectuelles supérieures » diplômés du supérieur « contre 37 % des enfants
    d'ouvriers », sans indiquer de source.
  raisonnement: >-
    « Nous refusons une école du tri et de la sélection qui crée des vainqueurs et des vaincus. » La baisse des effectifs est « l'occasion de diminuer radicalement le
    nombre d'élèves par classe. Mais cela ne suffira pas ».
  sources: [lesecologistes-2026-07-programme]
  donnees:
  - texte: >-
      DEPP (évaluations de début de 6e, 2025) : en français, 54,5 % des collégiens de REP+ sont dans les groupes les moins performants, contre 15,7 % dans le privé sous
      contrat. Mesure différente de celle du programme : niveau à 11 ans, pas diplôme. Aucune donnée officielle n'a été lue sur les 83 % et 37 %.
    sources: [depp-2025-evaluations-sixieme]
  - texte: >-
      DEPP (février 2026) : en REP+, la taille moyenne des classes de CP passe de 21,6 élèves en 2016 à 13,1 en 2017. Gain en fin de CE1, aucune différence
      significative à l'entrée en 6e pour la première cohorte.
    sources: [depp-2026-02-synthese-8-taille-classes]
