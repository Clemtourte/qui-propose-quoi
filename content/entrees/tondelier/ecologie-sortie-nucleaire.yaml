candidat: tondelier
theme: ecologie-energie
rubrique: mesure
nature: position
titre: Sortie du nucléaire et 44 % d'électricité renouvelable en 2030 (programme du parti)
texte: >-
  Le programme des Écologistes de juillet 2026 propose de « planifier la sortie du nucléaire » : fin des programmes
  EPR-2 et SMR, arrêt progressif du parc « étalée sur une vingtaine d'années », avec prolongation possible de certaines
  centrales sous condition de sûreté. Il vise 44 % de renouvelables dans la consommation finale brute d'électricité
  en 2030, une loi de programmation « énergie-climat », 10 000 communautés énergétiques renouvelables, la baisse
  de la fiscalité sur l'électricité et le refus du marché carbone européen pour les logements et transports des
  ménages (ETS2).
questions: [nucleaire, renouvelables, prix]
reperes:
- question: nucleaire
  mesure: arrêt du parc « étalé sur une vingtaine d'années »
  equivalent: >-
    en moyenne environ 3 GW de nucléaire à arrêter chaque année (parc actuel : 63 GW), soit environ 19 TWh de production en moins par an, 4 % de la consommation d'électricité de 2025
  calcul: >-
    63,0 GW / 20 ans = 3,2 GW par an. Hypothèse : ces capacités produiraient autant par GW que le parc de 2025 (373,0 TWh pour 63,0 GW, soit 5,9 TWh par GW). 3,2 × 5,9 = 19 TWh ; 19 / 451,2 = 4 %. Moyenne linéaire, sans tenir compte de la prolongation possible de certaines centrales ni du calendrier réel.
  sources:
  - rte-2026-02-bilan-electrique-2025-principaux-resultats
date: 2026-07
sources:
- lesecologistes-2026-07-programme
appui:
  faits: >-
    Le programme parle de programmes EPR-2 et SMR « extrêmement dispendieux » et de « centrales vieillissantes », sans chiffre
    à cet endroit.
  raisonnement: >-
    Étaler l'arrêt sur une vingtaine d'années et étudier des prolongations pour « éviter l'effet falaise », tout en développant
    les renouvelables et les communautés d'énergie.
  sources: [lesecologistes-2026-07-programme]
  donnees:
    - texte: >-
        EDF, cité par l'AFP (décembre 2025) : 72,8 Md€ pour les 6 premiers EPR2 (euros de 2020, hors financement), soit environ
        40 % de plus qu'en 2022.
      sources: [afp-2025-12-18-cout-epr2]
    - texte: >-
        RTE : en 2021, un écart de l'ordre de 10 Md€ par an, jusqu'à 20 Md€ dans certains scénarios, en faveur d'un système avec
        14 EPR ; en décembre 2025, fermer des réacteurs « de manière anticipée » écarterait une décarbonation rapide. Son horizon
        de 5-10 ans est plus court que le calendrier du programme.
      sources: [banquedesterritoires-2021-10-25-rte-futurs-energetiques, rte-2025-12-09-bilan-previsionnel-resume]
