titre: 500 000 rénovations performantes par an, interdiction de location des logements F en 2028 (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 3) vise « 500 000 rénovations performantes par an via MaPrimeRénov'
  » pour sortir un million de personnes par an de la précarité énergétique, avec prise en charge directe du coût pour les
  propriétaires à faible revenu, un guichet unique et un éco-prêt à taux zéro élargi. Il maintient l'interdiction de remise
  en location des logements classés F en 2028 et E en 2034 (exceptions pour les petits propriétaires seulement contre une
  baisse temporaire de loyer de 30 % et des travaux dans les deux ans), la fin des chauffages au fioul en 2032 et le changement
  de système de chauffage de 300 000 ménages par an.
