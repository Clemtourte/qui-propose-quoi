candidat: tondelier
theme: immigration
rubrique: mesure
nature: position
titre: "Asile, rétention et politique européenne (programme du parti)"
texte: >-
  Le programme des Écologistes veut réserver la procédure accélérée d'asile aux demandes ultérieures, rétablir la
  collégialité à la Cour nationale du droit d'asile, ouvrir le droit au travail dès le dépôt de la demande et augmenter
  l'allocation pour demandeur d'asile. Il propose d'« en finir avec la rétention administrative ». Au niveau européen,
  il demande de réviser le Pacte sur la migration et l'asile, de répartir les migrants entre États « au prorata de la
  population et de la richesse », de démanteler l'agence Frontex au profit d'une agence de protection des droits des
  migrants, et de créer un parquet européen contre le trafic d'êtres humains.
date: 2026-07
sources: [lesecologistes-2026-07-programme]
