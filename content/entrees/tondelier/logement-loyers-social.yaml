titre: Encadrement des loyers généralisé, garantie universelle des loyers, 30 % de logements sociaux en zones tendues (programme
  du parti)
texte: 'Le programme des Écologistes de juillet 2026 (chapitre 3, « Pouvoir se loger décemment ») propose : « la généralisation,
  l''amélioration et la pérennisation de l''encadrement des loyers », avec une couverture de toutes les villes universitaires
  et des amendes en hausse ; une « garantie universelle des loyers » à la place de Visale ; la suppression de la réduction
  de loyer de solidarité (RLS) et une TVA réduite sur la construction de logements sociaux ; des sanctions renforcées contre
  les communes qui ne respectent pas la loi SRU et « un objectif de 30 % de logements [sociaux] d''ici 2035 » dans les communes
  aux marchés les plus tendus ; l''abrogation de la loi Kasbarian.'
