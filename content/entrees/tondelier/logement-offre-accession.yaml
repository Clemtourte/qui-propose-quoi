titre: Accession des ménages modestes, régulation des meublés touristiques, réquisition des logements vacants (programme
  du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 3) veut « renforcer l'accès à la propriété pour les ménages
  modestes » (prêt social location-accession, bail réel solidaire), aligner les locations de courte durée sur les obligations
  du secteur hôtelier et limiter les licences touristiques en zones tendues, utiliser le droit de réquisition et moduler
  la surtaxe sur les logements vacants selon le nombre de logements du propriétaire, et relancer la construction et la rénovation
  de logements locatifs sociaux en priorité sur des zones déjà artificialisées.
