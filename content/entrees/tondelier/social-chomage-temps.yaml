titre: Assurance chômage refondée, 32 heures dans les métiers pénibles ou de nuit (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 14, « Travailler mieux ») propose de « Refonder l'assurance
  chômage » en abrogeant les réformes des deux derniers quinquennats, notamment le calcul de l'allocation de retour à l'emploi,
  d'indexer les allocations sur l'inflation, de créer une assurance chômage européenne et de porter à six mois de salaire
  les peines pour licenciement abusif. Il veut « Passer aux 32 heures sans perte de salaire dans les métiers pénibles ou
  de nuit » en y conditionnant les aides aux entreprises, et créer un compte épargne temps universel.
