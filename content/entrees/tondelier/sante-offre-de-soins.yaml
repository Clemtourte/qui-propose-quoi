titre: 2 000 centres de santé d'ici 2030 et réforme du financement de l'hôpital (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 30, « Rendre accessible une offre de soin de qualité ») propose
  de « Créer 2 000 nouveaux centres de santé d'ici 2030, notamment dans les zones rurales et les quartiers prioritaires
  », de rééquilibrer la carte des formations vers les régions les moins dotées, d'augmenter les recrutements et les salaires
  à l'hôpital public, d'augmenter les dotations liées à des objectifs de santé publique pour « limiter encore la part de
  T2A » (tarification à l'activité), de transférer la dette des hôpitaux publics à la Cades, et de conditionner le remboursement
  des soins dans les cliniques privées à leur participation à une permanence des soins. Le programme affirme que « Six millions
  de français·ses n'ont pas de médecins traitants ».
