candidat: tondelier
theme: securite-justice
rubrique: mesure
nature: position
titre: "Prisons et drogues : numerus clausus, moratoire sur les constructions, cannabis légalisé (programme du parti)"
texte: >-
  Le programme des Écologistes veut « limiter la surpopulation à 100 % des capacités dans tous les établissements
  pénitentiaires » par un numerus clausus, et adopter un moratoire sur la construction de nouvelles places de prison,
  hors remplacement des prisons insalubres : « construire toujours plus de prisons est une impasse ». Il propose de
  « légaliser et encadrer la production, la vente et la consommation de cannabis », la distribution étant réservée à
  des structures à but non lucratif.
date: 2026-07
sources: [lesecologistes-2026-07-programme]
