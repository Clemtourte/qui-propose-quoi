candidat: tondelier
theme: securite-justice
rubrique: mesure
nature: position
titre: "Police : proximité, désescalade, fin des LBD (programme du parti)"
texte: >-
  Le programme des Écologistes (juillet 2026) prévoit de « créer une police nationale de proximité » et d'adopter
  « une nouvelle doctrine de maintien de l'ordre » fondée sur « la désescalade et un usage de la force strictement
  nécessaire et proportionné ». Il propose d'interdire les LBD40 et les grenades mutilantes, de démanteler les unités
  de type BRAV-M, d'abroger les dispositions de la loi Cazeneuve de 2017 sur l'ouverture du feu, de remplacer l'IGPN
  et l'IGGN par un organisme indépendant rattaché à la Défenseure des droits, et d'interdire la reconnaissance
  faciale.
date: 2026-07
sources: [lesecologistes-2026-07-programme, lcp-2026-10-19-maintien-ordre-propositions]
