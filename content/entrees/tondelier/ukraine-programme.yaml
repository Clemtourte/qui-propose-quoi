titre: Soutien militaire et économique, avoirs russes gelés pour les réparations, garanties de sécurité (programme du parti)
texte: 'Le programme des Écologistes de juillet 2026 (chapitre 62, « Soutenir l''Ukraine face à la Russie ») propose : un
  soutien politique à la stratégie de négociation de l''Ukraine, « fondée sur la défense de son intégrité territoriale au
  sein des frontières internationales reconnues en 1991 » ; un soutien militaire (« capacités de frappe à longue portée
  », défense antiaérienne, formation, renseignement, fonds bilatéral et Facilité européenne pour la paix) ; l''arrêt immédiat
  des importations de gaz, d''uranium et d''engrais russes et biélorusses et des mesures contre les entreprises, notamment
  chinoises et indiennes, qui contournent les sanctions ; l''application des mandats d''arrêt de la Cour pénale internationale
  et l''arraisonnement de la « flotte fantôme » ; « Consacrer les 140 milliards d''avoirs gelés russes bloqués dans les
  banques européennes à des réparations de guerre et au remboursement du prêt européen » (Toute l''Europe chiffre à environ
  210 Md€ les actifs souverains russes immobilisés dans l''Union) ; des garanties de sécurité « suffisantes et crédibles
  » dans le cadre de la « Coalition des volontaires » ; l''ouverture des négociations d''adhésion à l''Union européenne.
  Le 5 septembre 2026, Marine Tondelier qualifie Marine Le Pen de « cheval de Troie » de ceux qui veulent nuire à la France
  et à l''Europe (franceinfo).'
