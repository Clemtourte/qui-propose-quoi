titre: RIC, proportionnelle intégrale et septennat unique (programme du parti)
texte: >-
  Le programme des Écologistes de juillet 2026 propose un « processus constituant » pour passer à une « Première
  République écologique et citoyenne » et « abolir la monarchie présidentielle » : septennat unique, Premier ministre
  issu de la majorité parlementaire, Parlement maître de son ordre du jour et non limité par l'article 49.3. Il
  prévoit le référendum d'initiative citoyenne (RIC) « propositionnel ou abrogatif », sous condition d'un contrôle
  de constitutionnalité préalable, une convention citoyenne permanente au sein d'un CESE transformé, un vote obligatoire
  à l'Assemblée sur une pétition réunissant 500 000 signatures dans 30 départements, la proportionnelle intégrale
  aux législatives et le droit de vote à 16 ans.
date: 2026-07
