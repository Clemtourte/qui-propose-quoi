titre: Embargo sur les armes, suspension de l'accord UE-Israël, retrait de Gaza, relance des négociations nucléaires avec
  l'Iran (programme du parti)
texte: 'Le programme des Écologistes de juillet 2026 (chapitre 64, « Défendre la paix au Moyen-Orient ») propose, pour la
  France et l''Union européenne : exiger « le retrait total d''Israël de Gaza », l''arrêt de la construction de colonies
  et le démantèlement des colonies existantes en Cisjordanie ; demander « la suspension totale de l''accord d''association
  Union européenne – Israël » et l''interdiction de la commercialisation en Europe des produits issus des colonies ; sanctionner
  financièrement les colons et les investissements dans les colonies ; adopter « un embargo sur les livraisons d''armes
  et les matériels à double emploi » en application du Traité sur le commerce des armes, et des sanctions élargies contre
  des membres du gouvernement israélien ; une aide humanitaire et de reconstruction à Gaza sous contrôle des agences de
  l''ONU ; soutenir la Cour pénale internationale « dans ses poursuites contre les dirigeants du Hamas et plusieurs figures
  du gouvernement de Netanyahu » et mener une campagne pour l''application de ses mandats d''arrêt contre Benyamin Netanyahou
  et Yoav Gallant ; soutenir « une solution à deux États » et la réforme de l''Autorité palestinienne avec des élections
  sous contrôle international ; pour l''Iran, « relancer les négociations sur le programme nucléaire iranien et arrêter
  son programme d''enrichissement », en s''appuyant sur l''initiative de 21 pays arabes et musulmans du 17 juin 2025 pour
  un désarmement nucléaire de toute la région, Israël compris. Le texte parle de « génocide à Gaza » : c''est le vocabulaire
  du programme.'
