titre: Assurance maladie universelle, remboursement à 100 % des soins essentiels, fin des franchises (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 29, « Améliorer la prévention et le parcours de soin ») veut
  une assurance maladie « universelle », avec « un remboursement total des soins essentiels » à 100 % par l'Assurance maladie,
  la suppression des franchises, une couverture des mutuelles concentrée sur les soins optionnels, des dépassements d'honoraires
  limités à 50 % du tarif de la Sécurité sociale (et interdits pour la moitié des ménages les moins aisés) et la garantie
  de l'accès à l'Aide médicale d'État.
