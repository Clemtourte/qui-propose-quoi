titre: '« Un saut fédéral européen » : majorité qualifiée, budget de l''UE à 2 % du PIB européen en 2035 (programme du parti)'
texte: Le programme des Écologistes de juillet 2026 (chapitre 60, « Avancer vers une Europe fédérale ») propose de « Faire
  un saut fédéral européen » en remplaçant les droits de veto nationaux par une majorité qualifiée sur les droits fondamentaux,
  la protection sociale, l'intégration fiscale et la politique étrangère et de sécurité commune, de mettre fin à la règle
  d'un commissaire par État et de donner un droit d'initiative au Parlement européen. Il veut accélérer l'adhésion de l'Islande,
  des Balkans occidentaux, de la Moldavie et de l'Ukraine, et « Augmenter les moyens budgétaires de l'Union Européenne pour
  atteindre 2 % du PIB européen en 2035 et 5 % du PIB en 2050 » grâce à des ressources propres (mécanisme d'ajustement carbone
  aux frontières, taxation des grandes entreprises technologiques, taxe sur les déchets électroniques).
