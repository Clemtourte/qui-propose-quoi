titre: Garantie d'autonomie à 50 % du Smic net à la place du RSA, APL revalorisées de 10 % (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 32, « Lutter contre la pauvreté ») propose de « Créer une
  garantie d'autonomie [...] en remplacement du Revenu de Solidarité Active (RSA) », avec un montant porté à 50 % du Smic
  net et indexé sur son évolution, accessible dès 18 ans pour les personnes indépendantes fiscalement, sans la contrepartie
  de 15 heures d'activités hebdomadaires, avec des sanctions limitées aux fraudes avérées. Il propose aussi de revaloriser
  les APL de 10 % avec un mécanisme empêchant la répercussion sur les loyers, et d'automatiser le versement des aides sociales
  pour lutter contre le non-recours.
