candidat: tondelier
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Taxe Zucman, ISF vert et réforme du pacte Dutreil
citation:
  texte: On veut que le pacte Dutreil revienne à son état d'esprit de départ, favoriser la transmission familiale, mais pas servir d'optimisation fiscale
  date: 2026-08-27
  contexte: Débat des candidats organisé par le Medef, rapporté par franceinfo
texte: >-
  Programme économique adopté par Les Écologistes le 13 juillet 2026 (L'Opinion) : taxe Zucman de 2 % au-delà de
  100 millions d'euros de patrimoine, ISF vert, exit tax élargie, nouvelle tranche d'impôt sur le revenu à 60 % au-delà
  de 250 000 euros annuels et baisse des tranches les plus basses, deux tranches supplémentaires sur l'héritage, impôt
  minimal sur les bénéfices des sociétés de plus d'un milliard d'euros de chiffre d'affaires, TVA verte, suppression de
  l'abattement de 10 % des retraités, hausse de la flat tax. Lors du débat du Medef, elle veut changer le pacte Dutreil
  qu'elle juge « détourné ». Elle souhaite taxer les 1 % les plus riches, qui « paient proportionnellement à leurs
  revenus moins d'impôts que tout le reste des Français » (Reporterre).
date: 2026-08-27
sources: [lopinion-2026-07-13-programme-ecologistes, franceinfo-2026-09-02-vof-tondelier-dutreil, reporterre-2026-08-25-ecologie-partout]
appui:
  faits: >-
    Selon elle, les 1 % les plus riches « paient proportionnellement à leurs revenus moins d'impôts que tout le reste
    des Français ». Le programme du parti parle de « foyers riches qui paient proportionnellement moins d'impôt que les
    foyers modestes », sans citer de source.
  raisonnement: >-
    Le programme défend « une croissance des recettes fiscales permettant de financer un haut niveau de services publics
    et les investissements nécessaires à la transition écologique ».
  sources: [reporterre-2026-08-25-ecologie-partout, lesecologistes-2026-07-programme]
  donnees:
    - texte: >-
        Institut des politiques publiques (données de 2016) : taux d'imposition effectif progressif jusqu'à 46 % pour les
        0,1 % les plus riches, puis de 26 % pour les 0,0002 % les plus riches. Cette mesure diffère du seuil de 1 % cité par
        la candidate.
      sources: [ipp-2023-06-milliardaires]
