titre: Commandement militaire européen intégré, extension possible de la garantie nucléaire française, nouvelle LPM (programme
  du parti)
texte: 'Le programme des Écologistes de juillet 2026 (chapitre 61, « Faire évoluer l''armée française dans l''Europe de
  la défense ») affirme : « Nous ne pouvons pas nous priver de l''Alliance atlantique à court terme, mais elle n''est plus
  acquise dans sa forme historique ». Il propose de « Créer un commandement militaire intégré européen sous la tutelle du
  Conseil de l''Union Européenne sans capacité de mobiliser directement les armées nationales », en tenant compte du pilier
  européen de l''OTAN, d''actualiser le livre blanc et d''élaborer une nouvelle loi de programmation militaire, de préparer
  l''armée à une guerre de haute intensité en complémentarité avec d''autres pays européens (drones, artillerie, cyber,
  espace), de supprimer ou faire évoluer l''opération Sentinelle et de contrôler les exportations d''armes via un office
  parlementaire. Sur la dissuasion : relancer avec le Royaume-Uni une initiative de désarmement nucléaire multilatéral,
  rejoindre le Traité sur l''interdiction des armes nucléaires (TIAN) « en tant que membre observateur, sans s''engager
  à un désarmement unilatéral », « envisager l''extension de la garantie de sécurité nucléaire française à d''autres pays
  européens » dans l''hypothèse d''un retrait des armes nucléaires américaines, et « Conserver la décision d''emploi, sans
  délégation possible aux Etats partenaires ». Le programme ne chiffre pas le budget des armées.'
