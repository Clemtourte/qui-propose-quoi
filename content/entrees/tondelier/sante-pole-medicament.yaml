titre: Pôle public du médicament (programme du parti)
texte: Le programme des Écologistes de juillet 2026 (chapitre 30) propose de « Développer le pôle public du médicament »
  en élargissant la production de l'Ageps aux médicaments d'intérêt thérapeutique majeur en rupture d'approvisionnement
  et à ceux sous licence obligatoire, de renforcer l'ANSM et, au niveau européen, de créer un pôle public de recherche financé
  notamment par une taxe sur les médicaments sous brevets, avec des stocks obligatoires de quatre mois pour les médicaments
  d'intérêt thérapeutique majeur.
