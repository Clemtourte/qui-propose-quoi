titre: Loi de programmation et de réforme pour la justice du 23 mars 2019
texte: >-
  La loi n° 2019-222 du 23 mars 2019 est adoptée lorsqu'il est Premier ministre. Selon le rapport de la commission des
  lois de l'Assemblée nationale du 26 mars 2025, elle « a privé le juge correctionnel du pouvoir de prononcer des
  peines d'emprisonnement ferme inférieures à un mois et instauré le principe d'un aménagement quasi-systématique des
  peines inférieures ou égales à un an d'emprisonnement ».
date: 2019-03-23
sources: [an-2025-03-26-rapport-1187-peines]
