titre: Une vingtaine d'ordonnances dès juillet 2027
texte: >-
  Il prévoit de présenter une vingtaine d'ordonnances lors d'une session extraordinaire du Parlement en juillet
  2027, pour une entrée en vigueur « dès l'automne ». Il n'a pas précisé si sa réforme des retraites passerait par
  le Parlement, un référendum ou une ordonnance, mais annonce une concertation avec les partenaires sociaux. Sur
  l'immigration, il n'exclut pas un référendum s'il faut modifier la Constitution.
