titre: "Asile : pays sûrs et fin de l'asile à vie"
texte: >-
  Faire voter chaque année par le Parlement une liste de pays sûrs et mettre fin à l'asile à vie ; suspendre, pendant
  le quinquennat, l'enregistrement des demandes d'asile à Mayotte et en Guyane ; suspendre le droit du sol à Mayotte ;
  aligner les aides sociales versées aux étrangers sur la moyenne européenne. Sur France 2, il évoque une liste de pays
  sûrs établie par l'Union européenne.
date: 2026-10-08
sources: [edouardphilippe-2026-france-plus-sure, franceinfo-2026-10-08-philippe-heure-de-verite]
