titre: Fonction publique et assurance chômage
texte: >-
  Ne remplacer que deux départs à la retraite sur trois dans la fonction publique (plus de 250 000 postes en moins
  sur le quinquennat, selon son programme) et ramener la durée maximale d'indemnisation du chômage à 12 mois pour
  les moins de 50 ans, contre 18 mois actuellement selon son programme.
