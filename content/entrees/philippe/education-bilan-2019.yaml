titre: Instruction obligatoire à 3 ans et dédoublement des CP et CE1 en éducation prioritaire
texte: >-
  Lorsqu'il est Premier ministre, la loi du 26 juillet 2019 « pour une école de la confiance » abaisse l'âge de
  l'instruction obligatoire à 3 ans à partir de la rentrée 2019 ; 25 000 enfants jusque-là non scolarisés sont
  concernés. À la même rentrée, le dédoublement des classes de CP et de CE1 en éducation prioritaire (REP et REP+), engagé
  deux ans plus tôt, concerne 300 000 élèves et 10 800 classes, selon le ministère.
date: '2019-08-30'
