titre: '« Massifier nos armées » : 250 000 réservistes, 50 000 places de service militaire volontaire, nouvelle LPM'
texte: Sur la page « Pour une France plus sûre » de son site de campagne, la priorité « Massifier nos armées pour garantir
  la sécurité et la puissance de la France » propose de « Porter le nombre de réservistes de 45 000 à 250 000 et le service
  militaire volontaire de 3 000 à 50 000 places par an », de massifier la production et l'achat de drones tactiques (sur
  le modèle d'un programme américain de 300 000 drones), de « dépasser l'objectif actuel de 100 000 obus par an » vers l'échelle
  des 700 000 produits par l'Allemagne, de doubler le nombre de navires aux Antilles et de voter une nouvelle loi de programmation
  militaire, la loi actuelle, qui « épaissit les armées sans les étendre ». La page ne donne aucun budget (en % du PIB ou
  en milliards d'euros) et ne mentionne ni l'OTAN, ni l'Europe de la défense, ni la dissuasion nucléaire.
