titre: Achever le marché unique, union des marchés de capitaux, protéger le marché européen face à la Chine
texte: Son site de campagne propose d'« Achever le marché unique européen en supprimant les spécifications nationales »
  (qui jouent selon la page le rôle de droits de douane), de « Construire une union européenne des marchés de capitaux pour
  financer l'innovation et la prospérité européenne » et de « Protéger le marché européen face à la concurrence déloyale
  chinoise » par des transferts de technologie, des quotas de production et des coentreprises dans les secteurs stratégiques
  (automobile, sidérurgie, nucléaire). La page « Pour une France plus conquérante » propose de porter un « Buy European
  Tech Act » et de mutualiser les achats technologiques entre pays de l'Union. Rien n'est précisé sur le budget européen,
  les traités ou la contribution française.
