  donnees:
    - texte: >-
        Caisse nationale d'assurance maladie, citée par Public Sénat : de 2019 à 2023, 58 % de la hausse du coût des arrêts vient de facteurs démographiques
        et économiques (actifs plus nombreux et plus âgés, salaires), 42 % d'un recours accru et d'arrêts plus longs. Coût en 2022 : 12 Md€, contre 7,69 Md€
        en 2017, hors accidents du travail et maternité.
