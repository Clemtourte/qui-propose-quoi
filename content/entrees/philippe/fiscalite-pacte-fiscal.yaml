candidat: philippe
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: "Pacte fiscal : 50 Md€ de baisse des impôts de production"
texte: >-
  Baisser de 50 milliards d'euros les impôts de production, contre 50 milliards d'euros d'« aides publiques
  improductives » en moins (termes du programme). Moratoire fiscal : aucun nouvel impôt pendant le quinquennat.
  Lorsqu'une entreprise décide, après discussion interne, de travailler plus longtemps, exonérer ces heures de
  cotisations sociales et d'impôt sur le revenu.
chiffres:
  - libelle: Baisse des impôts de production
    valeur: 50 Md€
    nature: position
questions: [budget, impots]
reperes:
- question: budget
  mesure: >-
    50 Md€ de baisse des impôts de production
  equivalent: >-
    environ 720 € par habitant, soit 1,7 % du PIB de 2025 ; 2,9 % des dépenses publiques de 2025
  calcul: >-
    50 Md€ / 69,082 millions d'habitants = 720 € ; 50 / 2990 Md€ de PIB = 1,7 % ; 50 / 1 714,2 Md€ de dépenses publiques = 2,9 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Horizon non précisé dans la source (programme).
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026
sources: [edouardphilippe-2026-france-plus-prospere]
appui:
  faits: >-
    Son programme parle du « plus grand choc de compétitivité jamais réalisé », sans lister dans la page lue les aides
    qualifiées d'« improductives » ni détailler le calcul.
  raisonnement: « Libérer nos entreprises du poids des impôts et de la bureaucratie ».
  sources: [edouardphilippe-2026-france-plus-prospere]
  donnees:
    - texte: >-
        Aides aux entreprises en 2023 : au moins 211 Md€ selon la commission d'enquête du Sénat, 112 Md€ selon le
        Haut-commissariat au Plan, qui exclut les allègements de cotisations. Il n'existe pas de définition officielle d'une
        aide. Impôts de production : 3,6 % de la valeur ajoutée des entreprises en France et 0,5 % en Allemagne (Conseil
        d'analyse économique, juin 2019).
      sources: [publicsenat-2025-09-15-aides-211-milliards, cae-2019-06-impots-production]
