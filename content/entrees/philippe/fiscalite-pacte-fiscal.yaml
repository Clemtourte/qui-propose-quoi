titre: "Pacte fiscal : 50 Md€ de baisse des impôts de production"
texte: >-
  Baisser de 50 milliards d'euros les impôts de production, contre 50 milliards d'euros d'« aides publiques
  improductives » en moins (termes du programme). Moratoire fiscal : aucun nouvel impôt pendant le quinquennat.
  Lorsqu'une entreprise décide, après discussion interne, de travailler plus longtemps, exonérer ces heures de
  cotisations sociales et d'impôt sur le revenu.
