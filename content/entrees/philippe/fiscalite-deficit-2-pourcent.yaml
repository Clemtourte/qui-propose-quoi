titre: Déficit à 2 % du PIB et règle d'or par référendum
citation:
  texte: Il faut remettre nos comptes en ordre
  date: 2026-10-08
  contexte: Émission « L'Heure de vérité », France 2
texte: >-
  Il vise un déficit ramené de plus de 5 % à 2 % du PIB à la fin du quinquennat, et une règle d'or de maîtrise
  des déficits inscrite dans la Constitution par référendum. L'effort serait porté pour moitié par les dépenses
  sociales, pour un quart par l'État et les collectivités, pour un quart par la croissance.
date: 2026-10-08
sources: [edouardphilippe-2026-france-plus-prospere, franceinfo-2026-10-08-philippe-heure-de-verite]
