titre: "Premier ministre : 49.3 sur le système universel de retraite (2020)"
texte: >-
  Le 29 février 2020, il engage la responsabilité du gouvernement (article 49.3) sur le projet de loi instituant
  un système universel de retraite. Le 16 mars 2020, lors d'une allocution consacrée au Covid-19, Emmanuel Macron
  annonce la suspension de toutes les réformes en cours, « à commencer par la réforme des retraites ». Le projet
  est ensuite abandonné.
date: 2020-02-29
