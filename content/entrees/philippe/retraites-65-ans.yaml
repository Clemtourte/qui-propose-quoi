candidat: philippe
theme: retraites
rubrique: mesure
nature: position
titre: 65 ans et 45 annuités en moins de dix ans
citation:
  texte: Je propose de porter progressivement la durée de cotisation à 45 ans, et l'âge de départ à 65 ans pour les Français qui le peuvent
  date: 2026-09-29
  contexte: Vidéo « Retraites, ma réforme pour sauver le système » publiée sur sa chaîne YouTube, rapportée par franceinfo
texte: >-
  Il reprendrait d'abord la réforme de 2023 (64 ans, 43 annuités). Selon son programme, un Français sur trois
  pourrait partir avant 65 ans (carrières longues, incapacité, invalidité, handicap). Il propose un système « mixte » :
  capitalisation collective généralisée aux salariés et plan d'épargne retraite ouvert à chaque Français, avec un
  premier versement de l'État de 500 euros dès le premier emploi, sans hausse des cotisations ni baisse générale
  des pensions.
chiffres:
  - libelle: Gain annoncé en année pleine, selon le candidat
    valeur: environ 30 Md€
    nature: position
date: 2026-09-29
sources: [franceinfo-2026-09-30-philippe-65-ans, lcp-2026-09-29-philippe-retraites, edouardphilippe-2026-france-plus-prospere, franceinfo-2026-09-30-retraites-candidats]
appui:
  texte: >-
    Il rappelle que « 65 ans, c'était l'âge de départ à la retraite en 1983 » et que « nous vivons aujourd'hui en
    moyenne huit ans de plus ». Il veut « retrouver l'équilibre de notre système par répartition » et estime le gain
    à environ 30 milliards d'euros en année pleine (franceinfo). Le calcul n'est pas détaillé dans les articles lus
    ; sa vidéo de vingt minutes n'a pas été visionnée.
  sources: [lcp-2026-09-29-philippe-retraites, franceinfo-2026-09-30-retraites-candidats]
