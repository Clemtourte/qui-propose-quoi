titre: "Narcotrafic : « état d'urgence narco » et excuse de minorité levée"
texte: >-
  Son programme prévoit un « état d'urgence narco », avec des moyens juridiques d'exception limités dans le temps et
  dans l'espace, « allant jusqu'à l'utilisation ciblée de la reconnaissance faciale » ; une « fiche S financière »
  pour les personnes condamnées pour narcotrafic ; la levée de l'excuse de minorité et la comparution immédiate des
  mineurs pour les faits liés au narcotrafic ; l'alignement de l'application des peines des grands narcotrafiquants
  sur celle des terroristes ; le recouvrement forcé des amendes sur les prestations sociales ; des opérations « place
  nette » contre les consommateurs dans les boîtes de nuit et les festivals.
date: 2026
sources: [edouardphilippe-2026-france-plus-sure]
