titre: 'Premier ministre : projet de réforme des institutions (2018-2019)'
texte: >-
  Le 4 avril 2018, il présente la réforme des institutions voulue par Emmanuel Macron : nombre de parlementaires
  réduit de 30 %, 15 % des députés élus à la proportionnelle, non-cumul des mandats dans le temps. Le projet est
  bloqué en juillet 2018, pendant l'affaire Benalla. La nouvelle version annoncée en 2019 réduit la baisse à 25
  %, porte la proportionnelle à 20 % et abaisse le seuil du référendum d'initiative partagée.
