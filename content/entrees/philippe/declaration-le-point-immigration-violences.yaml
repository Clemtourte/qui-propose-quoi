texte: >-
  Dans le même entretien, il évoque une « surreprésentation de jeunes issus de l'immigration » lors des violences en
  marge de la mobilisation du 17 octobre (Le JDD, Entrevue) et défend un programme migratoire restrictif (voir le
  thème immigration). Olivier Faure, premier secrétaire du PS, l'accuse de dériver « dans les eaux noires des préjugés
  racistes ». L'entretien original n'a pas été lu.
