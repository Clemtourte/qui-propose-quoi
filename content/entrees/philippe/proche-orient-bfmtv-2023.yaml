titre: « Israël a le droit d'exister et de se défendre » (BFMTV, novembre 2023)
texte: 'Le 12 novembre 2023 sur BFMTV, ancien Premier ministre, Édouard Philippe dit : « C''est un acte de guerre qui a
  été lancé par le Hamas », « Israël est en guerre, et dans la guerre il y a des morts » et « Israël a le droit d''exister
  et de se défendre » (Times of Israel avec AFP, 13 novembre 2023). Selon l''article, il s''oppose ainsi à Emmanuel Macron,
  qui avait exhorté Israël à envisager un cessez-le-feu ; il n''est pas cité sur ce point. Propos de 2023, antérieurs à
  sa candidature. Un site pro-israélien (IsraelValley) lui prête en juillet 2025 une critique de la reconnaissance de la
  Palestine, présentée comme un « pari » : paraphrase sans source, non reprise. Aucune déclaration de 2026 sur Gaza, la
  Cisjordanie ou l''Iran n''a été trouvée.'
