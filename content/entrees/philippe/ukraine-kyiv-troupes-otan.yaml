titre: Troupes européennes après la guerre, adhésion de l'Ukraine à l'OTAN comme « la meilleure garantie de sécurité »
texte: 'Lors d''un déplacement à Kyiv (26 mai 2026), il soutient le déploiement de troupes européennes en Ukraine après
  la guerre pour dissuader la Russie de reprendre ses attaques, appelle l''armée ukrainienne « l''armée la plus aguerrie
  d''Europe » et promet de travailler à l''adhésion de l''Ukraine à l''OTAN, « la meilleure garantie de sécurité » ; selon
  Volodymyr Zelensky, les deux hommes ont aussi parlé de l''adhésion à l''Union européenne (Euronews). Le 5 septembre 2026,
  il dit : « Couper le robinet à l''Ukraine, c''est servir la Russie » et que l''affaiblir « menace la sécurité de l''Europe
  et de la France » (franceinfo). Ni montant d''aide ni position sur les sanctions n''ont été trouvés.'
