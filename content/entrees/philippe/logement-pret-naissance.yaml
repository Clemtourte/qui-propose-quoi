titre: Un prêt à taux zéro pour chaque naissance
texte: Dans la partie « politique familiale » de la page « Pour une France plus attentive à ses enfants » de son site de
  campagne, il propose de « Faciliter le déménagement des familles qui s'agrandissent grâce à un prêt à taux zéro pour chaque
  naissance ». La page ne donne ni montant, ni conditions, ni coût. Aucune autre proposition de logement n'a été trouvée
  sur les quatre pages de priorités de son site.
