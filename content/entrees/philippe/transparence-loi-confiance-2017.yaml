titre: Loi organique du 15 septembre 2017 pour la confiance dans la vie politique, signée comme Premier ministre
texte: 'La loi organique n° 2017-1338 du 15 septembre 2017 pour la confiance dans la vie politique porte la signature d''Édouard
  Philippe, alors Premier ministre, et de la garde des sceaux Nicole Belloubet. La page de Légifrance lue n''affichait pas
  le texte de ses articles (inéligibilité, emplois de collaborateurs, attestation de situation fiscale des parlementaires)
  : leur contenu n''est pas détaillé ici. Aucune proposition de transparence de la vie publique pour 2027 n''a été trouvée.'
date: '2017-09-15'
