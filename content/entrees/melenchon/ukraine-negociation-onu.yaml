titre: Cessez-le-feu et paix négociée sous l'égide de l'ONU, refus d'être cobelligérant, réserves sur les frappes en profondeur
texte: La synthèse des contributions du programme de sa campagne (chapitre 16) indique, pour l'Ukraine, un cadre diplomatique
  pour obtenir un cessez-le-feu, le retrait des troupes russes et l'ouverture de négociations pour une paix durable, et
  réaffirme « la primauté de l'Organisation des Nations unies » ; elle refuse aussi toute intervention militaire sans mandat
  de l'ONU. Le 18 juin 2026 sur France 2, il juge « très imprudent d'accepter que l'Ukraine fasse des tirs en profondeur
  sur le territoire de la Russie » (franceinfo). En octobre 2026, franceinfo rapporte qu'il refuse que la France devienne
  cobelligérante (« un danger immense dont nous ne voulons pas »). Les pages lues ne parlent ni du montant de l'aide, ni
  des livraisons d'armes, ni des sanctions.
