titre: "« Epstine » : la prononciation d'un nom en meeting et les accusations d'antisémitisme"
citation:
  texte: Alors maintenant, vous direz Epstine au lieu d'Epstein, Frankenstine au lieu de Frankenstein
  date: 2026-02-26
  contexte: Meeting à Lyon, rapporté par l'AFP
texte: >-
  Selon l'AFP, il ironise sur la prononciation du nom de Jeffrey Epstein, et ce n'est pas la première fois. Yonathan Arfi, président du Crif,
  y voit un « délire complotiste aux vrais relents antisémites » ; Gabriel Attal dit que « toutes les limites ont été franchies » ; Jordan
  Bardella parle de « relents ouvertement antisémites ». Jean-Luc Mélenchon réfute et dénonce une « manipulation médiatique ».
date: 2026-02-27
