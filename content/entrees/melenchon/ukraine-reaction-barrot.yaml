titre: 'Barrot : « Monsieur Mélenchon a choisi son camp »'
texte: 'Il répond aux propos de Jean-Luc Mélenchon sur les frappes ukrainiennes : « Les masques tombent. Monsieur Mélenchon
  a choisi son camp », « ce n''est pas le camp de la résistance, c''est celui de l''oppresseur », et lui reproche de ne
  pas avoir dénoncé les attaques répétées de Vladimir Poutine contre les civils ukrainiens.'
