candidat: melenchon
theme: immigration
rubrique: mesure
nature: position
titre: "Programme de 2024 : régularisations, carte de séjour de dix ans, droit du sol intégral"
texte: >-
  Le programme du Nouveau Front populaire (législatives de 2024), republié sur son site de campagne, prévoit
  d'abroger les lois asile et immigration de Macron, de régulariser les travailleurs, étudiants et parents
  d'enfants scolarisés, d'instituer la carte de séjour de dix ans comme titre de référence, d'autoriser les
  demandeurs d'asile à travailler et de garantir le droit du sol intégral. Ce programme de coalition est une
  référence ancienne. L'édition 2025 de L'Avenir en commun, listée sur le même site, n'a pas pu être consultée
  (pages indisponibles le 19 octobre 2026). Sa nouvelle version, programme « de la Nouvelle France », doit
  paraître le 6 novembre 2026.
date: 2024-06
sources: [nfp-2024-contrat-legislature, lcp-2026-09-23-programme-nouvelle-france]
appui:
  faits: >-
    Le programme de 2024 énonce les mesures sans citer de chiffre. Bloc provisoire : le programme attendu en novembre 2026
    pourra exposer d'autres fondements.
  sources: [nfp-2024-contrat-legislature]
  donnees:
    - texte: >-
        Direction générale des étrangers en France, citée par Public Sénat : 28 610 régularisations en 2025 (−10,1 % sur un
        an).
      sources: [publicsenat-2026-01-27-regularisations-2025]
