titre: « La France doit refuser la guerre et n'y aider d'aucune façon » (28 février 2026)
texte: 'Le 28 février 2026, jour des frappes, Jean-Luc Mélenchon écrit sur X : « Les États-Unis et Israël ont engagé une
  guerre contre l''Iran. Quels sont leurs objectifs ? Une fois de plus ni les libertés démocratiques ni le désarmement dans
  la région, mais le pétrole, les rapports de force en Asie-Pacifique et au Moyen-Orient ! » ; « La guerre n''est pas la
  solution, mais le problème » ; « le désarmement nucléaire global de la région reste l''impératif absolu. La communauté
  internationale doit reprendre le contrôle politique de la situation. La France doit refuser la guerre et n''y aider d''aucune
  façon. » Les motifs prêtés aux États-Unis et à Israël sont l''analyse de l''auteur du message.'
