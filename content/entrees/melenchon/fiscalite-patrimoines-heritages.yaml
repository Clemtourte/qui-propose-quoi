candidat: melenchon
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Impôts sur les patrimoines, les héritages et le capital
citation:
  texte: le capital financier a profité et c'est lui qui doit payer
  date: 2026-10-14
  contexte: Conférence de presse de présentation du budget rectificatif de LFI, à Paris
texte: >-
  Principales recettes annoncées, selon LFI : rabot de niches fiscales dont le pacte Dutreil et le crédit d'impôt
  recherche (22 Md€), taxe sur les héritages (20 Md€), taxe Zucman sur les patrimoines de plus de 100 millions
  d'euros (15 Md€), « ISF climatique » (10 Md€), suppression de la flat tax (9 Md€), taxe sur les transactions
  financières (5 Md€), impôt sur les sociétés plus progressif (3 Md€), taxe sur les Gafam portée à 15 %
  (montant non précisé).
date: 2026-10-14
sources: [lcp-2026-10-14-contre-budget-lfi, publicsenat-2026-10-14-contre-budget-lfi]
appui:
  faits: >-
    Éric Coquerel juge ces recettes « raisonnables » et « crédibles ». Le calcul des rendements n'est pas publié dans
    les sources lues ; la nouvelle version du programme est annoncée pour les 6 et 7 novembre 2026.
  raisonnement: >-
    Il présente un « cercle vertueux de la relance écologique et sociale », que l'AFP décrit comme une politique de la
    demande.
  sources: [lagazettefrance-2026-10-14-afp-economistes-lfi]
  donnees:
    - texte: >-
        Institut des politiques publiques (données de 2016) : taux d'imposition effectif de 46 % pour les 0,1 % les plus
        riches et de 26 % pour les 0,0002 % les plus riches. Eurostat, cité par franceinfo : les droits de succession et de
        donation rapportent environ 20 Md€.
      sources: [ipp-2023-06-milliardaires, franceinfo-2026-08-25-vdf-glucksmann-heritages]
