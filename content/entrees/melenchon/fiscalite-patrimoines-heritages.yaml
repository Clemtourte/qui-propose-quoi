titre: Impôts sur les patrimoines, les héritages et le capital
citation:
  texte: le capital financier a profité et c'est lui qui doit payer
  date: 2026-10-14
  contexte: Conférence de presse de présentation du budget rectificatif de LFI, à Paris
texte: >-
  Principales recettes annoncées, selon LFI : rabot de niches fiscales dont le pacte Dutreil et le crédit d'impôt
  recherche (22 Md€), taxe sur les héritages (20 Md€), taxe Zucman sur les patrimoines de plus de 100 millions
  d'euros (15 Md€), « ISF climatique » (10 Md€), suppression de la flat tax (9 Md€), taxe sur les transactions
  financières (5 Md€), impôt sur les sociétés plus progressif (3 Md€), taxe sur les Gafam portée à 15 %
  (montant non précisé).
