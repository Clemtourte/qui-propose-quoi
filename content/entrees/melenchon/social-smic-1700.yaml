titre: '« État d''urgence sociale » : Smic à 1 700 € net, échelle mobile des salaires, blocage du prix des carburants'
texte: 'Le 12 septembre 2026, à la Fête de l''Humanité, il évoque la possibilité de « décréter l''État d''urgence sociale
  ». Selon franceinfo (17 septembre), les mesures comprennent le blocage du prix du carburant, l''encadrement des marges
  des distributeurs, un Smic à 1 700 € net, une échelle mobile des salaires (Aurélie Trouvé, LFI : « à chaque fois qu''il
  y a des augmentations de prix, il y a des augmentations de salaires ») et la taxation des plus hautes fortunes. L''article
  ne parle ni d''assurance chômage ni de minima sociaux. D''autres sources de campagne évoquent un Smic à 1 600 € net :
  l''écart entre les deux montants n''est pas expliqué.'
