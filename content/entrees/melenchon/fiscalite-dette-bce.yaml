titre: Dette détenue par la Banque centrale européenne
texte: >-
  Lors du débat du 27 août 2026, il propose, selon franceinfo, d'annuler une partie de la dette de la France
  auprès de la BCE. Le 14 octobre 2026, le député LFI Éric Coquerel confirme la volonté d'« annuler, ou de geler »
  la dette française détenue par la BCE.
