titre: "Budget rectificatif : 106,4 Md€ de recettes nouvelles, 81,7 Md€ de dépenses nouvelles"
texte: >-
  Présenté le 14 octobre 2026 comme base d'une loi de finances rectificative en cas de victoire. LFI affecte
  25 milliards d'euros à la réduction de la dette dans ce budget (LCP écrit « chaque année », Public Sénat
  « la première année ») et indique, selon LCP, que cela ramènerait le déficit à 5 % du PIB. Dépenses citées :
  hausse du point d'indice des fonctionnaires (17 Md€), « garantie d'autonomie » de 1 337 euros par mois pour
  les jeunes (9,5 Md€ par an), indexation des pensions et prestations sociales et hausse de 10 % des APL
  (8 Md€, ventilation non précisée). Le programme présidentiel complet est attendu en novembre 2026, son
  chiffrage début 2027.
