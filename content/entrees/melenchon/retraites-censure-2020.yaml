candidat: melenchon
theme: retraites
rubrique: bilan
nature: fait
titre: Motion de censure du 3 mars 2020 contre le projet de système universel de retraite
texte: >-
  Député, il dépose avec André Chassaigne, Valérie Rabault et 60 autres députés la motion de censure présentée
  après le recours au 49.3 sur le projet de loi instituant un système universel de retraite. Il la vote, comme
  les 17 députés de son groupe, lui compris. La motion obtient 91 voix et n'est pas adoptée.
date: 2020-03-03
sources: [an-scrutin-15-2707-censure-2020-03-03, franceinfo-2020-02-29-philippe-49-3]
