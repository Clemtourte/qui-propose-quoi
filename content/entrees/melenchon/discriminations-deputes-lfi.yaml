candidat: melenchon
rubrique: discriminations
nature: fait
titre: "Députés LFI : le message de David Guiraud et le signalement visant Thomas Portes"
texte: >-
  En janvier 2024, David Guiraud publie puis supprime un message évoquant les « dragons célestes », personnages de manga. Le Times of Israël y
  voit une métaphore antisémite. Il répond : « Les dragons célestes ne sont pas une religion ou une "race". » En mars 2024, Caroline Yadan et des
  députés Renaissance signalent à la procureure de Paris Thomas Portes, à qui ils reprochent une fausse information sur une personne visée ensuite
  par des menaces de mort. Il a supprimé son message. L'issue de ce signalement n'a pas été trouvée. Aucune condamnation d'un député LFI pour
  racisme ou antisémitisme n'a été trouvée.
date: 2024-03-25
sources: [timesofisrael-2024-01-guiraud, timesofisrael-2024-03-25-portes]
