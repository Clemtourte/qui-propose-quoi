titre: 100 000 hospitaliers de plus, réouverture de lits, 300 000 postes médico-sociaux (programme de 2022)
texte: 'Programme de 2022, selon LCP : rendre effective la fin du numerus clausus, 100 000 hospitaliers supplémentaires,
  la réouverture de lits d''hôpitaux, 300 000 postes supplémentaires dans le médico-social et les Ehpad sur plusieurs années,
  une « garantie d''autonomie de 1063 euros » pour les étudiants en médecine et un « plan national de la psychiatrie et
  de la pédopsychiatrie ». Leur reprise dans le projet de 2027 n''est pas documentée.'
