titre: « C'est Israël qui attaque tous ses voisins [...] c'est lui qui fait un génocide » ; « L'Iran n'a envahi personne
  » (LCI, mai 2026)
texte: 'Dans un entretien sur LCI rapporté par The Times of Israel le 11 mai 2026 (peu après l''annonce de sa candidature),
  à la question du pays le plus dangereux de la région, Jean-Luc Mélenchon répond « Israël sans aucun doute » : « C''est
  Israël qui attaque tous ses voisins, c''est lui qui déclenche la guerre, c''est lui qui fait un génocide », puis précise
  viser « le gouvernement de Monsieur Netanyahou » (« Monsieur Netanyahu et sa bande de fascistes »). Sur l''Iran : « L''Iran
  n''a envahi personne » ; rappelé que l''Iran soutient des groupes comme le Hezbollah, il répond « C''est vrai » ; il se
  dit « contre le fait qu''ils aient une arme nucléaire ». Il dit aussi : « Ou c''est le droit international, ou c''est
  la loi du plus fort » et « tout régime qui nous déplaît fera l''objet d''une intervention militaire pour le changer ».
  Selon franceinfo (11 mars 2026), son groupe parlementaire LFI affirme que la guerre a été décidée « uniquement par » Donald
  Trump et Benyamin Netanyahou et demande que la France « ne mette pas un doigt dans une guerre illégale » (Mathilde Panot).
  Les mesures précises (sanctions, ventes d''armes) ne figurent pas dans les sources lues.'
