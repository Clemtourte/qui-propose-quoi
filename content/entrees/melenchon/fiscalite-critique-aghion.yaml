titre: Critique de l'annulation de la dette détenue par la BCE par un économiste
texte: >-
  Selon lui, la proposition de LFI d'annuler une partie de la dette française détenue par la BCE conduirait « tout
  droit à la banqueroute et à l'éclatement de la zone euro ». Jean-Luc Mélenchon a répondu en qualifiant le prix
  reçu par l'économiste de « soi-disant prix Nobel d'économie ».
