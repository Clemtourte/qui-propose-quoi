titre: 200 000 logements publics, encadrement des loyers sur tout le territoire, garantie universelle des loyers (groupe
  LFI)
texte: 'Dans une brochure de mars 2026, le groupe parlementaire LFI à l''Assemblée nationale dit proposer notamment : «
  la construction de 200 000 logements publics », « l''encadrement des loyers sur tout le territoire et à la baisse en zones
  tendues », « la mise en place de la Garantie Universelle des Loyers », « l''interdiction des expulsions sans relogement
  et l''abrogation de la loi Kasbarian-Bergé », « l''extension aux maires du pouvoir de réquisition des logements vacants
  » et « la hausse du nombre de quotas de logements sociaux obligatoires, notamment à destination des jeunes et des personnes
  en situation de handicap ». Le document cite une proposition de loi pour rendre effectif le droit au logement déposée
  le 21 janvier 2020 par Jean-Luc Mélenchon. Ce n''est pas le programme de sa campagne, dont la nouvelle version est attendue
  le 6 novembre 2026 ; ni le coût ni le calendrier ne sont donnés.'
