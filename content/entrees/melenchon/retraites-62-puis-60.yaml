candidat: melenchon
theme: retraites
rubrique: mesure
nature: position
titre: Retour à 62 ans, puis à 60 ans
citation:
  texte: Nous reviendrons dans un premier temps à 62 ans, et le but est de revenir plus vite à 60 ans
  date: 2026-08-27
  contexte: Débat des candidats organisé par le Medef, diffusé sur LCI
texte: >-
  Il propose d'abroger la réforme de 2023, puis de revenir à la retraite à 60 ans avec 40 annuités dans la suite
  du mandat. Le coût du retour à 60 ans n'est pas chiffré dans les sources consultées.
chiffres:
  - libelle: Coût du retour à 62 ans, selon LFI (14 octobre 2026)
    valeur: 9 Md€
    nature: position
questions: [financement]
reperes:
- question: financement
  mesure: >-
    9 Md€ de coût du retour à 62 ans, selon LFI
  equivalent: >-
    environ 130 € par habitant, soit 0,30 % du PIB de 2025 ; 0,53 % des dépenses publiques de 2025
  calcul: >-
    9 Md€ / 69,082 millions d'habitants = 130 € ; 9 / 2990 Md€ de PIB = 0,30 % ; 9 / 1 714,2 Md€ de dépenses publiques = 0,53 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Année de référence du coût non précisée dans les sources.
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-08-27
sources: [franceinfo-2026-08-27-debat-medef, franceinfo-2026-10-12-retraites-candidats, publicsenat-2026-10-14-contre-budget-lfi]
appui:
  faits: Aucune donnée ni étude citée dans les sources lues, en dehors du coût de 9 Md€ annoncé par LFI.
  raisonnement: >-
    Il défend un principe : « Le temps libre des retraités, c'est du travail civique, du temps familial. Ce n'est
    pas du temps perdu ». Sur le financement du retour à 60 ans : « Une fois qu'on a regardé combien il faut, on
    sait combien il faut prendre et on sait à qui ».
  sources: [lcp-2026-09-16-retraites-candidats, franceinfo-2026-10-12-retraites-candidats]
  donnees:
    - texte: >-
        Cour des comptes (20 février 2025, avant la suspension de la réforme de 2023) : avancer d'un an l'âge
        d'ouverture des droits (63 ans au lieu de 64) coûterait 13 Md€ à l'ensemble des finances publiques en 2035.
        Cette estimation ne porte pas sur un retour à 62 ans.
      sources: [ccomptes-2025-02-20-situation-retraites]
