titre: Conditionner la contribution française au budget de l'UE, « opt out » des traités, refus du libre-échange
texte: 'Le chapitre 17 (« Europe ») de la synthèse des contributions du programme de sa campagne classe parmi les contributions
  « déjà présentes dans le programme actuel » : « Le conditionnement de la contribution française au budget de l''Union
  européenne », la possibilité d''« Opt Out » sur les dispositions des traités qui empêchent d''appliquer le programme,
  en matière sociale comme environnementale, et « Abroger les accords de libre-échange déjà en vigueur ». Les pages lues
  ne parlent ni du plan A et du plan B, ni de référendum, ni de défense européenne, et ne chiffrent pas la contribution.'
