titre: Inéligibilité des condamnés pour corruption, interdiction du pantouflage, plan national contre la corruption (6e
  République, 2025)
texte: 'L''insoumission (8 avril 2025), présentant les propositions de LFI pour une 6e République, rapporte : « l''inéligibilité
  pour toute personne condamnée pour corruption », « le durcissement des règles sur les conflits d''intérêt », « l''interdiction
  du pantouflage » et « la mise en place d''un plan national de lutte contre la corruption et les délits de probité » ;
  « le principe de non-cumul des mandats et des indemnités devra être rendu effectif ». L''article ne dit rien du lobbying
  ni de la HATVP. Texte de 2025 d''un média proche du mouvement. Aucune déclaration de 2026 de Jean-Luc Mélenchon sur le
  sujet n''a été trouvée.'
