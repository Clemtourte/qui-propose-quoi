titre: Assemblée constituante et référendum révocatoire
texte: >-
  Selon la synthèse des contributions publiée par sa campagne le 17 juillet 2026, le programme actuel de La France
  insoumise prévoit de réunir une assemblée constituante pour passer à la 6e République, son projet de Constitution
  étant validé par référendum, d'instaurer le référendum révocatoire des élus, de reconnaître le vote blanc et de
  recourir aux conventions citoyennes.
