titre: "Dans la manifestation du 24 octobre, à un journaliste de BFMTV : « Allez faire du racisme à la télé »"
citation:
  texte: >-
    Et vous, BFM, commencez à vous calmer sur les remarques racistes de toute sorte parce que ça commence à bien faire.
  date: 2026-10-24
  contexte: Manifestation parisienne de « l'acte II » de la mobilisation contre la vie chère, en réponse à une question sur le mouvement lycéen
texte: >-
