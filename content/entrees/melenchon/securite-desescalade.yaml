candidat: melenchon
theme: securite-justice
rubrique: mesure
nature: position
titre: "Maintien de l'ordre : « retenue » et « désescalade »"
texte: >-
  La France insoumise défend « une doctrine de retenue et de désescalade » et veut « réhabiliter la doctrine française
  du maintien de l'ordre fondée sur le triptyque : mise à distance des manifestants, intervention collective et sur
  ordre, emploi graduel et réversible de la force ». Elle propose d'interdire l'usage des LBD « et autres grenades » et
  de dissoudre la Brav-M. Son livret « Sécurité » de 2022 appelait à « refonder une police républicaine » et à
  rétablir la police de proximité ; celui de 2027 doit paraître début novembre 2026.
date: 2026-10-19
sources: [lfi-2025-08-15-desintox-maintien-ordre, lcp-2026-10-19-maintien-ordre-propositions]
