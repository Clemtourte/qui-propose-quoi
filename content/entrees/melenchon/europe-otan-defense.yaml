titre: Sortie de l'OTAN en commençant par son commandement intégré, désarmement nucléaire multilatéral, matériel militaire
  français
texte: 'Les pages de synthèse des contributions du programme de sa campagne (melenchon2027.fr, chapitre 16) classent parmi
  les contributions « déjà présentes dans le programme actuel » : « Sortir de l''OTAN en commençant par son commandement
  intégré » (37 contributions sur 84), « Stopper l''alignement de la France sur l''atlantisme de l''Union Européenne »,
  « Garantir la souveraineté de la France via l''acquisition de matériel militaire français » avec un pôle public de l''armement,
  et « Relancer les processus multilatéraux de désarmement nucléaire » à l''ONU ; le programme refuse aussi toute intervention
  militaire sans mandat de l''ONU. Les pages lues ne parlent ni de budget des armées ni de dissuasion nucléaire française.
  Le 3 mars 2025, le député LFI Aurélien Saintoul qualifie d''« illogisme » l''extension de la dissuasion française à l''Europe
  (Toute l''Europe).'
