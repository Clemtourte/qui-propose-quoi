candidat: melenchon
theme: ecologie-energie
rubrique: mesure
nature: position
titre: Renationaliser EDF et Engie ; sortie du nucléaire (2022)
texte: >-
  Selon la synthèse publiée par sa campagne le 17 juillet 2026, le programme actuel prévoit d'« annuler la libéralisation
  du marché de l'électricité et renationaliser EDF et Engie » et de mettre en place des tarifs réglementés de l'énergie
  « avec des objectifs sociaux ». En 2022, il proposait de planifier le démantèlement des centrales nucléaires et
  de développer l'éolien en mer comme alternative (LCP). Le calendrier de sortie du nucléaire pour 2027 n'est pas
  documenté.
questions: [nucleaire, prix]
date: '2026-07-17'
sources:
- lfi-2026-07-17-synthese-chapitre-13
- lcp-2022-03-24-candidats-energie
appui:
  faits: >-
    La synthèse de campagne énonce la mesure sans chiffre. Bloc provisoire : le programme est attendu en novembre 2026.
  sources: [lfi-2026-07-17-synthese-chapitre-13]
  donnees:
    - texte: >-
        Autorité des marchés financiers, citée par l'AFP : depuis le retrait obligatoire du 8 juin 2023, l'État détient 100 % du
        capital d'EDF, pour une opération chiffrée à 9,7 Md€. La part actuelle de l'État dans Engie n'a pas été vérifiée.
      sources: [afp-2023-05-26-edf-retrait-obligatoire]
