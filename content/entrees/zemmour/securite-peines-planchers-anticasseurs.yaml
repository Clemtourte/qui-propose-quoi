candidat: zemmour
theme: securite-justice
rubrique: mesure
nature: position
titre: Rétablir les peines planchers et la loi anticasseurs
texte: >-
  Sur CNews le 18 octobre 2026, après les violences du 17 octobre, il se dit favorable au « rétablissement de la loi
  anticasseurs » de 1970, abrogée en 1981, et au rétablissement des peines planchers, instaurées en 2007 et supprimées
  en 2014. Il lie ces violences à l'immigration et défend la « remigration ».
date: 2026-10-18
sources: [lejdd-2026-10-19-zemmour-remigration]
appui:
  faits: >-
    Il invoque les violences du 17 octobre et ne cite pas de chiffre sur la récidive dans les propos rapportés.
  raisonnement: >-
    Il défend le retour de deux dispositifs supprimés et lie ces violences à l'immigration.
  sources: [lejdd-2026-10-19-zemmour-remigration]
  donnees:
    - texte: >-
        Institut des politiques publiques (mars 2024), sur les peines planchers de 2007 : pas d'effet dissuasif à court terme,
        puis une probabilité de récidive 10 % plus faible pour les seules infractions visées, environ 4 000 détenus de plus et
        un coût d'environ 146 M€ par an, en estimation basse.
      sources: [ipp-2024-03-peines-planchers]
