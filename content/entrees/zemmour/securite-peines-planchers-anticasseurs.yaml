titre: Rétablir les peines planchers et la loi anticasseurs
texte: >-
  Sur CNews le 18 octobre 2026, après les violences du 17 octobre, il se dit favorable au « rétablissement de la loi
  anticasseurs » de 1970, abrogée en 1981, et au rétablissement des peines planchers, instaurées en 2007 et supprimées
  en 2014. Il lie ces violences à l'immigration et défend la « remigration ».
date: 2026-10-18
