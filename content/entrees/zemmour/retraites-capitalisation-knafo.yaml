candidat: zemmour
theme: retraites
rubrique: mesure
nature: position
titre: "Reconquête : passage à la capitalisation (Sarah Knafo)"
citation:
  texte: Dès l'année prochaine, commencer à passer à la capitalisation.
  date: 2026-09-18
  contexte: Sarah Knafo, députée européenne Reconquête, dans « Les 4 Vérités » (France 2)
texte: >-
  Position exprimée par Sarah Knafo, et non par Éric Zemmour lui-même dans les sources consultées : « l'objectif à la
  fin, c'est que chacun soit libre de capitaliser » ; en attendant, un âge de référence de 64 ans, la transition
  devant être longue.
date: 2026-09-18
sources: [franceinfo-2026-09-18-knafo-budget, sudradio-2026-10-16-knafo-800000-postes]
appui:
  faits: >-
    Sarah Knafo : « quand on l'a créé initialement, il y avait quatre actifs pour un retraité. Aujourd'hui, vous avez
    1,7 actif pour un retraité ». La source de ces chiffres n'est pas précisée dans l'entretien lu.
  raisonnement: Elle juge le système par répartition « condamné à mort ».
  sources: [sudradio-2026-10-16-knafo-800000-postes]
  donnees:
    - texte: >-
        COR (juin 2026, tous régimes) : 2,1 cotisants par retraité en 2002, 1,8 en 2025, 1,3 projeté en 2070. Aucune
        source officielle n'a pu être lue au 1er novembre 2026 sur le chiffre de quatre actifs à la création du système.
      sources: [cor-2026-06-rapport-annuel]
