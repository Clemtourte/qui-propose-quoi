appui:
  texte: >-
    Sarah Knafo juge le système par répartition « condamné à mort » : « quand on l'a créé initialement, il y avait
    quatre actifs pour un retraité. Aujourd'hui, vous avez 1,7 actif pour un retraité ». La source de ces chiffres
    n'est pas précisée dans l'entretien lu.
  sources: [sudradio-2026-10-16-knafo-800000-postes]
