candidat: zemmour
theme: education
rubrique: mesure
nature: position
titre: « Remettre la sélection à tous les étages »
citation:
  texte: Il faut rétablir la discipline. Il faut sanctionner les élèves qui sont violents. Il faut les expulser et on n'est pas obligé de leur retrouver un établissement
  date: '2026-10-13'
  contexte: Invité de CNews
texte: >-
  Il veut remettre en place « les méthodes françaises qu'on a abandonnées », « remettre le français et les mathématiques
  comme matières principales avec des horaires supérieurs » et « remettre la sélection à tous les étages » : un examen à
  l'entrée en sixième et en seconde et « un véritable baccalauréat ». Il veut orienter vers le CAP dès la quatrième les
  élèves plus doués pour ces formations et donner aux chefs d'établissement l'autonomie de « sanctionner et même de
  choisir ses professeurs ». Aucun programme de Reconquête pour 2027 n'a été trouvé.
questions: [college, autorite]
date: '2026-10-13'
sources:
