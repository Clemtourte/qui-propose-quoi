titre: Supprimer la loi SRU et réserver le logement social aux Français (2022 et 2026)
texte: 'Le 6 janvier 2022, sur Europe Matin, il veut abolir la loi SRU, dont il dit que « Cette loi qui oblige toutes les
  villes à faire du logement social à 25% essaime l''immigration » (Europe 1). Le 14 septembre 2026, Europe 1 rapporte,
  sans citation directe, qu''il attaque le RN sur sa droite : il regrette que la priorité aux Français n''exclue pas les
  étrangers des logements sociaux. Aucun programme logement de Reconquête pour 2027 n''a été trouvé.'
