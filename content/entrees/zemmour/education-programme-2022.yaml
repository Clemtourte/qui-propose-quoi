titre: Blouse, écoles normales et « surveillants généraux » (programme de 2022)
texte: >-
  Pistes présentées le 10 janvier 2022 : « grand ministère de l'instruction publique », blouse à l'école primaire,
  restauration des filières au lycée et des écoles normales, suspension des allocations familiales des parents d'élèves
  perturbateurs ou absentéistes, remplacement des CPE par des « surveillants généraux » chargés du « maintien de l'ordre
  scolaire », internats de réinsertion pour les élèves posant de graves problèmes de comportement. Leur reprise dans le
  projet de 2027 n'est pas documentée.
