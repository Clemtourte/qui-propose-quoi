titre: Un député LFI saisit la procureure de la République après les propos tenus sur LCI
citation:
  texte: >-
    Propos racistes d'Éric Zemmour tenus hier sur LCI : je saisis la procureure de la République. Puisse la justice
    faire une nouvelle fois son travail : poursuivre et condamner de nouveau ce délinquant raciste multirécidiviste.
  date: 2026-10-19
  contexte: Message sur X
texte: >-
  La veille, sur X, il qualifie ces déclarations de « propos de guerre civile ». Selon Entrevue, le collectif Sleeping
  Giants annonce avoir signalé les propos à l'Arcom ; aucune décision de l'Arcom ni suite judiciaire n'est connue au
  29 octobre 2026.
