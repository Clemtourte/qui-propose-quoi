titre: 1 000 médecins salariés, 400 000 places en Ehpad, fin de l'AME (programme de 2022)
texte: 'Programme de 2022, selon LCP et Egora : embaucher 1 000 « médecins salariés par l''Etat » sur cinq ans (payés 10
  000 euros par mois pour 35 heures, selon Egora) envoyés dans les territoires sous-dotés, doubler le nombre d''étudiants
  formés en cinq ans, recruter 40 000 personnels hospitaliers, augmenter de 12 % le salaire net des infirmières, créer 400
  000 places en Ehpad d''ici 2030, rétablir l''obligation de permanence des soins et remplacer l''AME par une prise en charge
  des soins urgents. Leur reprise dans le projet de 2027 n''est pas documentée.'
