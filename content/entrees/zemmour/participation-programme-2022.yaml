candidat: zemmour
theme: institutions-participation
rubrique: participation
nature: position
titre: Référendums sur l'immigration et les traités européens (programme de 2022)
citation:
  texte: >-
    Dès les prochaines élections législatives, j'organiserai un référendum pour faire valider par les Français,
    les mesures prioritaires que je prendrai en matière d'immigration, de sécurité et de justice
  date: '2022-03-23'
  contexte: Présentation de son programme présidentiel de 2022, rapportée par Public Sénat
texte: >-
  Programme de 2022 : un référendum sur l'immigration, la sécurité et la justice après les législatives, puis une
  réforme rendant le référendum obligatoire pour « toutes ratification de traités européens, toute révision de la
  Constitution ou tout élargissement de l'Union européenne ». Leur reprise dans le projet de 2027 n'est pas documentée.
date: '2022-03-23'
