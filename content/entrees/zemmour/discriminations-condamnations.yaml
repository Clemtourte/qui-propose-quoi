titre: "Condamnations d'Éric Zemmour pour provocation à la haine raciale"
texte: >-
  Le 17 septembre 2025 selon La Libre, la Cour de cassation rejette son pourvoi : il est définitivement condamné à 15 000 € d'amende pour provocation à
  la haine raciale et injures racistes, pour ses propos de 2019 à la « convention de la droite ». Le détail de ses autres procédures, dont les mineurs
  isolés, figure dans la section « Décisions de justice ».
date: 2025-09-17
