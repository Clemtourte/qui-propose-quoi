titre: Âge légal à « 64 voire 65 ans » et capitalisation progressive
citation:
  texte: On va progressivement mettre de la capitalisation
  date: 2026-09-30
  contexte: Sur BFMTV (date non précisée), rapporté par franceinfo le 30 septembre 2026
texte: >-
  Il est favorable à un allongement de la durée du travail (« Oui, il faut travailler plus ») et propose de repousser
  l'âge légal à « 64 voire 65 ans ». Il juge que « le système par répartition est mort et condamné » faute d'enfants
  pour le financer, estime qu'« il fallait faire les fonds de pension en 86 » et reconnaît que le passage à la
  capitalisation « va prendre très longtemps ». Il se dit en désaccord avec Marine Le Pen sur ce sujet.
date: 2026-09-30
