titre: 14 EPR et aucune nouvelle éolienne (programme de 2022)
texte: >-
  Programme de 2022 : construction de 14 réacteurs EPR (LCP) ; « interdire tout nouveau projet de construction d'éoliennes
  sur terre et en mer » ; rediriger le soutien public à l'éolien et au solaire vers les renouvelables thermiques
  (géothermie, biomasse, pompes à chaleur) ; fin des zones à faibles émissions. Leur reprise dans le projet de 2027
  n'est pas documentée.
questions: [nucleaire, renouvelables]
reperes:
- question: nucleaire
  mesure: 14 EPR (programme de 2022)
  equivalent: >-
    environ 23 GW, soit 37 % de la puissance du parc nucléaire actuel (63 GW) ; environ 138 TWh par an, soit 31 % de la consommation d'électricité de 2025
  calcul: >-
    14 × 1,67 GW (puissance brute d'un EPR2) = 23,4 GW ; 23,4 / 63,0 = 37 %. Hypothèse : ces réacteurs produiraient autant par GW que le parc de 2025 (373,0 TWh pour 63,0 GW, soit 5,9 TWh par GW). 23,4 × 5,9 = 138 TWh ; 138 / 451,2 = 31 %. Ordre de grandeur : puissance brute des EPR2 et puissance installée du parc RTE ne sont pas définies de la même façon.
