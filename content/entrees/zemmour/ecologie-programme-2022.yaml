titre: 14 EPR et aucune nouvelle éolienne (programme de 2022)
texte: >-
  Programme de 2022 : construction de 14 réacteurs EPR (LCP) ; « interdire tout nouveau projet de construction d'éoliennes
  sur terre et en mer » ; rediriger le soutien public à l'éolien et au solaire vers les renouvelables thermiques
  (géothermie, biomasse, pompes à chaleur) ; fin des zones à faibles émissions. Leur reprise dans le projet de 2027
  n'est pas documentée.
