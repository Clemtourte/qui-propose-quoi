titre: "Après le 17 octobre, sur LCI : « le véritable visage du grand remplacement »"
citation:
  texte: >-
    Je crois que ce que nous avons vu hier, c'est le véritable visage du grand remplacement. Il a une apparence : une
    horde de barbares maghrébins et africains qui rentrent dans les villes. Il a des drapeaux palestiniens, algériens,
    marocains
  date: 2026-10-18
  contexte: Émission « 18H » de Darius Rochebin sur LCI, au lendemain des violences en marge de la mobilisation du 17 octobre
texte: >-
  Selon Entrevue, il ajoute que le « grand remplacement » a « des alliés avec les milices antifa, une vitrine légale
  avec les députés LFI » ; le journaliste rappelle que c'est « une théorie très contestée », et Éric Zemmour lui
  répond qu'il s'agit d'un « fait ». Le 19 octobre, après l'annonce d'une saisine de la justice par Antoine Léaument,
  il écrit sur X : « Parfois, on me traite de raciste. Jamais de menteur. »
date: 2026-10-18
