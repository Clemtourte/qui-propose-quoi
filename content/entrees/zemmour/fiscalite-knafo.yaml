candidat: zemmour
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: "Reconquête : baisse des dépenses et refus des hausses d'impôts (Sarah Knafo)"
texte: >-
  Position exprimée par Sarah Knafo, députée européenne Reconquête, en réaction au projet de budget 2027 du
  gouvernement : ne pas remplacer 800 000 postes de la fonction publique (40 milliards d'euros par an), supprimer
  l'aide publique au développement (14 milliards), réserver les prestations sociales non contributives aux Français
  (jusqu'à 20 milliards), supprimer des agences. Elle censurerait tout gouvernement dont le budget contient « un seul
  impôt qui augmente ».
chiffres:
  - libelle: Économie annuelle attendue du non-remplacement de 800 000 postes, selon Sarah Knafo
    valeur: 40 Md€
    nature: position
questions: [budget]
reperes:
- question: budget
  mesure: >-
    40 Md€ par an (non-remplacement de 800 000 postes), selon Sarah Knafo
  equivalent: >-
    environ 580 € par habitant, soit 1,3 % du PIB de 2025 ; 2,3 % des dépenses publiques de 2025
  calcul: >-
    40 Md€ / 69,082 millions d'habitants = 580 € ; 40 / 2990 Md€ de PIB = 1,3 % ; 40 / 1 714,2 Md€ de dépenses publiques = 2,3 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Montant annuel donné par Sarah Knafo.
