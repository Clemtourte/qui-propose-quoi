titre: "Reconquête : baisse des dépenses et refus des hausses d'impôts (Sarah Knafo)"
texte: >-
  Position exprimée par Sarah Knafo, députée européenne Reconquête, en réaction au projet de budget 2027 du
  gouvernement : ne pas remplacer 800 000 postes de la fonction publique (40 milliards d'euros par an), supprimer
  l'aide publique au développement (14 milliards), réserver les prestations sociales non contributives aux Français
  (jusqu'à 20 milliards), supprimer des agences. Elle censurerait tout gouvernement dont le budget contient « un seul
  impôt qui augmente ».
