titre: "Jérémie Piano, ancien de Génération identitaire, candidat Reconquête en 2022"
texte: >-
  Candidat de Reconquête aux législatives dans les Bouches-du-Rhône, il est condamné en appel le 30 mai 2022 pour provocation à la haine, à 1 000 €
  d'amende avec sursis, pour un slogan collé à Aix-en-Provence en 2020. Il avait déjà été condamné en septembre 2021, à Saint-Gaudens, à deux mois de
  prison avec sursis et 3 000 € d'amende pour provocation à la haine raciale. Génération identitaire a été dissoute en mars 2021.
date: 2022-05-30
