candidat: le-pen
theme: retraites
rubrique: mesure
nature: position
titre: Âge légal entre 60 et 62 ans selon l'âge d'entrée dans la vie active
citation:
  texte: maintenir un âge légal entre 60 et 62 ans en fonction de l'âge d'entrée sur le marché du travail
  date: 2026-10-14
  contexte: Déclaration à Bruxelles, rapportée par franceinfo avec l'AFP
texte: >-
  Elle prévoit une durée de cotisation de 40 à 42 annuités pour une pension à taux plein. Lors du débat du Medef
  (27 août 2026), elle indiquait que ceux qui ont commencé à travailler avant 20 ans partiraient à 60 ans, pour
  ensuite parvenir « à 42 ans de cotisations et un âge légal de 62 ans ». Le 6 octobre 2026, elle annonce
  15 à 20 milliards d'euros d'économies à terme sur les retraites et un « pilier de capitalisation ». Le
  14 octobre, elle renvoie la présentation détaillée de sa réforme au 17 novembre 2026.
chiffres:
  - libelle: Économies annoncées sur les retraites, selon le RN
    valeur: 15 à 20 Md€ à terme
    nature: position
questions: [financement]
reperes:
- question: financement
  mesure: >-
    15 à 20 Md€ d'économies à terme sur les retraites, selon le RN
  equivalent: >-
    environ 220 à 290 € par habitant, soit 0,50 à 0,67 % du PIB de 2025 ; 0,88 à 1,2 % des dépenses publiques de 2025
  calcul: >-
    15 Md€ / 69,082 millions d'habitants = 220 € ; 15 / 2990 Md€ de PIB = 0,50 % ; 15 / 1 714,2 Md€ de dépenses publiques = 0,88 % ; puis 20 Md€ / 69,082 millions d'habitants = 290 € ; 20 / 2990 Md€ de PIB = 0,67 % ; 20 / 1 714,2 Md€ de dépenses publiques = 1,2 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Échéance non précisée (« à terme »).
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-10-14
