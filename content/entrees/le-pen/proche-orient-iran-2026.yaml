titre: 'Guerre en Iran : approuve le cadrage défensif d''Emmanuel Macron, juge que les États-Unis ont commis une erreur
  (mars 2026)'
texte: 'Le 4 mars 2026 sur RTL, après l''allocution d''Emmanuel Macron, Marine Le Pen dit : « Je n''ai rien trouvé de choquant
  dans la déclaration du président de la République » et « J''ai trouvé qu''il manquait peut-être la conscience de la préoccupation
  de nos compatriotes » (LCP) ; selon franceinfo (11 mars), elle juge que « Le cadrage donné par le président qui consiste
  à être dans une position défensive me paraît être le bon », et le RN demande une baisse de la TVA sur l''énergie et de
  la taxe sur les produits pétroliers. Le 25 mars, d''après Anadolu repris par Middle East Monitor (en anglais, propos non
  recoupés en français), elle déclare sur France Inter que les États-Unis ont commis une erreur en attaquant l''Iran, en
  pensant que le régime tomberait en quelques jours, et juge les objectifs de Donald Trump erratiques. Aucune déclaration
  de 2026 de sa part sur Gaza ou la Cisjordanie n''a été trouvée.'
