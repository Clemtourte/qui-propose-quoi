titre: "L'histoire du parti : des fondateurs issus de la Waffen-SS et les propos de Jean-Marie Le Pen"
citation:
  texte: Je ne dis pas que les chambres à gaz n'ont pas existé. Je n'ai pas pu moi-même en voir. Je n'ai pas étudié spécialement la question. Mais je crois que c'est un point de détail de la Seconde Guerre mondiale
  date: 1987-09-13
  contexte: Jean-Marie Le Pen, père de Marine Le Pen et alors président du Front national, au Grand Jury RTL-Le Monde, rapporté par Sud Radio
texte: >-
  Selon la RTBF, le Front national, créé en 1972, réunit notamment d'anciens membres de la Waffen-SS, dont Pierre Bousquet et Léon
  Gauthier, d'anciens de l'OAS et d'anciens résistants comme Georges Bidault. Selon Sud Radio, Jean-Marie Le Pen a été condamné à
  plusieurs reprises, notamment pour incitation à la haine raciale. Il meurt en janvier 2025. Le parti change de nom en 2018.
date: 2026-09-30
