candidat: le-pen
theme: securite-justice
rubrique: bilan
nature: fait
titre: "Votes à l'Assemblée : loi narcotrafic, loi Attal sur les mineurs, présomption pour les forces de l'ordre"
texte: >-
  Députée, elle vote pour la loi visant à sortir la France du piège du narcotrafic (texte final, 29 avril 2025, adopté
  par 396 voix contre 68) ; pour la loi de Gabriel Attal sur la justice des mineurs (texte final, 13 mai 2025, adopté
  par 341 voix contre 187) ; pour la proposition de loi sur la présomption de légitime défense des forces de l'ordre,
  adoptée en première lecture le 7 juillet 2026 par 313 voix contre 199, dans une version qui prévoit une
  « présomption d'usage légitime de l'arme ».
date: 2026-07-07
