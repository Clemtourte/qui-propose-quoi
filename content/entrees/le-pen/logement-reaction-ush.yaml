auteur: Emmanuelle Cosse, présidente de l'Union sociale pour l'habitat (USH), citée par LCP
titre: L'USH juge la priorité nationale dans le logement social « xénophobe » et rappelle la part des étrangers dans le
  parc
texte: 'Elle qualifie la proposition de « lubie xénophobe » qui « désigne un bouc émissaire : les immigrés », et affirme
  : « Les étrangers ne sont pas favorisés dans l''entrée dans le logement social, il n''y a aucun favoritisme. » Selon l''USH,
  les étrangers représentent 15 % des locataires du parc social. La Confédération nationale du logement (CNL) estime que
  « La préférence nationale ne résoudra rien à la pénurie » de logements sociaux.'
