titre: 'Contre-budget du 6 octobre 2026 : AME remplacée par l''AMU, carte Vitale biométrique, lutte contre les dépenses
  indues'
texte: Selon l'analyse de l'Institut de l'Entreprise de l'annexe du contre-budget du RN, les mesures de Sécurité sociale
  comprennent la lutte contre les dépenses indues, les coûts hospitaliers et les affections de longue durée (ALD), ainsi
  qu'une carte Vitale biométrique ; l'aide médicale d'État serait « remplacée par l'AMU » (mesure rangée avec l'immigration).
  Le 2 février 2026, Le Quotidien du médecin titre sur des propositions de Marine Le Pen sur les déserts médicaux, le numerus
  clausus et la débureaucratisation de l'hôpital ; l'article est réservé aux abonnés et son contenu n'est pas repris ici.
