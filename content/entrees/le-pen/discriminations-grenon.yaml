titre: "Daniel Grenon, député élu sous l'étiquette RN, condamné en première instance"
citation:
  texte: Il y a des gens qui sont maghrébins, qui sont rentrés au pouvoir, en ministres etc. Alors, je sens que ces gens-là n'ont pas leur place dans les hauts lieux
  date: 2024-07-01
  contexte: Débat organisé par L'Yonne républicaine, entre les deux tours des législatives
texte: >-
  Le 2 mai 2025, le tribunal correctionnel de Sens le condamne à 3 000 € d'amende et 1 500 € de dommages-intérêts à chacune des trois
  associations parties civiles, pour provocation publique à la discrimination et injure publique. Jordan Bardella avait qualifié ces
  propos d'« abjects » ; le député a été exclu du RN à l'automne 2024, après sa réélection. Un éventuel appel n'est pas documenté.
date: 2025-05-02
sources: [macommune-2025-05-02-grenon]
