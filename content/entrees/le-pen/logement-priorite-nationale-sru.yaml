titre: Priorité d'accès aux Français, abrogation de la loi SRU, foncier public gratuit, fin du ZAN et du DPE
texte: Le 13 septembre 2026, à Hénin-Beaumont, elle promet de « donner la priorité d'accès au logement social aux Français
  », de réserver les aides personnelles au logement (APL) aux Français, d'abroger la loi SRU (qui impose un minimum de logements
  sociaux aux communes), de permettre la vente d'« un certain nombre de HLM aux Français » et l'expulsion des « familles
  délinquantes » du parc social. Les constructeurs recevraient du foncier public gratuitement en échange de « milliers d'appartements
  » à loyers modérés. Elle veut supprimer le ZAN, qu'elle juge idéologique, mettre fin aux diagnostics de performance énergétique,
  remplacer MaPrimeRénov' par un dispositif « 100 % rénov » fondé sur un prêt à taux zéro et lancer un programme de conversion
  des bureaux vacants en logements. Batiweb note qu'elle n'a précisé ni le cadre juridique des mesures de priorité et d'expulsion,
  ni leur coût. Les APL et la priorité nationale figurent aussi dans le thème immigration.
