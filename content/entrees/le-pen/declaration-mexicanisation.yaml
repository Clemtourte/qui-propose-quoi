titre: "Lancement de campagne à Orléans : ne pas laisser la France « tomber dans la mexicanisation avec des cartels »"
texte: >-
  Dans son premier grand discours de campagne, le 25 octobre 2026 au congrès du RN à Orléans, elle dit ne pas vouloir
  laisser la France « tomber dans la mexicanisation avec des cartels », selon Courrier international. Le Diario de
  Yucatán (avec AP) donne la même phrase en espagnol et ajoute qu'elle veut éradiquer ces organisations criminelles
  en les considérant comme terroristes. Dans le même discours, elle promet la « tolérance zéro » et un gouvernement
  « d'union nationale » dirigé par Jordan Bardella (Europe 1, avec AFP).
