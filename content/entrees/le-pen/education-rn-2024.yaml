titre: Autorité, « récit national » et retour des séries au bac (propositions du RN en 2024)
texte: >-
  Le programme présidentiel de 2027 n'est pas publié. Lors des législatives de 2024, selon Public Sénat, le RN proposait
  d'orienter vers des structures spécialisées les élèves ayant fait l'objet de deux exclusions, d'afficher dans les
  classes une carte de France et une frise chronologique du « récit national », de réformer le baccalauréat (retour des
  séries, notation plus stricte), de « rénover l'enseignement des mathématiques », d'abroger le Pacte enseignant lancé
  en 2023 et de rendre obligatoire le remplacement des enseignants absents. L'affichage de la carte et de la frise
  faisait l'objet d'une proposition de loi du groupe RN, dont Marine Le Pen, déposée le 21 décembre 2023. Au 3 septembre
  2026, le RN n'avait pas annoncé de hausse des salaires des enseignants (Sud Radio).
