titre: "Grégoire de Fournas, député RN, exclu 15 jours de l'Assemblée en 2022"
texte: >-
  En novembre 2022, il lance « qu'il retourne en Afrique » pendant l'intervention de Carlos Martens Bilongo, député LFI noir. L'Assemblée
  vote la plus lourde sanction possible : quinze jours d'exclusion et la moitié de l'indemnité pendant deux mois. Il nie tout caractère
  raciste et dit avoir parlé du bateau Ocean Viking.
date: 2022-11-04
