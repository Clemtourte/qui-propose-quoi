titre: "Frédéric Chatillon, ancien président du GUD, et ses liens avec le RN"
texte: >-
  Ancien président du GUD, groupe d'extrême droite aujourd'hui dissous, il a connu Marine Le Pen à la faculté d'Assas. Sa société
  Riwal a travaillé pour le parti lors de campagnes électorales. L'AFP le dit proche de la sphère négationniste ; en 2009, il a
  accompagné au tribunal Dieudonné et Robert Faurisson. Marine Le Pen déclare en mai 2023 : « J'avais de l'amitié pour le couple
  Chatillon, mais les liens se sont distendus. » En 2026, Jean-Philippe Tanguy assure qu'il n'a « jamais été un proche » d'elle, et
  Jordan Bardella que les groupuscules, « notamment le GUD, nous détestent, nous combattent ». L'AFP écrit que ces affirmations
  « résistent difficilement à l'étude des faits ».
date: 2026-10-09
