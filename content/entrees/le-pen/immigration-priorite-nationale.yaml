candidat: le-pen
theme: immigration
rubrique: mesure
nature: position
titre: Priorité nationale pour les aides au logement et le logement social
citation:
  texte: un droit naturel et juste
  date: 2026-09-13
  contexte: Discours de rentrée politique à Hénin-Beaumont, à propos de la priorité nationale
texte: >-
  Elle veut réserver les aides personnelles au logement (APL) aux Français et appliquer la priorité nationale au
  logement social.
chiffres:
  - libelle: Économies attendues de la politique d'immigration et de la priorité nationale, selon le RN (contre-budget du 6 octobre 2026)
    valeur: 15 Md€ en 2027, 29 Md€ en année pleine
    nature: position
reperes:
- mesure: >-
    15 Md€ d'économies en 2027 et 29 Md€ en année pleine, selon le RN
  equivalent: >-
    environ 220 à 420 € par habitant, soit 0,50 à 0,97 % du PIB de 2025 ; 0,88 à 1,7 % des dépenses publiques de 2025
  calcul: >-
    15 Md€ / 69,082 millions d'habitants = 220 € ; 15 / 2990 Md€ de PIB = 0,50 % ; 15 / 1 714,2 Md€ de dépenses publiques = 0,88 % ; puis 29 Md€ / 69,082 millions d'habitants = 420 € ; 29 / 2990 Md€ de PIB = 0,97 % ; 29 / 1 714,2 Md€ de dépenses publiques = 1,7 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Les deux bornes sont celles du RN (15 en 2027, 29 en année pleine).
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-09-13
sources: [france3-2026-09-13-le-pen-henin-beaumont, sudradio-2026-09-13-le-pen-logement, franceinfo-2026-10-08-critiques-budget-rn]
appui:
  faits: >-
    Le dossier du contre-budget détaille 15,1 Md€ pour 2027, dont 7,5 Md€ en réservant les prestations de solidarité aux
    étrangers ayant « au moins 5 ans ETP travaillés en France », 1,92 Md€ de taxe de 14 % sur les transferts d'argent vers
    les pays tiers, 1,1 Md€ par le remplacement de l'aide médicale d'État par une aide d'urgence, 1,1 Md€ de hausse des
    frais de scolarité des étudiants étrangers, 1 Md€ par la suppression du visa pour soins et 1 Md€ de taxe à l'embauche
    d'un extra-européen. Il présente des tableaux, sans détail de calcul.
  raisonnement: >-
    Marine Le Pen parle d'« un droit naturel et juste ». Renaud Labaye, présenté par Public Sénat comme son bras droit,
    évoque « la seule discrimination que nous revendiquons », à propos de la taxe à l'embauche.
  sources: [rn-2026-10-06-dossier-contre-budget, france3-2026-09-13-le-pen-henin-beaumont, publicsenat-2026-10-09-rn-taxe-embauche]
  donnees:
    - texte: >-
        OCDE (moyenne 2006-2018) : en France, les immigrés contribuent à hauteur de +1,02 % du PIB en ne comptant que les
        impôts, les cotisations et les prestations individuelles, et de −0,85 % du PIB en leur attribuant aussi une part des
        biens publics, dont la défense et la dette. Selon l'OCDE devant l'Assemblée, à ce dernier niveau le solde est négatif
        pour tous.
      sources: [ocde-2021-10-28-impact-budgetaire-immigration, an-2026-02-25-table-ronde-migrations-securite-sociale]
    - texte: >-
        Sénat (rapport sur le budget 2026) : l'aide médicale d'État a coûté 1 387 M€ en 2024, soins urgents compris.
      sources: [senat-2025-11-essentiel-mission-sante-plf-2026]
    - texte: >-
        Conseil constitutionnel (11 avril 2024) : une condition de cinq ans de résidence ou de trente mois d'activité pour
        des prestations sociales porte « une atteinte disproportionnée » aux exigences constitutionnelles. Le texte alors
        examiné était une proposition de loi, sans révision de la Constitution ; le critère du RN (5 ans de travail à temps
        plein) diffère.
      sources: [conseil-constitutionnel-2024-04-11-2024-6-rip]
