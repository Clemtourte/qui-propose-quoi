rubrique: discriminations
nature: fait
titre: "Messages de 2013 attribués à Jordan Bardella par Mediapart, qu'il dément"
citation:
  texte: Le juif doit dominer les autres peuples, les écraser et les voler
  date: 2026-09-28
  contexte: Message de 2013 attribué à Jordan Bardella par Mediapart, cité par Public Sénat ; il en conteste l'authenticité
texte: >-
  Le 28 septembre 2026, Mediapart attribue à Jordan Bardella, président du RN, que Marine Le Pen veut nommer à Matignon, des messages
  antisémites écrits à 17-18 ans. Le 1er octobre, le média publie des éléments d'authentification, via Facebook et un huissier.
  Jordan Bardella conteste « formellement » et dénonce des « faux grossiers » ; la RTBF indique qu'il a déposé une plainte en
  diffamation. Marine Le Pen, qui dit ne pas avoir lu l'article, estime que « ça ne peut être qu'un faux ». Aucune décision de justice
  n'a été trouvée à ce stade.
date: 2026-10-01
