candidat: le-pen
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Règle d'or budgétaire adoptée par référendum
citation:
  texte: Si les Français ne choisissent pas une rupture politique, la France court vers le défaut
  date: 2026-10-06
  contexte: Conférence de presse de présentation du contre-budget du RN, au siège du parti
texte: >-
  Elle propose d'inscrire dans la Constitution, par un référendum organisé « dans les douze mois » après l'élection
  selon Public Sénat, une règle d'or budgétaire. Selon franceinfo et Europe 1, elle imposerait chaque année une
  baisse de la dette ; selon Public Sénat, elle fixerait un seuil maximal de déficit au niveau où la dette se
  stabilise.
date: 2026-10-06
sources: [franceinfo-2026-10-06-le-pen-140-milliards, europe1-2026-10-06-contre-budget-rn, publicsenat-2026-10-06-contre-budget-rn]
