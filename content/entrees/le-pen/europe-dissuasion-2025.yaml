titre: 'Contre le partage de la dissuasion nucléaire : « Partager la dissuasion, c''est l''abolir »'
texte: 'Lors du débat à l''Assemblée nationale du 3 mars 2025 sur l''Ukraine, elle s''oppose à l''extension de la dissuasion
  nucléaire française à l''Europe : « Partager la dissuasion, c''est l''abolir ». Elle présente le feu nucléaire comme «
  un absolu » de la souveraineté et dit qu''elle ne pourra jamais soutenir une « chimérique défense européenne » (Toute
  l''Europe). Sa position pour 2027 sur l''OTAN, le budget des armées et la défense européenne n''a pas été trouvée. Sur
  la contribution à l''Union européenne, voir le thème fiscalité et budget (économies de 11,1 Md€ dès 2027 selon franceinfo,
  9 Md€ selon Jordan Bardella).'
