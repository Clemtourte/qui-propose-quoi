titre: Abaisser la majorité pénale à 16 ans
texte: >-
  Au lendemain des violences du 17 octobre, Jordan Bardella, président du RN, présente lors d'une conférence de presse
  le programme de sécurité porté par Marine Le Pen. Mesure principale : abaisser la majorité pénale de 18 à 16 ans,
  avec la comparution immédiate dès 16 ans et une réforme de l'excuse de minorité. Pour lever l'obstacle
  constitutionnel, il envisage un référendum par l'article 11 de la Constitution.
date: 2026-10-20
