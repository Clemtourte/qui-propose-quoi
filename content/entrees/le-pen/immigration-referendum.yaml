titre: Référendum constitutionnel sur l'immigration
texte: >-
  Selon franceinfo (13 octobre 2026), elle promet, comme en 2022, de réviser la Constitution par référendum pour
  mettre fin au droit du sol et au regroupement familial, instaurer la préférence nationale dans l'accès aux aides
  sociales et durcir le droit d'asile. Le RN entend recourir à l'article 11 de la Constitution, en invoquant le
  précédent de 1962.
date: 2026-10-13
