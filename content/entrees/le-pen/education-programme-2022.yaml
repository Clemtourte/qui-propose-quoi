titre: Uniforme et +3 % par an pour les enseignants (programme de 2022)
texte: >-
  Programme de 2022 : uniforme de l'école primaire à la 3e, choisi par l'établissement ; journée allongée d'une heure en
  élémentaire pour le français, les mathématiques et l'histoire-géographie ; programmes soumis au vote du Parlement ;
  dédoublement des classes étendu à tous les CP et à toutes les grandes sections ; voie professionnelle possible dès la
  5e et apprentissage dès 14 ans ; retour des séries S, L et ES au lycée ; suppression des Instituts nationaux supérieurs
  du professorat et de l'éducation (Inspé) ; hausse des salaires des enseignants de 3 % par an pendant le quinquennat. Leur reprise dans
  le projet de 2027 n'est pas documentée.
