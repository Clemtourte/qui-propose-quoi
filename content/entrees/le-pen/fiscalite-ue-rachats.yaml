candidat: le-pen
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Baisse de la contribution française au budget de l'UE et taxe sur les rachats d'actions
texte: >-
  Selon franceinfo, le RN attend 11,1 milliards d'euros d'économies dès 2027 sur la contribution française au budget
  européen, puis jusqu'à 20 milliards les années suivantes ; Jordan Bardella cite « 9 milliards d'euros sur notre
  contribution à l'Union européenne » (Public Sénat). Le RN attend aussi 11,4 milliards d'euros dès 2027 d'une taxe
  sur les rachats d'actions (franceinfo).
chiffres:
  - libelle: Recette attendue de la taxe sur les rachats d'actions en 2027, selon le RN (franceinfo)
    valeur: 11,4 Md€
    nature: position
reperes:
- mesure: >-
    11,4 Md€ de recettes attendues d'une taxe sur les rachats d'actions en 2027, selon le RN
  equivalent: >-
    environ 170 € par habitant, soit 0,38 % du PIB de 2025 ; 0,67 % des dépenses publiques de 2025
  calcul: >-
    11,4 Md€ / 69,082 millions d'habitants = 170 € ; 11,4 / 2990 Md€ de PIB = 0,38 % ; 11,4 / 1 714,2 Md€ de dépenses publiques = 0,67 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Une seule source de presse (franceinfo).
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-10-06
sources: [franceinfo-2026-10-08-critiques-budget-rn, publicsenat-2026-10-06-contre-budget-rn]
