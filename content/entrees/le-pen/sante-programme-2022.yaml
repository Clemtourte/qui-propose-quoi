titre: Consultations modulées selon le lieu d'installation, fin des fermetures de lits, fin de l'AME (programme de 2022)
texte: 'Programme de 2022, selon LCP et Egora : moduler la rémunération des consultations « selon le lieu d''installation
  » des médecins, arrêter « immédiatement » les fermetures de lits, augmenter de 10 % le salaire net des infirmières pour
  « atteindre la moyenne européenne », mettre fin à l''AME, créer des cartes Vitale biométriques, reconstruire la médecine
  scolaire, un plan d''urgence de 20 milliards d''euros et la suppression des agences régionales de santé. Leur reprise
  dans le projet de 2027 n''est pas documentée.'
