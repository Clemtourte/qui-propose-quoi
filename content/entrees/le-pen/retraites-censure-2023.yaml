titre: Motions de censure du 20 mars 2023 contre la réforme des retraites
texte: >-
  Députée, elle vote la motion de censure transpartisane déposée par Bertrand Pancher et 90 députés après le recours
  au 49.3 sur la réforme des retraites, avec l'ensemble des 88 députés du groupe RN. La motion obtient 278 voix et
  n'est pas adoptée. Le même jour, la motion qu'elle a déposée avec 87 députés obtient 94 voix et n'est pas adoptée.
date: 2023-03-20
