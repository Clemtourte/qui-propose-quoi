titre: Référendums proposés pour 2027
texte: >-
  Selon Euronews (17 septembre 2026), elle propose de soumettre à référendum la lutte contre les « idéologies islamistes
  », dont l'interdiction du voile dans l'espace public, ainsi qu'une révision de la Constitution pour restreindre
  l'immigration. Elle ne propose pas de référendum sur la sortie de l'Union européenne.
