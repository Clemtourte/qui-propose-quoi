titre: "Frédéric Boccaletti, député RN, ancien libraire d'Anthinéa à Toulon"
texte: >-
  Député RN du Var depuis 2022, il a tenu dans les années 1990 la librairie Anthinéa, à Toulon. Le Times of Israël parle d'un
  établissement « spécialisé dans la vente d'ouvrages antisémites et négationnistes » et cite Roger Garaudy parmi les auteurs.
  Selon StreetPress, un ancien proche affirme qu'il vendait Maurice Bardèche « sous le comptoir », mais ajoute : « Les livres qu'il
  vendait, ça ne l'intéressait pas. » La boutique ferme en 1998 selon ce média. Il a aussi été condamné pour « violences en réunion
  avec arme » à un an de prison dont six mois ferme, lors d'un collage d'affiches pour le parti de Bruno Mégret. Jordan Bardella
  répond en 2024 : « les faits que vous citez ont 30 ans, 35 ans » et, sur cette question, « il est irréprochable ». Les sources
  divergent sur la date d'ouverture.
date: 2024-06-26
sources: [timesofisrael-2024-06-26-boccaletti, streetpress-2022-07-06-boccaletti]
