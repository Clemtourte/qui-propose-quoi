  contexte: Entretien sur franceinfo, après les violences en marge de la mobilisation du 17 octobre
texte: >-
  Elle juge que « ce qui s'est passé samedi était prévisible » mais n'a pas été « anticipé ». Le 17 octobre, sur X,
  elle écrit que « les revendications sociales légitimes ont une nouvelle fois été prises en otage par l'extrême
  gauche et les discours des députés de Jean-Luc Mélenchon ».
