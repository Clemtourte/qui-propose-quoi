titre: "Contre-budget : 140 milliards d'euros d'économies nettes d'ici 2032"
texte: >-
  Présenté le 6 octobre 2026 avec Jordan Bardella. Le RN vise un déficit public sous 3 % du PIB dès 2030,
  un retour à l'équilibre primaire en 18 mois et 30 milliards d'euros nets de baisses d'impôts sur le quinquennat.
  Le montant d'économies dépasse de 15 milliards celui annoncé lors du débat du Medef (125 milliards).
