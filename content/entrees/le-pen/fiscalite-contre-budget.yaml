candidat: le-pen
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: "Contre-budget : 140 milliards d'euros d'économies nettes d'ici 2032"
texte: >-
  Présenté le 6 octobre 2026 avec Jordan Bardella. Le RN vise un déficit public sous 3 % du PIB dès 2030,
  un retour à l'équilibre primaire en 18 mois et 30 milliards d'euros nets de baisses d'impôts sur le quinquennat.
  Le montant d'économies dépasse de 15 milliards celui annoncé lors du débat du Medef (125 milliards).
chiffres:
  - libelle: Économies nettes en 2032 par rapport à 2026, selon le RN
    valeur: 140 Md€
    nature: position
  - libelle: Croissance retenue par le RN pour 2028, 2029 et 2030
    valeur: 1,8 %, 1,7 %, 1,8 %
    nature: position
questions: [budget]
reperes:
- question: budget
  mesure: >-
    140 Md€ d'économies nettes en 2032 (par rapport à 2026), selon le RN
  equivalent: >-
    environ 2 030 € par habitant, soit 4,7 % du PIB de 2025 ; 8,2 % des dépenses publiques de 2025
  calcul: >-
    140 Md€ / 69,082 millions d'habitants = 2 030 € ; 140 / 2990 Md€ de PIB = 4,7 % ; 140 / 1 714,2 Md€ de dépenses publiques = 8,2 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Niveau annuel atteint en 2032, selon le RN.
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-10-06
sources: [franceinfo-2026-10-06-le-pen-140-milliards, europe1-2026-10-06-contre-budget-rn, publicsenat-2026-10-06-contre-budget-rn, franceinfo-2026-10-08-critiques-budget-rn]
appui:
  faits: >-
    Le RN retient une croissance de 1,8 %, 1,7 % et 1,8 % de 2028 à 2030, attend de l'immigration 29 Md€ « en année
    pleine », soit « 20 % » du plan, et 3,4 Md€ en 2027 de « la fin de la quasi-totalité des agences ». Le document
    du RN n'a pas été lu directement.
  raisonnement: >-
    Elle présente un « effort radical » pour « redresser » les finances publiques et fait de la réorganisation de
    l'État « la mère des batailles » (20,7 Md€ dès 2027 selon le RN).
  sources: [publicsenat-2026-10-06-contre-budget-rn, franceinfo-2026-10-08-critiques-budget-rn]
  donnees:
    - texte: >-
        Haut Conseil des finances publiques (octobre 2026) : la prévision de croissance du gouvernement pour 2027, 1,0 %,
        paraît « optimiste au regard des dernières évolutions ». Cet avis ne porte pas sur les années 2028 à 2030.
      sources: [hcfp-2026-10-avis-plf-2027]
    - texte: >-
        Commission d'enquête du Sénat, citée par Public Sénat : environ 500 M€ d'économies sur les agences de l'État, si
        aucune politique publique n'est supprimée.
      sources: [publicsenat-2026-10-06-contre-budget-rn]
