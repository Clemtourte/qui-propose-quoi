auteur: Los Reporteros et Debate, médias mexicains (cités par Courrier international)
titre: "« Mexicanisation » : des médias mexicains dénoncent une comparaison stigmatisante"
texte: >-
  Selon Courrier international, le média indépendant Los Reporteros regrette que le Mexique soit associé « à la
  violence et au déclin » et juge « infondée » l'association implicite entre cartels et migrants ; le quotidien Debate
  rapporte des critiques d'analystes sur un effet stigmatisant envers le Mexique et « toute l'Amérique latine ». Aucune
  réaction d'un responsable politique français à cette formule n'a été trouvée.
