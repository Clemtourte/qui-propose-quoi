titre: 'Reconnaissance de la Palestine : « C''est reconnaître un Etat Hamas et donc un Etat terroriste » (juillet 2025)'
texte: 'Le 25 juillet 2025, au lendemain de l''annonce par Emmanuel Macron que la France reconnaîtrait l''État de Palestine
  en septembre, LCP rapporte la réaction de Marine Le Pen : « C''est reconnaître un Etat Hamas et donc un Etat terroriste
  ». Jordan Bardella, président du Rassemblement national, juge l''annonce « précipitée » sur X. Selon Public Sénat (25
  juillet 2025), elle ajoute : « Cette décision légitime les massacreurs du 7 octobre ». Propos de 2025, antérieurs à l''entrée
  en campagne.'
