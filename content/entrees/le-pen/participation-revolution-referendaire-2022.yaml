titre: « Révolution référendaire » (programme de 2022)
texte: >-
  Programme de 2022 : abaisser à 500 000 électeurs le seuil de déclenchement d'un référendum d'initiative citoyenne
  (RIC) permettant d'abroger ou de proposer une loi ; soumettre obligatoirement à référendum les traités « portant
  limitation de souveraineté » ; passer à un septennat non renouvelable ; interdire pendant quinze ans l'adoption
  d'un texte rejeté par référendum, sauf nouveau référendum. Leur reprise dans le projet de 2027 n'est pas documentée.
date: '2022-04-12'
