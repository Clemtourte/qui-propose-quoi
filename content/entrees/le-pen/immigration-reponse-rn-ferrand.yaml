titre: Réponses du RN et de Marine Le Pen à Richard Ferrand
citation:
  texte: >-
    En ayant prononcé ces propos, il a rompu avec l'obligation qui est la sienne de neutralité, et avec
    l'interdiction, qui est dans les textes, de se prononcer sur une affaire qui n'a pas encore été soumise au
    Conseil constitutionnel
  date: 2026-10-14
  contexte: Marine Le Pen, déclaration à Bruxelles rapportée par LCP
texte: >-
  Le 13 octobre, Louis Aliot, vice-président du RN, estime que Richard Ferrand « devrait garder un minimum de
  neutralité dans sa fonction » ; le député RN Matthias Renault écrit sur X : « Ce référendum aura lieu, ce n'est pas
  à lui d'en décider. » Le 14 octobre, Marine Le Pen estime qu'il devrait quitter la tête du Conseil
  constitutionnel. Le 16 octobre, les parlementaires RN et UDR saisissent le Conseil constitutionnel pour demander
  sa « démission d'office ».
date: 2026-10-14
