titre: "Propos privés sur Jean-Luc Mélenchon et Ségolène Royal, puis excuses sur la forme"
citation:
  texte: Je suis vraiment désolé si ces propos ont été perçus comme étant du sexisme.
  date: 2026-10-04
  contexte: Dernier débat de la primaire socialiste, sur BFMTV
texte: >-
  Le 2 octobre 2026, Le Média (site en ligne proche de la gauche radicale, selon Europe 1) diffuse des extraits d'une
  conversation privée avec des militants. Il y dit de Jean-Luc Mélenchon et de Marine Le Pen : « On leur pisse
  dessus, on va pas rentrer dedans », et accuse Ségolène Royal d'avoir « fait la danse du ventre à Macron ». Au débat
  du 4 octobre, il déclare d'abord « J'assume complètement », explique que l'expression visait des « gesticulations
  pour obtenir un poste » sans « aucune connotation sexiste », puis présente ses excuses et juge certains passages
  « vulgaires ».
date: 2026-10-04
