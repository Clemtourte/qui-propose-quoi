titre: 'Défense de l''Europe : changer les traités qui obligent à l''unanimité (2025)'
texte: 'Eurodéputé, interrogé sur France Inter le 7 mars 2025, il dit : « On ne peut pas s''abriter derrière Viktor Orbán
  et l''absence de consensus pour ne pas agir », juge qu''il faudra « passer sans la Hongrie et changer les traités qui
  obligent à l''unanimité » et « assumer de décider à la majorité qualifiée », « même si on n''avance pas à 27 », et ajoute
  : « Ne pas vouloir se défendre dans un moment aussi grave, c''est consentir à la soumission ». Il salue le plan de la
  Commission comme « un premier pas » (franceinfo). L''article ne rapporte aucun propos sur la dissuasion nucléaire ni sur
  un fonds de défense. Aucune proposition de sa candidature présidentielle sur l''Europe ou la défense n''a été trouvée.'
