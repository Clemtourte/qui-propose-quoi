titre: Convention citoyenne sur l'immigration
citation:
  texte: Non, l'immigration zéro n'est ni souhaitable, ni possible. Et non, s'installer en France n'est pas un droit universel
  date: 2026-05-28
  contexte: Livre « Nous avons encore envie » (Allary éditions), cité par LCP
texte: >-
  Il écrit : « nous organiserons une convention citoyenne » sur l'immigration. Des citoyens tirés au sort, confrontés
  aux données démographiques, économiques ou sécuritaires, feraient des propositions soumises au débat et au vote du
  Parlement. Il évoque aussi l'incapacité de l'État à appliquer les obligations de quitter le territoire (Public Sénat).
date: 2026-05-28
