titre: Fonds européen de défense de 500 Md€ par emprunt commun, dissuasion étendue, traité de refondation d'ici 2030 (Acte
  I de Place publique)
texte: 'Le document « L''Acte I » de Place publique (chantiers 2 et 3) propose : « Oeuvrer à la mise en place rapide d''un
  fonds européen de défense de 500 milliards d''euros via un emprunt commun », réservé aux productions européennes (EDIP)
  ; « Proposer à nos partenaires de l''UE d''étendre la dissuasion nucléaire française aux autres pays de l''Union européenne,
  en conservant la souveraineté française sur la décision d''emploi » ; « Augmenter massivement le budget de l''Union »
  et lui attribuer des ressources propres nouvelles ; « Porter d''ici 2030 un grand traité de réunification européenne »,
  avec la majorité qualifiée au Conseil européen et l''initiative législative au Parlement européen ; un « pacte girondin
  » clarifiant les compétences entre échelons. Le montant de 500 Md€ concerne l''Union entière : il n''est pas converti
  ici en équivalent français. Texte de Place publique (« Acte I », 2025, date à confirmer), antérieur à la primaire ; ce
  n''est pas un programme présidentiel.'
