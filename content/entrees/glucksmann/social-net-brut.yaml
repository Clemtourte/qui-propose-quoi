titre: 120 € net de plus par mois pour un salaire médian, par la baisse des cotisations
texte: Dans le même reportage de France 2 du 31 août 2026, il promet 120 € net de plus par mois sur un salaire médian, par
  une baisse de cotisations financée par la taxation des très grosses successions (plus de 2 millions d'euros), qui laisserait
  selon lui « 99% des héritages » intacts. Aucun coût n'est donné. Le financement par les successions est détaillé dans
  le thème fiscalité et budget.
