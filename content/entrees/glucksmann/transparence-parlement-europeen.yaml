titre: 'Au Parlement européen : les réformes de transparence après le Qatargate « pas suffisantes à long terme »'
texte: 'Eurodéputé (groupe S&D), il juge à l''issue du vote de septembre 2023 sur la réforme du règlement intérieur : «
  En l''état actuel du rapport de force politique au Parlement, ce n''était pas possible d''obtenir beaucoup mieux » et
  « Mais je ne pense pas que ce sont des réformes suffisantes à long terme » pour rendre l''institution transparente et
  éviter les conflits d''intérêts ou les influences néfastes (Toute l''Europe). La réforme adoptée le 13 septembre 2023
  interdit le lobbying rémunéré lié au processus décisionnel et impose la publication des rendez-vous avec des lobbyistes.
  Aucune proposition de transparence de la vie publique de sa candidature présidentielle n''a été trouvée.'
