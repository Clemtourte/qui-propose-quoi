candidat: glucksmann
theme: securite-justice
rubrique: mesure
nature: position
titre: "Narcotrafic : viser l'argent, faire confiance aux maires"
texte: >-
  Au congrès des maires de novembre 2025, avant la primaire, il appelle à « lutter contre le blanchiment d'argent » et
  contre « les cryptomonnaies, qui servent à laver l'argent des trafiquants ». Il dit vouloir « faire confiance aux
  maires » pour la sécurité, qu'il s'agisse d'armer ou non la police municipale ou d'installer des caméras de
  vidéosurveillance, un usage qui « doit être encadré par la loi ».
date: 2025-11-19
sources: [publicsenat-2025-11-19-glucksmann-narcotrafic]
