titre: '« Plan Marshall pour le logement » : fonds foncier, encadrement des loyers, abrogation de la loi Kasbarian (Acte
  I de Place publique)'
texte: 'Le document « L''Acte I » de Place publique (chantier 31, « Faire un plan Marshall pour le logement ») propose :
  « Créer un fonds national pour aider les collectivités à acquérir du foncier » et relever les objectifs nationaux annuels
  de logements sociaux, par contrats territoriaux ; développer le Bail Réel Solidaire pour en faire « une offre de masse
  » ; accélérer la rénovation des passoires thermiques et simplifier les normes ; lutter contre la vacance (élargir le droit
  de préemption des collectivités, renforcer la fiscalité sur la vacance longue) ; « Encadrer les loyers dans les zones
  en grande tension » ; étendre le dispositif Visale ; « abroger la loi Kasbarian au profit d''un dispositif plus équilibré,
  combinant indemnisation rapide des bailleurs en cas d''impayés et accompagnement renforcé des locataires » ; réguler les
  meublés touristiques ; un programme « logement d''abord » contre le sans-abrisme. Aucun montant ni objectif chiffré n''est
  indiqué dans le passage lu. Texte de Place publique (« Acte I », 2025, date à confirmer), antérieur à la primaire ; ce
  n''est pas un programme présidentiel.'
