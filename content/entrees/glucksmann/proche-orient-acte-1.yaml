titre: « reconnaître enfin un Etat Palestinien aux côtés d'Israël » (Acte I de Place publique)
texte: 'Le document « L''Acte I » de Place publique propose, dans son chantier sur la coopération internationale : « Défendre
  le respect du droit international et humanitaire, des droits humains, reconnaître enfin un Etat Palestinien aux côtés
  d''Israël ». Le texte est antérieur à la reconnaissance par la France de septembre 2025 si la date de 2025 est exacte
  (non confirmée). Il ne parle ni de sanctions, ni d''embargo, ni de l''Iran. Texte de Place publique (« Acte I », 2025,
  date à confirmer), antérieur à la primaire ; ce n''est pas un programme présidentiel.'
