appui:
  faits: >-
    Sur TF1, le 23 août 2026 : « selon l'OCDE, nous avons l'école qui reproduit le plus les inégalités en Europe, qui maltraite le plus les enseignants. Un
    enseignant français en école primaire gagne moins qu'un enseignant portugais ou slovène. » Une vérification de franceinfo sur ce salaire figure plus
    bas sur cette page.
  raisonnement: >-
    La baisse du nombre d'élèves doit servir « non pas pour fermer des classes ou des écoles, mais pour augmenter le taux d'encadrement des élèves ». Le
    plan commence par la rémunération, pour « rattraper les moyennes européennes » selon Public Sénat.
  sources: [publicsenat-2026-08-24-glucksmann-propositions, franceinfo-2026-08-30-glucksmann-enseignants, publicsenat-2026-08-31-candidats-ecole]
  donnees:
  - texte: >-
      Ministère de l'Éducation nationale, sur PISA : en 2025, « l'origine sociale reste fortement liée aux résultats scolaires en France ». L'effet du milieu
      social en mathématiques a diminué davantage en France que dans tout autre pays entre 2012 et 2022, tout en restant supérieur à la moyenne de l'OCDE. Ce
      document ne classe pas les pays européens entre eux.
    sources: [men-2026-09-pisa-2025]
  - texte: >-
      OCDE, « Regards sur l'éducation 2026 », cité par franceinfo : un enseignant de collège avec 15 ans d'ancienneté gagnait en 2025 en moyenne 18 % de moins
      que la moyenne de l'OCDE ; l'écart est de 2 % en début de carrière.
    sources: [franceinfo-2026-10-02-vof-primaire-gauche]
