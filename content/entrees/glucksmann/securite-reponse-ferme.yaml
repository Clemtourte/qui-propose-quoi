candidat: glucksmann
theme: securite-justice
rubrique: mesure
nature: position
titre: "Après le 17 octobre : une réponse « extrêmement ferme »"
citation:
  texte: "Il faut que ceux qui ont été identifiés soient recherchés, qu'on aille les traquer, qu'on aille les chercher chez eux, qu'ils répondent de leurs actes devant la justice"
  date: 2026-10-19
  contexte: Entretien sur RTL, rapporté par l'AFP
texte: >-
  Il appelle à agir « de manière extrêmement ferme » face aux violences et s'interroge : « Comment on explique qu'il y
  ait si peu d'effectifs (de police) sur le terrain ? » Il n'a pas présenté, à cette date, de mesures détaillées sur
  la police, les peines ou les prisons.
date: 2026-10-19
sources: [afp-2026-10-19-glucksmann-violences]
appui:
  faits: >-
    Il pose la question des effectifs (« si peu d'effectifs »), sans chiffre, et aucune donnée n'a été lue sur ceux engagés
    le 17 octobre.
  raisonnement: >-
    Il n'a pas présenté de mesures détaillées. Le livret du PS « Être en sécurité(s) » veut « restaurer la confiance des
    Français dans leur police » par « un double réarmement, moral et matériel », et s'inspirer de la « désescalade ». Selon
    LCP, on ne sait pas s'il reprendra toute cette ligne.
  sources: [afp-2026-10-19-glucksmann-violences, lcp-2026-10-19-maintien-ordre-propositions]
