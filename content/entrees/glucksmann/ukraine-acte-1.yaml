titre: « Augmenter drastiquement l'aide militaire à l'Ukraine » (Acte I de Place publique)
texte: Le document « L'Acte I » de Place publique (chantier 2, « Bâtir la défense européenne ») propose d'« Augmenter drastiquement
  l'aide militaire à l'Ukraine qui est notre première ligne de défense et notre soutien aux alliés européens comme la Moldavie
  et l'Arménie ». Aucun montant n'est indiqué. Texte de Place publique (« Acte I », 2025, date à confirmer), antérieur à
  la primaire ; ce n'est pas un programme présidentiel.
