titre: « Mon combat, c'est que Netanyahou paie pour ses crimes » (débat de la primaire de gauche, 1er octobre 2026)
texte: 'Dans un direct du Figaro repris par Centre Europe Presse le 1er octobre 2026, lors d''un échange avec Olivier Faure
  sur l''emploi du mot « génocide » à Gaza, Raphaël Glucksmann déclare : « Mon combat, c''est que Netanyahou paie pour ses
  crimes » et « La cour pénale internationale est sous sanction américaine ! » ; il reproche à Olivier Faure : « Olivier,
  tu vas m''écouter. Ce que tu fais est largement obscène. » Olivier Faure répond qu''il aurait dénoncé un « génocide »
  s''il avait été chef de l''État, et qu''il « souhaite la sécurité d''Israël ». Le texte lu ne dit pas la position de Raphaël
  Glucksmann sur le mot « génocide », la reconnaissance ou les sanctions ; sa position de 2024 est dans l''entrée précédente.'
