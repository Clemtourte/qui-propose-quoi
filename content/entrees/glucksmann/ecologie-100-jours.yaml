titre: « Les 100 jours de la révolution écologique »
citation:
  texte: Dès notre victoire, nous engagerons les 100 jours de la révolution écologique
  date: '2026-08-25'
  contexte: Déplacement dans un parc éolien en Charente-Maritime, avec Yannick Jadot, rapporté par LCP
texte: >-
  Il veut « libérer la France » de « son addiction au gaz et au pétrole » et produire en France, notamment des panneaux
  photovoltaïques, pour ne pas dépendre de la Chine. Il défend à la fois les renouvelables et la construction de
  nouveaux EPR, point sur lequel il est en désaccord avec Yannick Jadot. Le 12 octobre 2026, L'Info durable décrit
  ce plan comme en préparation, confiée à Yannick Jadot ; interrogé sur son coût, il répondait en août : « Nous
  le chiffrerons lors de la présentation de ce plan ».
questions: [renouvelables, nucleaire, climat]
date: '2026-08-25'
