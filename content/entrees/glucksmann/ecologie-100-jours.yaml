appui:
  faits: >-
    Il parle d'« addiction au gaz et au pétrole », sans chiffre dans les propos rapportés. Le plan n'est pas chiffré à cette
    date.
  raisonnement: >-
    « La révolution écologique, c'est une révolution industrielle » : produire en France pour ne pas être « dépendant en tout
    de la Chine ». Il reconnaît un point « qui reste à discuter » avec Yannick Jadot, les nouveaux réacteurs.
  sources: [lcp-2026-08-25-glucksmann-100-jours]
