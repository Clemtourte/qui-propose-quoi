titre: Projet territorial de santé, fin de la tarification à l'acte à l'hôpital, plan de prévention hors de l'ONDAM (Acte
  I de Place publique)
texte: 'Le document « L''Acte I » de Place publique (chantiers 23 et 24) propose : « Bâtir un modèle coopératif de santé
  piloté localement, à travers un Projet territorial de Santé » ; des centres ou maisons de santé, dispensaires, permanences
  mobiles en zones rurales et centres pour les « petites urgences » ; « mieux les rémunérer, améliorer leurs conditions
  de travail » pour les soignants ; « en finir avec la tarification à l''acte à l''hôpital » au profit d''un « financement
  global, territorial et pluri-annuel » ; mutualiser les systèmes d''information de l''assurance maladie obligatoire et
  des complémentaires ; « Déployer un plan de prévention d''ampleur en sortant de l''Objectif national de dépense d''assurance
  maladie (ONDAM) » et créer un fonds territorial de prévention. Aucun montant ni calendrier n''est indiqué dans les passages
  lus. Texte de Place publique (« Acte I », 2025, date à confirmer), antérieur à la primaire ; ce n''est pas un programme
  présidentiel.'
