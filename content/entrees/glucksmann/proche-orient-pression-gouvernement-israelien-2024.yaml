titre: « Il est temps de mettre beaucoup plus de pression sur le gouvernement israélien » (2024)
texte: 'D''après The Times of Israel (9 mai 2024) : le 26 avril 2024 sur BFMTV, Raphaël Glucksmann déclare « Il est temps
  de mettre beaucoup plus de pression sur le gouvernement israélien » et, avec le Parti socialiste, réclame un État palestinien,
  estimant qu''il « ne suffit pas de répéter que nous voulons une solution à deux États ». Le 7 mai 2024 sur Europe 1, il
  juge que le gouvernement Netanyahou n''offre « strictement aucune perspective aux Palestiniens, depuis le début », et
  demande un cessez-le-feu et la libération des otages. En mars 2024 sur TMC : « Je n''emploie pas le terme de génocide
  pour qualifier ce qui se passe à Gaza ». Propos de 2024 ; l''article ne mentionne aucune position sur des sanctions et
  ne précise pas s''il demande la reconnaissance formelle. Sa position actuelle n''a pas été trouvée.'
