titre: Proportionnelle et investiture du Premier ministre
texte: >-
  Pour « régénérer la démocratie », il défend la proportionnelle, l'investiture du Premier ministre par un vote
  de confiance de l'Assemblée nationale et un financement des partis par un « fléchage » des fonds publics choisi
  par les citoyens dans leur déclaration d'impôt (juin 2025). Le 8 février 2026, il cosigne avec soixante-neuf autres
  élus une tribune demandant la proportionnelle aux prochaines élections législatives.
