titre: Plan d'accès aux soins annoncé en avril 2024, alors Premier ministre
texte: 'Le 6 avril 2024, Gabriel Attal, Premier ministre, annonce : une sanction de 5 euros pour un rendez-vous non honoré,
  afin de « récupérer 15 à 20 millions de rendez-vous médicaux chaque année » ; des places en deuxième année de médecine
  portées de 10 800 (2023) à 12 000 (2025) puis 16 000 (2027) ; un accès direct aux kinésithérapeutes (13 départements)
  et à des spécialistes à l''essai ; un médecin de garde « à moins de 30 minutes » de chaque Français ; une consultation
  de santé mentale remboursée 50 euros au lieu de 30 ; une réforme de l''AME annoncée pour l''été. L''application de ces
  mesures n''a pas été vérifiée. Aucune proposition santé de sa candidature 2027 n''a été trouvée.'
date: '2024-04-06'
