candidat: attal
theme: securite-justice
rubrique: mesure
nature: position
titre: "Après le 17 octobre : toutes les forces sur le terrain, état d'urgence si nécessaire"
citation:
  texte: "Il y a une urgence : rétablir l'ordre"
  date: 2026-10-19
  contexte: Entretien sur RTL, après les violences en marge de la mobilisation du 17 octobre
texte: >-
  Il juge qu'il y a eu « une faillite dans la capacité à anticiper et gérer » la journée du 17 octobre. Il propose de
  concentrer l'ensemble des forces de l'ordre sur « la protection des biens et des Français », sans congés ni repos
  tant que le calme n'est pas revenu, et de confier si besoin aux forces armées la garde de bâtiments publics. Il
  approuve l'appel de Bruno Retailleau à l'état d'urgence : « Il faut pouvoir faire des perquisitions
  administratives et des assignations à résidence (...) S'il faut pour ça décréter un état d'urgence, il faut le
  faire. »
date: 2026-10-19
sources: [rtl-2026-10-19-attal-17-octobre, lcp-2026-10-19-maintien-ordre-propositions]
appui:
  faits: >-
    Il juge qu'il y a eu « une faillite dans la capacité à anticiper et gérer » la journée du 17 octobre, sans citer de
    chiffre dans les propos lus.
  raisonnement: >-
    Pour lui, l'état d'urgence donnerait des moyens précis : « Il faut pouvoir faire des perquisitions administratives et
    des assignations à résidence. » Aucun point chiffré n'est invoqué, donc aucune donnée n'est mise en regard.
  sources: [rtl-2026-10-19-attal-17-octobre, lcp-2026-10-19-maintien-ordre-propositions]
