titre: 'Iran : une opération légitime « si la finalité » est de faire tomber le régime, avec « la préparation de l''après
  » (mars 2026)'
texte: 'Le 2 mars 2026 aux 4 Vérités (France 2) : « Si la finalité de cette opération est de faire tomber effectivement
  le régime des Mollas » ; il ajoute que « des interventions extérieures pour faire tomber un régime peuvent se traduire
  par des échecs », que « Tout l''enjeu, c''est la préparation de l''après » et que « le droit international ne peut pas
  devenir un totem d''immunité pour ceux qui le bafouent matin, midi et soir ». Selon franceinfo (11 mars), il appelle à
  une « coalition pour faire tomber le régime des mollahs, mais aussi pour préparer l''après », menée par la France et l''Union
  européenne. Le 18 juin, à propos du protocole d''accord américano-iranien : « est une forme de soulagement », texte qui
  « reste très mystérieux » ; il demande que la France soit « à l''initiative » et que les Européens soient « associés aux
  discussions […] sur le nucléaire iranien » : « On ne peut pas laisser ces discussions se faire sans nous ». La députée
  LFI Mathilde Panot a critiqué l''un de ses propos sur l''ONU (LCP, 4 mars) ; le propos n''a pas été retrouvé.'
