titre: Reconnaissance d'un État palestinien « pas un tabou » mais « utile au processus » (mai 2024, alors Premier ministre)
texte: 'Le 29 mai 2024, alors Premier ministre, interrogé au Sénat, Gabriel Attal estime que la reconnaissance d''un État
  palestinien n''est « pas un tabou » et qu''elle « doit être utile au processus » ; il demande : « Après la reconnaissance
  unilatérale […], qu''est-ce qui a changé ? » et dit que « notre responsabilité est de mettre ce sujet au service d''un
  accord global ». Il appelle à la libération des otages, rappelant qu''il y avait encore « deux otages français retenus
  par le Hamas ». Position de 2024, antérieure à la reconnaissance française de septembre 2025 ; sa position actuelle n''a
  pas été trouvée.'
