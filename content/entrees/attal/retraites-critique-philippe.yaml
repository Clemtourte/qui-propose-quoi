auteur: Édouard Philippe, candidat (Horizons), vidéo du 29 septembre 2026
titre: Édouard Philippe juge « financièrement intenable » un système sans âge légal
texte: >-
  Sans nommer Gabriel Attal (LCP y voit une attaque visant son rival), il critique l'idée d'« un système sans âge, fondé
  sur la seule durée de cotisation et sur la liberté », qu'il juge « financièrement intenable » et « socialement
  incroyablement injuste », car cela « pénalise les carrières hachées, notamment les femmes ».
