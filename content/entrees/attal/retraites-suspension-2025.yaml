titre: Abstention sur la suspension de la réforme des retraites (12 novembre 2025)
texte: >-
  Député, il s'abstient lors du vote, en première lecture, de l'article 45 bis du projet de loi de financement de la
  sécurité sociale pour 2026, qui suspend jusqu'au 1er janvier 2028 le relèvement de l'âge légal prévu par la réforme
  de 2023. Le groupe Ensemble pour la République compte 67 abstentions, 3 voix pour et 5 contre. L'article est adopté
  par 255 voix contre 146.
date: 2025-11-12
