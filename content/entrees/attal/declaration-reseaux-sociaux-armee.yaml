titre: "Après le 17 octobre : bloquer les réseaux sociaux dans les zones d'émeutes ; l'armée « évidemment pas pour faire du maintien de l'ordre »"
citation:
  texte: Il faut que ce soit un blocage temporaire, ciblé, sur les territoires où se déroulent des émeutes
  date: 2026-10-19
  contexte: Entretien sur RTL, rapporté par 6Medias avec L'Express
texte: >-
  Il propose de couper temporairement les réseaux sociaux : « Vous avez des points de convergence et de rassemblement
  qui sont organisés au travers des réseaux sociaux. » Comme Premier ministre, il avait coupé l'accès à TikTok en
  Nouvelle-Calédonie au printemps 2024 ; selon L'Express (via 6Medias), le Conseil d'État « avait alors retoqué cette
  interdiction en énonçant des règles », dont le caractère temporaire et ciblé qu'il reprend ici. À l'AFP, il précise sa proposition de recourir à l'armée (voir Programme) : il faut
  « libérer les forces de l'ordre assurant des gardes statiques », « quitte à les remplacer par des réservistes, voire
  des forces armées, évidemment pas pour faire du maintien de l'ordre mais pour les remplacer ».
date: 2026-10-19
