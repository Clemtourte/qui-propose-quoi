titre: « Le soutien à l'Ukraine, ce n'est pas une opération humanitaire [...], c'est notre défense à nous »
texte: 'Le 15 octobre 2026 il déclare : « Le soutien à l''Ukraine, ce n''est pas une opération humanitaire pour se faire
  plaisir, c''est notre défense à nous » et « si l''Ukraine tombe, ça aura un impact aussi sur le prix de l''énergie, notamment,
  qui va encore plus exploser ». Il affirme que le RN « veut laisser les Ukrainiens se faire trucider » et que « Depuis
  le début, ils ont toujours refusé et voté contre les sanctions contre le régime du Kremlin » (assertion de Gabriel Attal
  sur les votes du RN, non vérifiée ici). Le 5 septembre, il juge « sidérante » la proposition du RN et l''accuse de vouloir
  « abandonner l''Ukraine au profit de la Russie ». Les articles lus ne rapportent ni montant d''aide, ni proposition sur
  les sanctions, les garanties de sécurité ou l''adhésion.'
