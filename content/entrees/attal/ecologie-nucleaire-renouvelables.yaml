titre: Nucléaire et renouvelables, « trois quarts » de l'énergie produits en France
texte: >-
  Le 22 juillet 2025, avec des propositions issues des « conventions thématiques » de Renaissance, il propose une
  loi de programmation écologique tous les cinq ans, une TVA à 5,5 % sur les voitures électriques au lieu de la
  prime à la conversion et un « compte épargne carbone-transition ». Il veut que les « trois quarts » de l'énergie
  soient produits en France « dans les prochaines années » et défend un mix nucléaire et renouvelables. En juin
  2025, il appelle à voter contre la proposition de loi sur l'énergie après l'adoption d'un moratoire sur l'éolien
  et le solaire, qu'il qualifie d'« axe anti-écologie » LR-RN.
