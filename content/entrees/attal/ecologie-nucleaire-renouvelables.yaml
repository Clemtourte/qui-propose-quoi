candidat: attal
theme: ecologie-energie
rubrique: mesure
nature: position
titre: Nucléaire et renouvelables, « trois quarts » de l'énergie produits en France
texte: >-
  Le 22 juillet 2025, avec des propositions issues des « conventions thématiques » de Renaissance, il propose une
  loi de programmation écologique tous les cinq ans, une TVA à 5,5 % sur les voitures électriques au lieu de la
  prime à la conversion et un « compte épargne carbone-transition ». Il veut que les « trois quarts » de l'énergie
  soient produits en France « dans les prochaines années » et défend un mix nucléaire et renouvelables. En juin
  2025, il appelle à voter contre la proposition de loi sur l'énergie après l'adoption d'un moratoire sur l'éolien
  et le solaire, qu'il qualifie d'« axe anti-écologie » LR-RN.
questions: [nucleaire, renouvelables]
date: '2025-07-22'
sources:
- linfodurable-2025-07-22-attal-nouvelle-donne
- lcp-2025-06-23-attal-axe-anti-ecologie
appui:
  faits: >-
    Il ne cite pas de chiffre sur la situation actuelle dans les propos rapportés.
  raisonnement: >-
    Un argument de souveraineté : « Ceux qui refusent le nucléaire et le renouvelable organisent notre vassalisation au
    Moyen-Orient et parfois à des régimes islamistes et autoritaires. »
  sources: [linfodurable-2025-07-22-attal-nouvelle-donne]
  donnees:
    - texte: >-
        Service statistique du ministère de la Transition écologique (2025, provisoire) : 62,7 % d'indépendance énergétique,
        meilleur niveau depuis 1970. Son objectif, des « trois quarts » de l'énergie produits en France, n'est pas forcément
        mesuré de la même façon.
      sources: [sdes-2026-04-22-bilan-energetique-2025]
