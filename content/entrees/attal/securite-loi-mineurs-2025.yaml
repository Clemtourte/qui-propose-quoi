titre: Loi sur la justice des mineurs (2025), en grande partie censurée
texte: >-
  Sa proposition de loi « visant à renforcer l'autorité de la justice à l'égard des mineurs délinquants et de leurs
  parents », adoptée par le Parlement en mai 2025, est en partie déclarée contraire à la Constitution le 19 juin 2025,
  sur saisine de députés et sénateurs de gauche. Sont notamment censurées la comparution immédiate des mineurs d'au
  moins 16 ans (article 4) et la règle qui écartait par principe l'atténuation des peines pour les mineurs de plus de
  16 ans en récidive (article 7), jugée contraire au principe d'atténuation de la responsabilité pénale des mineurs
  en fonction de l'âge. Au total, les articles 4, 5, 7, 12 et 15 et une partie de l'article 6 sont censurés ; la
  circonstance aggravante visant les parents qui se soustraient à leurs obligations légales (article 1er) est
  validée.
date: 2025-06-19
