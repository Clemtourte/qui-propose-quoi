titre: Ministre de l'Éducation nationale (juillet 2023 - janvier 2024) et groupes de niveau
texte: >-
  Ministre de l'Éducation nationale de juillet 2023 à janvier 2024, il souhaite des groupes de niveau en français et en
  mathématiques en 6e et en 5e. Mis en place par sa successeure Nicole Belloubet, ils sont obligatoires de septembre 2024
  à juin 2026, puis rendus facultatifs à la rentrée 2026 par le ministre Édouard Geffray. Le brevet obligatoire pour
  entrer en seconde, qu'il avait également porté, a été abandonné par Élisabeth Borne. L'évaluation des groupes de
  niveau figure dans les affirmations vérifiées ci-dessous.
date: '2026-10-16'
