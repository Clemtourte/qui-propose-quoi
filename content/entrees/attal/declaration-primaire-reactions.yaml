auteur: Laurent Marcangeli, président du groupe Horizons à l'Assemblée ; Maël de Calan, porte-parole de la campagne d'Édouard Philippe ; David Lisnard, candidat (Nouvelle Énergie)
titre: "Primaire : refus dans le camp d'Édouard Philippe, soutien de David Lisnard"
citation:
  texte: >-
    Ce n'est pas ce 'en même temps' aussi cafouilleux qu'hasardeux qui permettra d'éviter [un duel RN-LFI]
  date: 2026-10-28
  contexte: Laurent Marcangeli, message sur X
texte: >-
  Maël de Calan, porte-parole de la campagne d'Édouard Philippe, juge à franceinfo qu'« une primaire n'aurait que des
  inconvénients » et que « ce serait du suicide pour notre famille politique ». David Lisnard, partisan d'une primaire
  ouverte, se félicite auprès de l'AFP que l'idée « progresse ». Les réactions de l'entourage de Bruno Retailleau,
  rapportées anonymement, ne sont pas reprises ici.
