titre: Certificat d'études à l'entrée en 6e, moins de 20 élèves par classe en primaire
citation:
  texte: Je veux mettre fin au doute français sur l'école de la République
  date: '2026-08-25'
  contexte: Entretien au Monde, rapporté par LCP et Public Sénat
texte: >-
  Il veut « dès 2027 » une « loi de programmation pour l'école », pilotée par « un ministre de l'Education nationale qui
  restera en poste cinq ans ». En primaire, il veut « atteindre moins de 20 élèves par classe grâce à la baisse
  démographique ». Il propose de rétablir le certificat d'études « à l'entrée en 6e pour garantir que les élèves ont le
  bagage nécessaire », avec une « année passerelle » pour ceux qui n'ont pas le niveau, de rendre le brevet obligatoire
  pour passer en seconde et une « généralisation des groupes de niveau en français et en mathématiques ». Il veut fermer
  « les 100 collèges qui constituent les pires ghettos scolaires » en répartissant les élèves dans d'autres
  établissements, et « que le traitement des enseignants soit revalorisé de 200 euros net par mois, jusqu'à 500 euros net
  pour les milieux de carrière ». Son équipe évalue ce coût à 2,5 milliards d'euros (Public Sénat).
