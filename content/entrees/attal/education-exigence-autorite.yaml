titre: Certificat d'études, redoublement, groupes de niveau et barème national des sanctions
citation:
  texte: >-
    Laisser des élèves glisser de classe en classe alors qu'ils n'ont pas le niveau pour passer dans la classe supérieure, c'est le pire service qu'on
    peut leur rendre.
  date: '2026-09-09'
  contexte: Sur franceinfo, propos repris par son site de campagne
texte: >-
  Son site prévoit un certificat d'études « en fin de CM2 » ; l'élève qui échoue suit une « année passerelle » avant le collège. Le redoublement doit
  « redevenir une décision pédagogique ordinaire ». Le brevet deviendrait obligatoire pour entrer en seconde : sans lui, l'élève ne redouble pas sa 3e
  mais rejoint une « prépa Lycée » en petits effectifs. Il veut rétablir « dès 2027 » les groupes de niveau en français et en mathématiques au collège,
  et généraliser la méthode de Singapour en mathématiques. Sur l'autorité : un conseil de discipline dès le primaire et un barème national des sanctions,
  pour que « la même faute » entraîne « la même sanction ». Les absences courtes des enseignants seraient remplacées sur place par l'équipe de
  l'établissement. Il veut aussi fermer « les 100 collèges qui constituent les pires ghettos scolaires » en répartissant les élèves dans d'autres
  établissements (entretien au Monde, rapporté par LCP).
