candidat: attal
rubrique: declaration
nature: position
titre: Une « primaire des démocrates » pour désigner un candidat unique de la droite et du centre
citation:
  texte: >-
    Il est temps d'être tous responsables et d'organiser le rassemblement auquel des millions de Français aspirent à
    travers une grande primaire
  date: 2026-10-28
  contexte: Journal de 20 heures de TF1
texte: >-
  Il veut « empêcher un deuxième tour dont notre pays ne se relèverait pas entre la France insoumise et le Rassemblement
  national ». La primaire serait ouverte aux candidats qui portent « un refus clair et net de toute alliance avec
  l'extrême gauche ou avec l'extrême droite », avec un vote « d'ici à la fin du mois de janvier » et « une
  participation symbolique d'un ou deux euros ». Il juge que ceux qui resteront à l'écart « porteront quelque part la
  responsabilité de la division ».
