titre: Une « journée référendaire » chaque année
citation:
  texte: Je n'ai pas de tabou sur les sujets qui pourraient être soumis aux Français
  date: '2026-08-01'
  contexte: Entretien au JDD
texte: >-
  Il propose d'organiser chaque année un référendum lors d'une « journée référendaire », avec plusieurs questions
  à choix multiples sur des sujets préparés avec les forces politiques et les partenaires sociaux, et de revoir
  la Constitution pour « faciliter massivement le recours au référendum ». Il veut aussi permettre aux maires d'organiser
  plus facilement des référendums locaux, et ramener le nombre de députés à 350 et celui des sénateurs à 200.
