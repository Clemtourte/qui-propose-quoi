titre: "« Préférence travail » et regroupement familial durci"
citation:
  texte: Il faut que la France accueille moins pour accueillir mieux
  date: 2026-05-26
  contexte: Entretien sur France Inter
texte: >-
  Il veut que « l'immigration économique » devienne la priorité de la politique migratoire et « durcir les conditions
  du regroupement familial », par exemple en augmentant la durée de résidence requise en France. Il juge
  « ni possible ni souhaitable » un moratoire de trois ans sur les entrées, proposé par Gérald Darmanin, et estime
  qu'une part d'immigration reste nécessaire.
date: 2026-05-26
