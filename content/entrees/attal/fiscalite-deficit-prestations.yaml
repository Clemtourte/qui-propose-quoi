candidat: attal
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Déficit à 3 % avant 2032, année blanche sur les prestations et 100 000 postes d'État en moins
citation:
  texte: Pour mon premier budget 2028, il faudra faire une année blanche sur l'ensemble des prestations sociales, en épargnant toutefois les petites retraites
  date: 2026-07-02
  contexte: Entretien au Parisien, rapporté par Moneyvox et Acteurs publics
texte: >-
  Il vise un déficit public de 3 % du PIB « avant 2032 » et un « cap » de 0 % du PIB en 2037, soumis au verdict des
  urnes à la fin du premier quinquennat, avec une règle d'or qu'il souhaite faire adopter par référendum. Il chiffre
  l'effort à 120 à 150 milliards d'euros d'économies, sans hausse d'impôts, dont deux tiers sur les dépenses sociales.
  Il prévoit des réformes des retraites, des arrêts maladie et de l'assurance chômage, et la suppression de 100 000
  postes de fonctionnaires d'État (non-remplacement de départs à la retraite, départs volontaires), en préservant
  l'Éducation nationale, les Armées, la Justice et l'Intérieur. Public Sénat cite une économie de 7 milliards d'euros
  pour ces postes (chiffre non recoupé).
chiffres:
  - libelle: Économies prévues sur dix ans, selon le candidat
    valeur: 120 à 150 Md€
    nature: position
questions: [budget]
reperes:
- question: budget
  mesure: >-
    120 à 150 Md€ d'économies sur dix ans, soit 12 à 15 Md€ par an en moyenne
  equivalent: >-
    environ 170 à 220 € par habitant, soit 0,40 à 0,50 % du PIB de 2025 ; 0,70 à 0,88 % des dépenses publiques de 2025
  calcul: >-
    12 Md€ / 69,082 millions d'habitants = 170 € ; 12 / 2990 Md€ de PIB = 0,40 % ; 12 / 1 714,2 Md€ de dépenses publiques = 0,70 % ; puis 15 Md€ / 69,082 millions d'habitants = 220 € ; 15 / 2990 Md€ de PIB = 0,50 % ; 15 / 1 714,2 Md€ de dépenses publiques = 0,88 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. 120 / 10 = 12 et 150 / 10 = 15 Md€ par an. Montant cumulé sur la période annoncée : la moyenne annuelle suppose un étalement régulier.
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-07-02
sources: [publicsenat-2026-07-03-attal-fonctionnaires, moneyvox-2026-07-03-attal-fonctionnaires, acteurspublics-2026-07-03-attal-fonctionnaires]
appui:
  faits: >-
    Sur son site, sans source citée : « sur 100 € d'argent public dépensé, 57 € financent le modèle social et seulement
    9 € l'éducation et 3 € la défense ». Et aussi : « Deux tiers de notre dette proviennent de l'absence de contrôle de
    notre modèle social, en particulier les retraites et la santé. »
  raisonnement: >-
    « Réformer le modèle social pour inciter davantage à l'activité et réduire son coût budgétaire : c'est possible et
    d'autres pays l'ont fait en Europe. » Les pays ne sont pas nommés.
  sources: [attalpresident-2026-dette-etat]
  donnees:
    - texte: >-
        Insee (données de 2024) : sur 1 672 Md€ de dépenses publiques, 41 % pour la protection sociale hors santé, 16 %
        pour la santé, 9 % pour l'enseignement et 54 Md€ pour la défense. En dix ans, la part du PIB consacrée à la
        protection sociale hors santé baisse de 0,8 point et celle de la santé monte de 0,6 point. Aucune donnée
        officielle n'a été trouvée sur la part de la dette attribuée au modèle social.
      sources: [insee-2026-02-depenses-par-fonction]
    - texte: >-
        Fonction publique, pour ses 100 000 postes d'État : 5,9 millions d'agents fin 2024, tous versants confondus (Insee),
        et 136 700 nouvelles pensions cette année-là (DGAFP).
      sources: [insee-2026-02-emploi-fonction-publique, dgafp-2025-departs-retraite]
