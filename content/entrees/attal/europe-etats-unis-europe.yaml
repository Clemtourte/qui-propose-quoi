titre: '« États-Unis d''Europe » : un noyau dur de pays, un référendum européen simultané, les compétences régaliennes aux
  États'
texte: 'Le 17 septembre 2026 à Reims, il juge que « l''Europe actuelle, à 27, a atteint ses limites » et plaide pour des
  « États-Unis d''Europe », sans préciser le nombre de pays : une fusion économique et écologique « d''abord entre un noyau
  dur de pays européens », ratifiée par « le premier référendum européen », « une consultation simultanée dans tous les
  pays qui auront vocation à les intégrer ». Il parle de « fédéralisme économique, technologique et écologique » et de «
  la disparition totale des frontières économiques » ; « les compétences régaliennes resteraient à la main des États ».
  L''article de franceinfo ne mentionne ni la défense, ni le budget européen, ni la majorité qualifiée.'
