titre: 'Iran : « Si l''objectif est de faire tomber le régime islamiste des mollahs, je m''en félicite » (mars 2026)'
texte: 'Dans un entretien publié par le Crif le 4 mars 2026 : « Si l''objectif est de faire tomber le régime islamiste des
  mollahs, je m''en félicite » et « cette opération crée une opportunité historique pour que le peuple iranien se libère
  ». Il estime que « Tout ce que la France peut entreprendre afin de faire chuter ce régime criminel, elle doit le faire
  au plus vite », propose d''« appuyer les oppositions iraniennes, aider aussi les États du Golfe » et que « La France doit
  défendre toutes ses emprises dans la région, en répliquant le cas échéant ». Il juge aussi qu''un Iran nucléarisé serait
  incontrôlable et déclare que « C''est la République islamique d''Iran qui a armé le Hamas ». Selon franceinfo (11 mars),
  il juge la réponse française « très tardive » et dit : « On ne peut pas se cacher derrière le droit international pour
  justifier la passivité ». L''entretien n''aborde pas la reconnaissance de la Palestine.'
