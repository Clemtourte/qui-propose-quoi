auteur: Laurent Nuñez, ministre de l'Intérieur
titre: "Le ministre de l'Intérieur refuse l'état d'urgence demandé par Bruno Retailleau"
citation:
  texte: Nous ne sommes pas à un stade où il y aura déclaration de l'état d'urgence
  date: 2026-10-21
  contexte: Réponse à Bruno Retailleau aux questions d'actualité au Sénat
texte: >-
  Il dit s'en tenir à des « mesures de droit commun » et de « police administrative » (interdictions de regroupement
  et de manifestation, couvre-feux) et rappelle les violences de la finale de la Ligue des champions de mai 2025,
  lorsque Bruno Retailleau était ministre de l'Intérieur, pour souligner que le maintien de l'ordre n'est « jamais une
  science exacte ».
