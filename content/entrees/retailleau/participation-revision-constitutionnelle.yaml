titre: Révision constitutionnelle soumise à référendum
texte: >-
  Dans un entretien au Figaro rapporté par Public Sénat, il prévoit une révision de la Constitution présentée au
  Parlement dès le début du mandat puis soumise à référendum à la rentrée 2027. Elle étendrait le référendum de
  l'article 11 à l'ensemble du domaine de la loi, ramènerait à environ 2,5 millions (contre près de 5 millions)
  les signatures nécessaires au référendum d'initiative partagée, et permettrait au président de la République,
  après la censure d'une loi par le Conseil constitutionnel, de « redonner la parole aux Français » par référendum
  ou devant le Congrès. Un second texte, une « Charte de l'ordre républicain », inscrirait dans la Constitution
  des orientations sur la sécurité, la laïcité, la nationalité et l'immigration.
