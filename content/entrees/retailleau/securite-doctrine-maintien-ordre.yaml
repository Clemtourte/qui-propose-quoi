titre: "Une « nouvelle doctrine du maintien de l'ordre »"
citation:
  texte: "Oui, il faut une nouvelle doctrine du maintien de l'ordre, qui protège les manifestants pacifiques, mais qui assume aussi – et je n'ai pas peur de le dire – la répression ferme des violences, l'interpellation des casseurs et l'usage de la force légitime"
  date: 2026-10-19
  contexte: Conférence de presse après les violences du 17 octobre
texte: >-
  Il estime que lorsqu'un policier intervient dans l'exercice de sa mission, « son action ne doit pas être présumée
  fautive avant même que les faits aient été examinés ».
