candidat: retailleau
theme: fiscalite-budget
rubrique: mesure
nature: position
titre: Plan de 197 milliards d'euros d'effort sur cinq ans
citation:
  texte: La suppression sera la règle, la prolongation d'activité sera l'exception
  date: 2026-10-12
  contexte: À propos des opérateurs de l'État (agences), lors de la présentation de son plan budgétaire, rapportée par Public Sénat
texte: >-
  Présenté le 12 octobre 2026 : 96 Md€ sur l'État, 91 Md€ sur la sphère sociale, 10 Md€ sur les collectivités ;
  excédent primaire en 2030, déficit sous 3 % du PIB en 2031 et à 2,2 % en fin de quinquennat. Non-remplacement de
  400 000 agents publics partant à la retraite (25 Md€), suppression ou réintégration d'opérateurs de l'État
  (7,5 Md€), budgets construits « systématiquement sur la base zéro » (11,5 Md€), 10 Md€ d'économies sur
  l'immigration, dont une grande partie dépend d'une révision constitutionnelle selon Public Sénat. Allègements de
  prélèvements : 30 Md€ pour les entreprises (dont la suppression d'impôts de production) et 21 Md€ pour les ménages
  (dont l'exonération de cotisations sur les heures supplémentaires) ; l'article cite aussi un total de 56 Md€.
chiffres:
  - libelle: Effort sur cinq ans, selon le candidat
    valeur: 197 Md€
    nature: position
  - libelle: Agents publics non remplacés
    valeur: 400 000
    nature: position
questions: [budget]
reperes:
- question: budget
  mesure: >-
    197 Md€ d'effort sur cinq ans, soit 39,4 Md€ par an en moyenne
  equivalent: >-
    environ 570 € par habitant, soit 1,3 % du PIB de 2025 ; 2,3 % des dépenses publiques de 2025
  calcul: >-
    39,4 Md€ / 69,082 millions d'habitants = 570 € ; 39,4 / 2990 Md€ de PIB = 1,3 % ; 39,4 / 1 714,2 Md€ de dépenses publiques = 2,3 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. 197 / 5 = 39,4 Md€ par an. Montant cumulé sur la période annoncée : la moyenne annuelle suppose un étalement régulier.
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-10-12
sources: [publicsenat-2026-10-12-retailleau-economies, lcp-2026-10-12-retailleau-plan-economies]
appui:
  faits: >-
    Il chiffre la dette de l'État « à plus de 3.400 milliards » et juge la France « déjà entrée dans une première phase
    de la crise » sur les marchés. Le document de son plan n'a pas été trouvé.
  raisonnement: >-
    « Je veux donner un grand coup de frein à la dépense publique et un coup d'accélérateur à la croissance. » Sur
    l'alternative : « C'est ça ou la Grèce ».
  sources: [lagazettefrance-2026-10-12-afp-retailleau]
  donnees:
    - texte: >-
        Insee : dette publique de 3 460,5 Md€ fin 2025, soit 115,7 % du PIB, toutes administrations confondues. Fonction
        publique : 5,9 millions d'agents fin 2024 et 136 700 nouvelles pensions cette année-là.
      sources: [insee-2026-05-29-comptes-apu-2025, insee-2026-02-emploi-fonction-publique, dgafp-2025-departs-retraite]
    - texte: >-
        Commission d'enquête du Sénat, citée par Public Sénat : environ 500 M€ d'économies sur les agences de l'État, si
        aucune politique publique n'est supprimée.
      sources: [publicsenat-2026-10-06-contre-budget-rn]
