titre: 'Loi de programmation militaire actualisée : « Nous ferons des économies, nous créerons de la richesse et nous financerons
  la nouvelle LPM »'
texte: 'Dans la nuit du 2 au 3 juin 2026, le Sénat adopte en commission puis rejette en séance l''effort supplémentaire
  de 36 Md€ de l''actualisation de la loi de programmation militaire : la commission de la défense avait voté 14 Md€ de
  plus (50 Md€ au total, au moins 2,7 % du PIB en 2030). Public Sénat rapporte que les sénateurs LR ont voté contre les
  amendements rétablissant 36 Md€ puis contre l''article 2 ; il ne rapporte pas le vote de Bruno Retailleau lui-même. À
  la ministre qui l''interroge sur le financement de 14 Md€ supplémentaires, il répond : « Nous ferons des économies, nous
  créerons de la richesse et nous financerons la nouvelle LPM ». Sa position sur l''OTAN, la défense européenne, la dissuasion
  et l''Union européenne n''a pas été trouvée.'
