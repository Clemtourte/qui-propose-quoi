titre: Vote pour la réforme des retraites au Sénat (16 mars 2023)
texte: >-
  Sénateur et président du groupe Les Républicains, il vote pour le texte élaboré par la commission mixte paritaire
  sur la réforme des retraites (report de l'âge légal de 62 à 64 ans), adopté par 193 voix contre 114 et
  38 abstentions. Le groupe LR compte 119 voix pour, 6 contre et 19 abstentions.
date: 2023-03-16
