titre: "Loi narcotrafic (2025), adoptée quand il est ministre de l'Intérieur"
citation:
  texte: "C'est un texte qui me tient à cœur, car je l'ai vu naître. J'étais président du groupe qui avait déclaré sur son droit de tirage, au Sénat, la commission d'enquête"
  date: 2025-04-10
  contexte: Conférence de presse sur ses six premiers mois au ministère de l'Intérieur
texte: >-
  La loi visant à sortir la France du piège du narcotrafic est définitivement adoptée par le Sénat le 28 avril 2025
  puis par l'Assemblée nationale le 29 avril 2025 (396 voix contre 68), alors qu'il est ministre de l'Intérieur. Elle
  crée un parquet national anticriminalité organisée, un régime carcéral plus strict pour les gros trafiquants,
  refond le régime des repentis et permet la fermeture des commerces suspectés de blanchiment.
date: 2025-04-29
