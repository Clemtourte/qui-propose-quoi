titre: "« Une sorte de régression vers les origines ethniques » (2023)"
citation:
  texte: Certes, ce sont des Français, mais ce sont des Français par leur identité […] Malheureusement pour la deuxième, la troisième génération, il y a comme une sorte de régression vers les origines ethniques
  date: 2023-07-05
  contexte: Sur France Info, à propos des émeutes de juin-juillet 2023, alors qu'il préside le groupe LR au Sénat
texte: >-
  Il maintient ses mots le jour même : « Je ne regrette rien du tout. » Aurélien Pradié, de son propre parti, déclare ne « pas accepter » ces propos.
  Aucune condamnation de Bruno Retailleau pour racisme ou discrimination n'a été trouvée.
date: 2023-07-05
