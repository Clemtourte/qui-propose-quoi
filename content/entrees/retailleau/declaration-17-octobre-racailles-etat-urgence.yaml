titre: "Après le 17 octobre : « une convergence entre l'extrême gauche et aussi des racailles », et l'état d'urgence"
citation:
  texte: >-
    Ce qu'il s'est passé, c'est cette convergence entre l'extrême gauche et aussi des racailles, voilà, des délinquants
    venant de banlieue. Oui, il y a un lien entre une immigration massive qui crée des désordres sécuritaires et ce
    qu'il s'est passé dimanche.
  date: 2026-10-19
  contexte: Conférence de presse au siège des Républicains, rapportée par franceinfo
texte: >-
  Le 21 octobre, aux questions d'actualité au Sénat, il lance au Premier ministre : « il faut décréter l'état d'urgence.
  La chienlit, ça suffit. » Le 22 octobre, après la réunion des partis à Matignon, il juge « cocasse » la présence
  d'élus LFI, « qui ont une responsabilité majeure dans le climat de violence », et met en question, selon franceinfo,
  l'organisation du second tour le 2 mai, au lendemain du 1er-Mai. Ses mesures (déchéance de nationalité, loi
  anticasseurs) figurent dans le thème sécurité et justice.
date: 2026-10-19
