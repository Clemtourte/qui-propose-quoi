titre: 4 Md€ d'économies sur les arrêts maladie et un jour de carence dans le privé
texte: 'Dans son plan budgétaire du 12 octobre 2026, il espère 4 Md€ d''économies sur les arrêts maladie, grâce à des réexamens
  périodiques et à la surveillance des médecins, qui concentreraient selon Public Sénat « un niveau de prescription préoccupant
  ». Il propose un jour de carence « d''ordre public » dans le privé, « que personne ne pourra racheter ». Il ne chiffre
  pas l''évolution des 280 Md€ de dépenses de santé : il parle d''une « hypothèse très conservatrice » où les économies
  seraient absorbées par le vieillissement, et affirme que les gains d''efficience doivent être réinvestis dans les soins.
  Il promet que « tous les Français, quel que soit leur niveau de vie, puissent avoir accès à ce qu''il se fait de mieux
  ».'
chiffres:
- libelle: Économies attendues sur les arrêts maladie, selon le candidat
  valeur: 4 Md€
