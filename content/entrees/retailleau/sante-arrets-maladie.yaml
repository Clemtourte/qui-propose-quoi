  mesure: 4 Md€ d'économies sur les arrêts maladie
  equivalent: environ 58 € par habitant, soit 0,13 % du PIB de 2025 ; 0,23 % des dépenses publiques de 2025
  calcul: '4 Md€ / 69,082 millions d''habitants = 58 € ; 4 / 2 990 Md€ de PIB = 0,13 % ; 4 / 1 714,2 Md€ de dépenses publiques
    = 0,23 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d''environ 2 990 Md€, déduit
    des chiffres de l''Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025
    : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Périodicité non précisée dans la source.'
