appui:
  faits: >-
    Max Brisson, sénateur qui a élaboré le projet avec lui : « Nous sommes le seul pays où le système est géré depuis un ministère omnipotent » ; « Les professeurs soit
    ne rentrent pas, soit s'en vont. » Le collège unique est présenté comme l'une des causes des difficultés scolaires et du décrochage (Public Sénat).
  raisonnement: >-
    « On assume le fait que tous les élèves ne progressent pas au même rythme » (Max Brisson). La rémunération n'est « qu'un facteur » d'attractivité, sans
    changement des carrières et des affectations. Il veut « arracher l'école à cette idéologie du pédagogisme qui a affaissé le niveau » (RTL, rapporté par Sud Radio).
  sources: [publicsenat-2026-08-31-retailleau-ecole, sudradio-2026-09-02-retailleau-internats]
