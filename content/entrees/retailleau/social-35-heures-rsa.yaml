titre: Fin des 35 heures par annualisation, brut égal net dès la 36e heure, revenu d'incitation à l'activité plafonné à
  70 % du Smic
texte: 'Le 7 janvier 2026, il présente les propositions de LR sur le travail (Public Sénat). Temps de travail : porter le
  seuil annuel de 1 607 à 1 623 heures (« c''est 4 min de plus par jour »), les heures au-delà de 1 607 heures étant à «
  zéro cotisation et zéro impôt » (hors CSG et CRDS) ; le 31 août 2026 il résume : « A partir de la 36e heure, ma solution,
  c''est le brut égale le net » (franceinfo). Minima : fusionner RSA, prime d''activité et allocation de solidarité spécifique
  (ASS) en un « revenu d''incitation à l''activité » avec 15 heures d''activité obligatoires et une baisse de 30 % de la
  prestation, et plafonner l''ensemble des aides à 70 % du Smic via un « compte social unique ». Assurance chômage : relancer
  la réforme de Gabriel Attal, supprimer des droits après un troisième refus d''offre, durcir la rupture conventionnelle
  (durée et plafond d''indemnisation). Selon l''article, le plan apporterait 2 % de croissance, 30 Md€ d''économies et 15
  Md€ de pouvoir d''achat (environ 500 € par mois et par salarié) : ces chiffres sont ceux de LR.'
