titre: Déduction des intérêts d'emprunt selon le nombre d'enfants, PTZ relancé, fin du ZAN et du DPE
texte: 'Le 15 septembre 2026, lors d''une conférence de presse au siège de LR, il propose de déduire de l''impôt les intérêts
  d''un prêt immobilier selon le nombre d''enfants : « 50 % de déduction d''intérêt d''emprunt lorsque vous avez un enfant
  », puis des taux plus élevés pour le deuxième et le troisième (Public Sénat rapporte 75 % puis 100 %), soit pour une famille
  de trois enfants « l''équivalent de 8 ans de mensualités qui seront rendues ». Il veut aussi relancer le prêt à taux zéro
  pour les primo-accédants, « lever les verrous normatifs » en supprimant le ZAN (zéro artificialisation nette) et le DPE
  (diagnostic de performance énergétique), transformer des bureaux vacants en logements et durcir la lutte contre les squats.
  Public Sénat relève que, contrairement à Marine Le Pen, il n''a pas promis la priorité nationale pour l''accès au logement
  social. Plafonds, coût et calendrier ne sont pas précisés dans l''article.'
