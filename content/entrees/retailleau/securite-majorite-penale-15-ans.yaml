titre: "Après le 17 octobre : majorité pénale à 15 ans, loi anticasseurs, déchéance de nationalité"
texte: >-
  Lors d'une conférence de presse le 19 octobre 2026, il propose « d'abaisser à quinze ans la majorité pénale pour les
  mineurs, pour les crimes et délits les plus graves », l'adoption d'une « loi anti-casseurs » et la déchéance de
  nationalité pour les binationaux « qui pillent, qui sont des violents, qui agressent les gendarmes ou des
  policiers ». Il réitère son appel à Emmanuel Macron à déclarer « l'état d'urgence ».
date: 2026-10-19
sources: [boursorama-2026-10-19-retailleau-violences, rmc-2026-10-20-bardella-majorite-penale]
