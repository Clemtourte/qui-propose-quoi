candidat: retailleau
theme: securite-justice
rubrique: mesure
nature: position
titre: "Après le 17 octobre : majorité pénale à 15 ans, loi anticasseurs, déchéance de nationalité"
texte: >-
  Lors d'une conférence de presse le 19 octobre 2026, il propose « d'abaisser à quinze ans la majorité pénale pour les
  mineurs, pour les crimes et délits les plus graves », l'adoption d'une « loi anti-casseurs » et la déchéance de
  nationalité pour les binationaux « qui pillent, qui sont des violents, qui agressent les gendarmes ou des
  policiers ». Il réitère son appel à Emmanuel Macron à déclarer « l'état d'urgence ».
date: 2026-10-19
sources: [boursorama-2026-10-19-retailleau-violences, rmc-2026-10-20-bardella-majorite-penale]
appui:
  faits: >-
    Aucun chiffre n'est cité dans les propos lus. Il vise « les crimes et délits les plus graves », après les exactions des
    17 et 18 octobre.
  sources: [boursorama-2026-10-19-retailleau-violences]
  donnees:
    - texte: >-
        Cour des comptes (2025), citée par l'Inspection générale de la justice : 146 mineurs de 15 à 17 ans condamnés pour crimes
        en 2012, 57 en 2023. La protection judiciaire de la jeunesse signale toutefois une hausse récente des incarcérations
        pour des faits d'une extrême violence. L'Inspection juge l'évolution difficile à apprécier.
      sources: [justice-2025-07-mission-delinquance-mineurs]
