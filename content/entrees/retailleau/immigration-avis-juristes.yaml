auteur: Marie-Anne Cohendet, professeure de droit constitutionnel (Paris 1 Panthéon-Sorbonne)
titre: Une constitutionnaliste juge « extrêmement dangereux » un recours à l'article 11 pour réviser la Constitution
citation:
  texte: En l'état actuel, ce projet est extrêmement dangereux.
  date: 2026-02-13
  contexte: Propos à Public Sénat, sur l'hypothèse d'une révision de la Constitution par l'article 11
texte: >-
  Elle estime que le recours à l'article 11 pour réviser la Constitution est une violation de celle-ci. Dans le même
  article, Benjamin Morel, maître de conférences en droit public (Panthéon-Assas), juge une révision envisageable au
  Parlement si la droite et le RN y sont majoritaires, chaque groupe pouvant poser ses conditions ; Mathieu Carpentier,
  professeur de droit public (Toulouse Capitole), estime que laisser au Parlement le soin de déterminer les intérêts
  fondamentaux placerait la France dans une situation très compliquée vis-à-vis de ses partenaires européens.
date: 2026-02-13
