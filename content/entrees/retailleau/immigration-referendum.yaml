candidat: retailleau
theme: immigration
rubrique: mesure
aussi_participation: true
nature: position
titre: Référendum sur l'immigration et primauté du droit national
citation:
  texte: Je veux changer la Constitution pour redonner la parole au peuple
  date: 2026-02-12
  contexte: Journal de 20 heures de TF1, le soir de l'annonce de sa candidature, rapporté par Public Sénat
texte: >-
  Il veut soumettre plusieurs textes directement par référendum pour « réduire drastiquement l'immigration » et
  « redonner la primauté à notre droit national ». Selon Public Sénat, l'article 11 de la Constitution ne permet pas
  aujourd'hui un référendum sur l'immigration : le projet suppose une révision de la Constitution. Son plan budgétaire
  chiffre à 4,5 Md€ deux mesures qui en dépendent : cinq ans de séjour et de travail pour accéder aux prestations non
  contributives, et l'examen des demandes d'asile hors des frontières.
reperes:
- mesure: >-
    4,5 Md€ d'économies sur deux mesures dépendant du référendum, selon son plan
  equivalent: >-
    environ 65 € par habitant, soit 0,15 % du PIB de 2025 ; 0,26 % des dépenses publiques de 2025
  calcul: >-
    4,5 Md€ / 69,082 millions d'habitants = 65 € ; 4,5 / 2990 Md€ de PIB = 0,15 % ; 4,5 / 1 714,2 Md€ de dépenses publiques = 0,26 %. Bases : population au 1er janvier 2026 (69,1 millions, provisoire) ; PIB 2025 d'environ 2 990 Md€, déduit des chiffres de l'Insee (dette publique de 3 460,5 Md€ = 115,7 % du PIB) ; dépenses des administrations publiques 2025 : 1 714,2 Md€ (Insee). Rapporté aux niveaux de 2025, sans actualisation. Périodicité non précisée dans la source.
  sources:
  - insee-2026-05-29-comptes-apu-2025
  - insee-2026-01-13-bilan-demographique-2025
date: 2026-02-12
sources: [publicsenat-2026-02-13-retailleau-referendum, publicsenat-2026-10-12-retailleau-economies]
appui:
  faits: >-
    Son plan, cité par Public Sénat, attend 10 Md€ d'économies sur l'immigration, dont 4,5 Md€ de deux mesures qui dépendent
    de la révision constitutionnelle. Le document du plan n'a pas été trouvé.
  raisonnement: >-
    Il veut « réduire drastiquement l'immigration » et « redonner la primauté à notre droit national », en soumettant
    directement plusieurs textes au référendum.
  sources: [publicsenat-2026-02-13-retailleau-referendum, publicsenat-2026-10-12-retailleau-economies]
  donnees:
    - texte: >-
        Conseil constitutionnel (11 avril 2024) : une condition de cinq ans de résidence ou de trente mois d'activité pour
        des prestations sociales porte « une atteinte disproportionnée » aux exigences constitutionnelles. Le texte alors
        examiné était une proposition de loi, sans révision de la Constitution.
      sources: [conseil-constitutionnel-2024-04-11-2024-6-rip]
    - texte: >-
        Direction générale des étrangers en France (2025, provisoire) : 90 959 premiers titres pour motif familial et 116 835
        pour études, sur 377 462.
      sources: [dgef-2026-06-30-titres-sejour-2025]
