titre: 'Premier déplacement international de campagne à Kyiv : « Je refuserai toujours une politique qui laisserait penser
  [...] que l''agression peut payer »'
texte: 'Le 20 mai 2026, depuis Kyiv, Bruno Retailleau écrit sur X qu''il a « choisi de réserver mon premier déplacement
  international de campagne à l''Ukraine » et que cette guerre « n''est pas un conflit régional lointain : c''est le symptôme
  de la nouvelle donne stratégique qui s''impose à toute l''Europe ». Il estime que le peuple ukrainien « combat pour sa
  souveraineté et sa liberté » et ajoute : « Je refuserai toujours une politique qui laisserait penser que le crime peut
  être récompensé, que l''agression peut payer, que les frontières ne valent rien, que la mémoire peut être verrouillée
  ». Le 7 septembre 2026, Ouest-France rapporte qu''il taxe Jordan Bardella d''« amateur » en politique internationale,
  après les propos du RN sur la fin de l''aide. Aucun montant d''aide, aucune position sur les sanctions, les avoirs russes
  ou l''adhésion à l''UE ou à l''OTAN n''a été trouvé.'
