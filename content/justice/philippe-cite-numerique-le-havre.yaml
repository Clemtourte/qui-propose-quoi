candidat: philippe
affaire: Cité numérique du Havre
role: >-
  Témoin assisté depuis le 29 octobre 2026, statut moins incriminant qu'une mise en examen et modifiable au cours de
  l'enquête (AFP) ; aucune mise en examen rapportée.
faits: >-
  Soupçons notamment de détournement de fonds publics et de favoritisme, ainsi que de prise illégale d'intérêts et de
  concussion selon le PNF (mai 2026), et de harcèlement moral selon l'AFP (octobre 2026), au sein de la communauté
  urbaine du Havre. La plainte vise une convention signée en juillet 2020 avec l'association LH French Tech, présidée
  par une adjointe au maire, seule candidate, qui devait toucher 2,154 millions d'euros de compensation de service
  public (AFP) et a perçu plus d'un million d'euros de subventions en deux ans (France 3). Les faits ont été signalés
  par une ancienne directrice générale adjointe de la communauté urbaine, qui a obtenu le statut de lanceuse d'alerte
  en janvier 2025. Il conteste les faits.
stade: enquete
definitive: false
etapes:
- date: '2024-04-03'
  stade: enquete
  juridiction: Parquet national financier
  decision: >-
    Ouverture d'une enquête préliminaire visant le maire du Havre et une élue ; perquisitions en avril 2024.
- date: '2026-05-19'
  stade: enquete
  juridiction: Parquet national financier
  decision: Annonce de l'ouverture d'une information judiciaire, confiée à un juge d'instruction.
- date: '2026-10-29'
  stade: enquete
  juridiction: Juges d'instruction financiers, Paris
  decision: >-
    Entendu toute la journée par deux juges, qui l'avaient convoqué comme témoin assisté, et placé sous ce statut.
    Son avocat : il « se félicite de cette décision favorable qui confirme qu'il n'y a rien à lui reprocher ». L'avocat
    de la plaignante : « Nous nous réjouissons que l'instruction suive son cours ».
prochaine_etape: Instruction en cours ; le statut peut être modifié si des éléments nouveaux apparaissent.
