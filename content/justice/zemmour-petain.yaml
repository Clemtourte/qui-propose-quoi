candidat: zemmour
affaire: Propos sur Pétain (CNews, 2019)
role: Prévenu ; relaxé deux fois, puis condamné en appel après cassation.
faits: >-
  Propos tenus le 21 octobre 2019 sur CNews face à Bernard-Henri Lévy, sur le rôle de Pétain envers les juifs français.
  Poursuites pour contestation de crime contre l'humanité.
stade: cassation
