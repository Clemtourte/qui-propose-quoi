candidat: le-pen
affaire: Injure publique envers une ancienne étudiante
faits: >-
  Message publié en mars 2019 sur Twitter en commentaire de la photo d'une ancienne étudiante voilée de l'IEP de
  Bordeaux : « Pour nous, la promotion de l'islam radical c'est NON !! ». Poursuites pour injure publique en raison
  de la religion, à la suite de la plainte de l'intéressée.
stade: relaxe
definitive: non_documente
etapes:
- date: '2026-01-20'
  stade: relaxe
  juridiction: Tribunal correctionnel de Paris (17e chambre)
  decision: >-
    Relaxe. Le tribunal juge qu'associer une personne à la pratique rigoriste d'une religion ne revêt pas un caractère
    injurieux.
prochaine_etape: La plaignante pouvait faire appel ; suite non documentée.
sources:
