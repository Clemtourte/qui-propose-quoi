candidat: le-pen
affaire: Financement de la campagne présidentielle de 2022
role: >-
  Candidate dont la campagne est visée. Aucune mise en examen rapportée ; selon son avocat (juillet 2024), elle
  n'avait jamais été entendue.
concerne: campagne
faits: >-
  Information judiciaire ouverte à la suite d'un signalement de la Commission nationale des comptes de campagne.
  Selon le parquet de Paris (juillet 2025), elle porte sur des soupçons de financement illégal de la campagne présidentielle
  de 2022, des législatives qui ont suivi et des européennes de 2024 : prêts de particuliers au parti ou à ses candidats,
  surfacturations ou prestations fictives intégrées aux demandes de remboursement par l'État. Chefs visés à l'ouverture
  : prêt d'une personne morale à un candidat, acceptation de ce prêt par un candidat, détournement de biens publics,
  escroquerie au préjudice d'une personne publique, faux et usage de faux.
stade: enquete
definitive: false
etapes:
- date: '2024-07-02'
  stade: enquete
  juridiction: Parquet de Paris
  decision: Ouverture d'une information judiciaire, confiée à un juge d'instruction.
- date: '2025-07-09'
  stade: enquete
  juridiction: Juges d'instruction (Paris)
  decision: Perquisitions au siège du Rassemblement national, dans des sociétés et au domicile de leurs dirigeants.
prochaine_etape: Suite de l'instruction non documentée depuis juillet 2025.
