candidat: zemmour
affaire: Propos sur les mineurs isolés (CNews, 2020)
role: >-
  Poursuivi comme complice, le directeur de la publication de CNews étant l'auteur principal ; condamné.
faits: >-
  Propos tenus en septembre 2020 dans l'émission « Face à l'info » : « ils sont voleurs, ils sont assassins, ils
  sont violeurs, c'est tout ce qu'ils sont ». Poursuivi comme complice, le directeur de la publication de CNews
  étant poursuivi comme auteur principal.
stade: definitive
definitive: true
