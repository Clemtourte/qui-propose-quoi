prenom: Marine
nom: Le Pen
parti: Rassemblement national
fiche: complete
fonction: Présidente du groupe RN à l'Assemblée nationale
candidature:
  texte: >-
    Candidature annoncée le 7 juillet 2026 au journal de 20 heures de TF1, le jour où la cour d'appel de Paris
    a rendu son arrêt dans l'affaire des assistants parlementaires européens du FN. Le même soir, elle annonce
    vouloir saisir la Cour de cassation.
  date: 2026-07-07
  sources: [euronews-2026-07-07-le-pen-candidature, publicsenat-2026-07-07-le-pen-appel]
en_30_secondes:
  parcours: >-
    Présidente du groupe Rassemblement national à l'Assemblée nationale. Candidate pour la quatrième fois : en 2017
    et en 2022, elle est battue au second tour par Emmanuel Macron (41,45 % des suffrages exprimés en 2022).
  sources:
  - franceinfo-2026-10-08-portraits-candidats
  - conseil-constitutionnel-2022-04-27-second-tour
recherches:
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Pas encore rédigée. Programme complet non publié au 19 octobre 2026 ; présentation détaillée de la réforme des
    retraites annoncée pour le 17 novembre 2026.
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 dans la presse : procédures pénales visant
    personnellement le candidat, en cours ou ayant donné lieu à une décision depuis 2017. Ne sont pas retenues
    les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou victime, ni
    les procédures civiles.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
derniere_verification: 2026-10-20
