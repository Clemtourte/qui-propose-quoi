prenom: Éric
nom: Zemmour
parti: Reconquête
fiche: complete
fonction: Président de Reconquête
candidature:
  texte: "Candidature confirmée le 17 septembre 2026 sur BFMTV ; la déclaration officielle de candidature est annoncée pour l'automne."
  date: 2026-09-17
  sources: [lcp-2026-09-17-zemmour-candidature, europe1-2026-09-18-zemmour-immigration]
en_30_secondes:
  parcours: >-
    Ancien éditorialiste et chroniqueur de télévision, notamment sur CNews. Il lance son parti, Reconquête, le 5
    décembre 2021, lors de sa première campagne présidentielle. Au premier tour de 2022, il obtient 7,07 % des suffrages
    exprimés.
  sources:
  - franceinfo-2021-12-06-zemmour-reconquete
  - conseil-constitutionnel-2022-04-13-premier-tour
  - franceinfo-2025-04-02-zemmour-petain
  - franceinfo-2025-12-02-zemmour-mineurs
vision:
- titre: Priorités annoncées
  nature: position
  texte: 'Discours du 13 septembre 2026 : il appelle à un « vote du sursaut et de la résurrection », présente l''intelligence
    artificielle comme « la troisième grande révolution industrielle de l''histoire de l''Occident » et veut relancer le
    nucléaire (six EPR d''ici à 2035, quatorze d''ici à 2045). Sur l''immigration : « Il faut la remigration », et « Des
    robots à la place des immigrés » (BFMTV, 17 septembre).'
  date: 2026-09-17
  sources:
  - europe1-2026-09-13-zemmour-rentree
  - publicsenat-2026-09-18-zemmour-candidature
- titre: Financement et arbitrages
  nature: position
  texte: Aucun budget présenté par le candidat n'a été trouvé. Il veut mobiliser « l'épargne des Européens et des Français
    » pour l'intelligence artificielle. Pour Reconquête, Sarah Knafo, députée européenne non candidate, propose de ne pas
    remplacer 800 000 postes de la fonction publique (40 milliards par an), de supprimer l'aide publique au développement
    (14 milliards) et de réserver les prestations non contributives aux Français (jusqu'à 20 milliards), sans hausse d'impôt.
    Son livre chiffre les économies à 130 milliards d'euros par an (L'Essentiel de l'Éco) ; le journaliste de France 2 parlait
    de 140.
  date: 2026-09-18
  sources:
  - europe1-2026-09-13-zemmour-rentree
  - franceinfo-2026-09-18-knafo-budget
  - lessentieldeleco-2026-09-20-knafo
- titre: Ce qui est contesté
  nature: jugement
  auteur: franceinfo (Vrai ou faux) ; Antoine Bozio, économiste (IPP)
  texte: 'Sur le livre de Sarah Knafo, franceinfo juge que le « casse du siècle » « apparaît surtout comme une construction
    destinée à soutenir ses convictions politiques ». Antoine Bozio rappelle que les cotisations employeur financent retraite,
    chômage et assurance maladie : « A priori, il n''y a aucun préjudice, sauf si on pense qu''une autre organisation permettrait
    de payer moins cher pour les mêmes services ».'
  date: 2026-09-08
  sources:
  - franceinfo-2026-09-08-vof-knafo-casse-du-siecle
- titre: Ce qui est contesté
  nature: jugement
  auteur: L'Essentiel de l'Éco (Etienne Delattes) ; François Ecalle, économiste
  texte: 'Sur les 800 000 postes à ne pas remplacer : « Le moyen annoncé ne suffit pas à atteindre la cible. » L''article
    cite François Ecalle, qui estime qu''une réduction de cette ampleur dégagerait de 30 à 40 milliards d''euros d''économies
    annuelles à terme, à supposer les suppressions réalisées.'
  date: '2026-09-20'
  sources:
  - lessentieldeleco-2026-09-20-knafo
- titre: Où en est le programme
  nature: fait
  texte: Au 30 octobre 2026, aucun programme 2027 ni chiffrage trouvés. Sa déclaration de candidature officielle était annoncée
    pour l'automne, « probablement en octobre » (Public Sénat, 18 septembre). L'Institut Montaigne annonce pour le premier
    trimestre 2027 « l'analyse et le chiffrage des programmes des candidats ».
  date: 2026-10-30
  sources:
  - publicsenat-2026-09-18-zemmour-candidature
  - institutmontaigne-2026-10-06-reperes
recherches:
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Recherché le 30 octobre 2026 (site de campagne quand il existe, articles lus en entier) : priorités annoncées, financement d'ensemble et arbitrages, critiques nommées portant sur la cohérence ou le financement du projet. Même grille pour les huit candidats. Le détail et les sources de chaque mesure sont dans les thèmes. Aucun programme 2027 d'Éric Zemmour trouvé. Son programme de 2022 n'est pas repris ici ; les positions budgétaires citées sont celles de Sarah Knafo.
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 dans la presse : procédures pénales visant personnellement le candidat, en
    cours ou ayant donné lieu à une décision depuis 2017. Les enquêtes pénales sur ses propres campagnes
    électorales, dans lesquelles il n'est pas mis en cause personnellement, sont présentées à part. Ne sont
    pas retenues les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou
    victime, ni les procédures civiles.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  declarations: >-
    Recherché le 29 octobre 2026 (moteur de recherche, puis lecture des articles, dont certains dans le navigateur intégré) : déclarations du candidat du 1er septembre au 29 octobre 2026 ayant suscité au moins une réaction nommée dans la presse, avec ces réactions. Les positions déjà saisies dans les thèmes ne sont pas répétées. Les réactions anonymes (« entourage ») ne sont pas reprises. Pistes repérées, non lues : déprogrammation de BFMTV et message sur la « censure » (24 octobre), échange avec Karim Zéribi (28 octobre), saisine du procureur par Sabrina Sebaihi (article 40).
  bilan: >-
    Recherché le 19 octobre 2026 : aucun vote ni acte public sur les réformes des retraites de 2023 et 2025 trouvé.
    Fiscalité et immigration pas encore recherchées.
    Sécurité et justice, recherché le 21 octobre 2026 : aucun mandat électif ni fonction gouvernementale,
    donc aucun vote ni acte public à documenter.
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
