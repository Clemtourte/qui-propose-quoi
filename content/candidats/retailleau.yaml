prenom: Bruno
nom: Retailleau
parti: Les Républicains
fiche: complete
fonction: Président des Républicains, ancien ministre de l'Intérieur
candidature:
  texte: >-
    Désigné candidat le 19 avril 2026 par un vote des adhérents LR : 73,8 % des votants ont choisi la désignation
    directe du président du parti, avec une participation d'environ 60 %.
  date: 2026-04-19
  sources: [publicsenat-2026-04-19-retailleau-designation]
en_30_secondes:
  parcours: >-
    Président des Républicains depuis 2025, après une élection interne face à Laurent Wauquiez. Ministre de l'Intérieur
    dans les gouvernements de Michel Barnier, François Bayrou et Sébastien Lecornu.
  sources:
  - franceinfo-2026-10-08-portraits-candidats
vision:
- titre: Priorités annoncées
  nature: position
  texte: Il veut « rétablir l'ordre dans les comptes publics », s'attaquer au « système social-étatiste » et « revaloriser
    le travail », avec « une société du travail gagnant » pour « la France des honnêtes gens ». Il prévoit une révision
    constitutionnelle soumise à référendum à la rentrée 2027. Sur la natalité, il veut sortir de « l'hiver démographique
    ».
  date: 2026-10-12
  sources:
  - lcp-2026-10-12-retailleau-plan-economies
  - publicsenat-2026-10-12-retailleau-economies
  - publicsenat-2026-09-03-retailleau-constitution
  - publicsenat-2026-10-09-politique-familiale
- titre: Financement et arbitrages
  nature: position
  texte: 'Présenté le 12 octobre 2026 : 197 milliards d''euros d''effort sur cinq ans (96 sur l''État, 91 sur la sphère
    sociale, 10 sur les collectivités), un excédent primaire en 2030, un déficit sous 3 % du PIB en 2031 et à 2,2 % en 2032.
    146 milliards iraient à la réduction de la dépense et de la dette ; il veut « rendre aux Français » les 51 autres :
    30 aux entreprises, 21 aux ménages (LCP ; Public Sénat écrit 56 au total). Il prévoit 400 000 agents publics non remplacés
    (25 milliards), 42 milliards sur les retraites et « pas d''impôt nouveau ». Son « revenu familial » de 240 euros par
    mois dès le premier enfant coûterait 40,3 milliards, compensés par 41 milliards d''économies, dont la suppression des
    allocations familiales (Public Sénat). Sur son plan : « c''est documenté, c''est sérieux ! »'
  date: 2026-10-12
  sources:
  - lcp-2026-10-12-retailleau-plan-economies
  - publicsenat-2026-10-12-retailleau-economies
  - publicsenat-2026-10-09-politique-familiale
- titre: Ce qui est contesté
  nature: jugement
  auteur: Public Sénat (Guillaume Jacquot)
  texte: 'Sur les opérateurs de l''État, l''article relève que les 7,5 milliards attendus sont « nettement » au-dessus du
    « demi-milliard » identifié en 2025 par la commission d''enquête de Christine Lavarde (LR) sur le fonctionnement : ce
    montant « implique donc une réduction des politiques publiques et des subventions ». Sur les 10 milliards liés à l''immigration
    : « Une très grande partie des économies prévues est toutefois conditionnée au succès de la révision constitutionnelle
    ».'
  date: 2026-10-12
  sources:
  - publicsenat-2026-10-12-retailleau-economies
- titre: Ce qui est contesté
  nature: jugement
  auteur: Marie-Anne Cohendet, professeure de droit constitutionnel (Paris 1 Panthéon-Sorbonne), à Public Sénat
  texte: 'Sur le recours à l''article 11 pour réviser la Constitution, envisagé en février 2026 : « En l''état actuel, ce
    projet est extrêmement dangereux. »'
  date: 2026-02-13
  sources:
  - publicsenat-2026-02-13-retailleau-referendum
- titre: Où en est le programme
  nature: fait
  texte: Au 30 octobre 2026, aucune analyse d'un économiste nommé ni réponse d'un adversaire politique au fond de ce plan
    n'a été trouvée. L'Institut Montaigne annonce pour le premier trimestre 2027 « l'analyse et le chiffrage des programmes
    des candidats ».
  date: 2026-10-30
  sources:
  - publicsenat-2026-10-12-retailleau-economies
  - institutmontaigne-2026-10-06-reperes
recherches:
  discriminations: >-
    Même recherche pour les 8 candidats, le 1er novembre 2026, en un passage : moteur de recherche et articles lus. Périmètre : le candidat, les dirigeants nationaux et les parlementaires de son parti, ses proches collaborateurs. Retenus : condamnations pour racisme, antisémitisme ou discrimination, avec leur stade ; sanctions parlementaires ; propos cités mot pour mot ; parcours établi par la presse, avec la réponse de la personne. Les élus locaux sont hors périmètre. Liste non exhaustive.
  declarations: >-
    Recherché le 29 octobre 2026 (moteur de recherche, puis lecture des articles, dont certains dans le navigateur intégré) : déclarations du candidat du 1er septembre au 29 octobre 2026 ayant suscité au moins une réaction nommée dans la presse, avec ces réactions. Les positions déjà saisies dans les thèmes ne sont pas répétées. Les réactions anonymes (« entourage ») ne sont pas reprises. Les autres entrées de cette section viennent des passes sur les thèmes. Piste non lue : son échange avec une lycéenne sur LCI (22 octobre), une seule source, sans réaction nommée trouvée.
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Recherché le 30 octobre 2026 (site de campagne quand il existe, articles lus en entier) : priorités annoncées, financement d'ensemble et arbitrages, critiques nommées portant sur la cohérence ou le financement du projet. Même grille pour les huit candidats. Le détail et les sources de chaque mesure sont dans les thèmes. Le document du plan n'a pas été lu ; les chiffres viennent de LCP et de Public Sénat, qui divergent sur un montant.
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 dans la presse : procédures pénales visant personnellement le candidat, en
    cours ou ayant donné lieu à une décision depuis 2017. Les enquêtes pénales sur ses propres campagnes
    électorales, dans lesquelles il n'est pas mis en cause personnellement, sont présentées à part. Ne sont
    pas retenues les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou
    victime, ni les procédures civiles. Aucune procédure correspondante trouvée.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
derniere_verification: 2026-10-30
absences:
  transparence-probite:
    statut: non_trouve
    note: "Recherché le 22 octobre 2026 (presse, sites officiels) : aucune proposition ni déclaration personnelle sur l'inéligibilité, le contrôle de la vie publique ou le lobbying trouvée dans les sources lues."
