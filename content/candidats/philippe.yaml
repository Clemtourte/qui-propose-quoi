prenom: Édouard
nom: Philippe
parti: Horizons
fiche: complete
fonction: Président d'Horizons, ancien Premier ministre
candidature:
  texte: >-
    Candidature annoncée dans un entretien au Point, rapporté par l'AFP le 4 septembre 2024.
  date: 2024-09
  sources: [thelocal-2024-09-04-philippe-candidature]
en_30_secondes:
  parcours: >-
    Premier ministre d'Emmanuel Macron de 2017 à 2020 et maire du Havre, il fonde en 2021 Horizons, parti qu'il
    situe au centre droit. Il se présente pour la première fois à l'élection présidentielle.
  sources:
  - franceinfo-2026-10-08-portraits-candidats
recherches:
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Pas encore rédigée. Priorités publiées sur son site de campagne (consulté le 19 octobre 2026), sans document de
    chiffrage d'ensemble trouvé.
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 et mis à jour le 30 octobre pour la Cité numérique du Havre, dans la presse : procédures pénales visant personnellement le candidat, en
    cours ou ayant donné lieu à une décision depuis 2017. Les enquêtes pénales sur ses propres campagnes
    électorales, dans lesquelles il n'est pas mis en cause personnellement, sont présentées à part. Ne sont
    pas retenues les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou
    victime, ni les procédures civiles.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  declarations: >-
    Recherché le 29 octobre 2026 (moteur de recherche, puis lecture des articles, dont certains dans le navigateur intégré) : déclarations du candidat du 1er septembre au 29 octobre 2026 ayant suscité au moins une réaction nommée dans la presse, avec ces réactions. Les positions déjà saisies dans les thèmes ne sont pas répétées. Les réactions anonymes (« entourage ») ne sont pas reprises. Les autres entrées de cette section viennent des passes sur les thèmes. Piste non lue : la polémique de septembre 2026 sur des « vacances » une fois élu, qu'il dit montée « à partir de phrases tronquées » (franceinfo).
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
derniere_verification: 2026-10-30
