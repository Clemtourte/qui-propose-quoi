prenom: Édouard
nom: Philippe
parti: Horizons
fiche: complete
fonction: Président d'Horizons, ancien Premier ministre
candidature:
  texte: >-
    Candidature annoncée dans un entretien au Point, rapporté par l'AFP le 4 septembre 2024.
  date: 2024-09
  sources: [thelocal-2024-09-04-philippe-candidature]
en_30_secondes:
  parcours: >-
    Premier ministre d'Emmanuel Macron de 2017 à 2020 et maire du Havre, il fonde en 2021 Horizons, parti qu'il
    situe au centre droit. Il se présente pour la première fois à l'élection présidentielle.
  sources:
  - franceinfo-2026-10-08-portraits-candidats
vision:
- titre: Priorités annoncées
  nature: position
  texte: 'Son site organise le projet en quatre priorités : une France « plus prospère », « plus sûre », « plus attentive
    à ses enfants » et « plus conquérante ». Sur la méthode, il prévoit une vingtaine d''ordonnances lors d''une session
    extraordinaire en juillet 2027. Il prévoit aussi un référendum sur la règle d''or et n''exclut pas un référendum sur
    l''immigration s''il faut modifier la Constitution.'
  date: 2026-10-08
  sources:
  - edouardphilippe-2026-france-plus-prospere
  - edouardphilippe-2026-france-plus-sure
  - edouardphilippe-2026-france-attentive-enfants
  - edouardphilippe-2026-france-plus-conquerante
  - franceinfo-2026-10-08-philippe-heure-verite
- titre: Financement et arbitrages
  nature: position
  texte: Déficit ramené de plus de 5 % à 2 % du PIB à la fin du quinquennat, avec « 50 % de l'effort sur les dépenses sociales
    et un quart sur l'État et les collectivités et un quart grâce à la croissance » ; le montant total n'est pas indiqué.
    Fonction publique : « Supprimer un tiers des fonctionnaires partant à la retraite, soit plus de 250 000 postes ». Retraites à 65 ans et
    45 annuités « sans hausse des cotisations ni baisse générale des pensions ». Dépenses de santé stabilisées. 50 milliards
    de baisse d'impôts de production contre 50 milliards d'« aides publiques improductives » en moins, et aucun nouvel impôt.
  date: 2026-10-08
  sources:
  - edouardphilippe-2026-france-plus-prospere
- titre: Ce qui est contesté
  nature: jugement
  auteur: Bruno Retailleau, candidat (LR) ; Sophie Binet, secrétaire générale de la CGT
  texte: 'Bruno Retailleau, visant Édouard Philippe et Gabriel Attal : « Ceux qui ont allumé la mèche ne peuvent prétendre
    l''éteindre. » Sophie Binet, sur la retraite à 65 ans : « Il faut arrêter de se moquer du monde. »'
  date: 2026-10-12
  sources:
  - publicsenat-2026-10-12-retailleau-economies
  - franceinfo-2026-09-30-philippe-65-ans
- titre: Où en est le programme
  nature: fait
  texte: Au 30 octobre 2026, aucun document de chiffrage d'ensemble trouvé, ni d'analyse d'un économiste nommé sur ce plan.
    Les articles lus n'indiquent ni le coût ni le financement de l'allocation familiale unique de 350 euros et de la réduction
    d'impôt d'environ 3 000 euros annoncées le 8 octobre. L'Institut Montaigne annonce pour le premier trimestre 2027 «
    l'analyse et le chiffrage des programmes des candidats ».
  date: 2026-10-30
  sources:
  - edouardphilippe-2026-france-plus-prospere
  - franceinfo-2026-10-08-philippe-allocation-familiale
  - publicsenat-2026-10-09-politique-familiale
  - institutmontaigne-2026-10-06-reperes
recherches:
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Recherché le 30 octobre 2026 (site de campagne quand il existe, articles lus en entier) : priorités annoncées, financement d'ensemble et arbitrages, critiques nommées portant sur la cohérence ou le financement du projet. Même grille pour les huit candidats. Le détail et les sources de chaque mesure sont dans les thèmes. Les trois autres pages de priorités de son site ont été lues lors des passes sur les thèmes (octobre 2026).
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 et mis à jour le 30 octobre pour la Cité numérique du Havre, dans la presse : procédures pénales visant personnellement le candidat, en
    cours ou ayant donné lieu à une décision depuis 2017. Les enquêtes pénales sur ses propres campagnes
    électorales, dans lesquelles il n'est pas mis en cause personnellement, sont présentées à part. Ne sont
    pas retenues les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou
    victime, ni les procédures civiles.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  declarations: >-
    Recherché le 29 octobre 2026 (moteur de recherche, puis lecture des articles, dont certains dans le navigateur intégré) : déclarations du candidat du 1er septembre au 29 octobre 2026 ayant suscité au moins une réaction nommée dans la presse, avec ces réactions. Les positions déjà saisies dans les thèmes ne sont pas répétées. Les réactions anonymes (« entourage ») ne sont pas reprises. Les autres entrées de cette section viennent des passes sur les thèmes. Piste non lue : la polémique de septembre 2026 sur des « vacances » une fois élu, qu'il dit montée « à partir de phrases tronquées » (franceinfo).
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
derniere_verification: 2026-10-30
