prenom: Gabriel
nom: Attal
parti: Renaissance
fiche: complete
fonction: Secrétaire général de Renaissance, chef de file des députés Ensemble pour la République, ancien Premier ministre
candidature:
  texte: Candidature annoncée le 22 mai 2026 à Mur-de-Barrez (Aveyron).
  date: 2026-05-22
  sources: [lcp-2026-05-22-attal-candidature]
en_30_secondes:
  parcours: >-
    Premier ministre de janvier à septembre 2024, plusieurs fois ministre depuis 2017. Président du groupe Ensemble
    pour la République à l'Assemblée nationale et secrétaire général de Renaissance depuis décembre 2024. Il se
    présente pour la première fois à l'élection présidentielle.
  sources:
  - franceinfo-2026-10-08-portraits-candidats
  - touteleurope-2026-10-14-candidats
vision:
- titre: Priorités annoncées
  nature: position
  texte: 'Son site organise le projet en quatre « chantiers capitaux » (école, travail et salaires, frontières, intelligence
    artificielle) et deux « dettes à résorber » (dette de l''État, dette écologique). Sur l''école : « L''éducation est
    la mère des batailles. Elle sera ma priorité absolue. » La page sur la dette donne une liste pour le budget : « Trois
    priorités claires seront fixées : l''éducation, l''écologie et la défense. » Le 23 septembre 2026, il présente deux
    dépendances à réduire, à la dette et aux énergies fossiles.'
  date: 2026-09-23
  sources:
  - attalpresident-2026-chantiers-capitaux
  - attalpresident-2026-dette-etat
  - attalpresident-2026-09-23-plan-desendettement
- titre: Financement et arbitrages
  nature: position
  texte: 'Objectif : 150 milliards d''euros d''économies, dont les deux tiers sur les dépenses sociales, un déficit sous
    3 % du PIB avant la fin du mandat, les comptes sociaux à l''équilibre en 2032 et l''ensemble des finances publiques
    à l''équilibre en 2037. En juillet, il parlait de 120 à 150 milliards sur dix ans (Public Sénat). Il prévoit 100 000
    postes d''État en moins en préservant l''Éducation nationale, les Armées, la Justice et l''Intérieur. Il écrit : « Toutes
    les propositions que nous formulerons durant la campagne seront financées. » Son site indique qu''il a réuni sept économistes
    le 23 septembre, dont Olivier Blanchard et Laurence Boone, « pour faire le point sur la situation économique et géopolitique
    ».'
  date: 2026-09-23
  sources:
  - attalpresident-2026-09-23-plan-desendettement
  - attalpresident-2026-dette-etat
  - publicsenat-2026-07-03-attal-fonctionnaires
- titre: Ce qui est contesté
  nature: jugement
  auteur: Bruno Retailleau, candidat (LR), conférence de presse du 12 octobre 2026
  texte: 'Visant Gabriel Attal et Édouard Philippe : « Ceux qui ont allumé la mèche ne peuvent prétendre l''éteindre. »
    Il juge que les « coresponsables de ce bilan » n''ont pas « la moindre légitimité ».'
  date: 2026-10-12
  sources:
  - publicsenat-2026-10-12-retailleau-economies
  - lcp-2026-10-12-retailleau-plan-economies
- titre: Ce qui est contesté
  nature: jugement
  auteur: Public Sénat (Guillaume Jacquot)
  texte: 'L''article parle d''un « virage à 180 degrés » : ministre des Comptes publics en 2022, Gabriel Attal jugeait «
    pas crédible » de « supprimer 125 000 postes de fonctionnaires sans préciser ». Il relève que les ministères préservés
    concentrent plus des deux tiers des effectifs de l''État et que « l''effort pourrait ne concerner que les 800 000 agents
    des autres ministères et établissements publics ».'
  date: 2026-07-03
  sources:
  - publicsenat-2026-07-03-attal-fonctionnaires
- titre: Ce qui est contesté
  nature: jugement
  auteur: Édouard Philippe, candidat (Horizons), vidéo du 29 septembre 2026
  texte: 'Sur la suppression de l''âge légal, sans nommer Gabriel Attal : un système « financièrement intenable » et « socialement
    incroyablement injuste ».'
  date: '2026-09-29'
  sources:
  - lcp-2026-09-29-philippe-retraites
- titre: Où en est le programme
  nature: fait
  texte: Au 30 octobre 2026, son site liste 96 « premières mesures ». Aucun document de chiffrage d'ensemble n'a été trouvé,
    ni d'analyse d'un économiste nommé sur ce plan. L'Institut Montaigne annonce pour le premier trimestre 2027 « l'analyse
    et le chiffrage des programmes des candidats ».
  date: 2026-10-30
  sources:
  - attalpresident-2026-chantiers-capitaux
  - institutmontaigne-2026-10-06-reperes
recherches:
  en_30_secondes: >-
    Parcours recherché le 20 octobre 2026. Propositions principales : programme complet pas encore publié ou
    pas encore traité ; la fiche reprend ses positions sur les thèmes déjà couverts.
  vision: >-
    Recherché le 30 octobre 2026 (site de campagne quand il existe, articles lus en entier) : priorités annoncées, financement d'ensemble et arbitrages, critiques nommées portant sur la cohérence ou le financement du projet. Même grille pour les huit candidats. Le détail et les sources de chaque mesure sont dans les thèmes. Les 96 mesures listées sur son site n'ont pas été lues une à une.
  avis: >-
    Recherché le 19 octobre 2026 pour les retraites, la fiscalité et le budget, l'immigration : aucun avis
    d'institution sur son projet 2027 trouvé. Autres thèmes pas encore recherchés.
  verifications: >-
    Recherché le 20 octobre 2026 en parcourant toutes les publications des rubriques « Vrai ou faux » et
    « Le vrai du faux » de franceinfo depuis mai 2026, pour les retraites, la fiscalité et le budget, l'immigration.
    Retenues : les vérifications d'une affirmation du candidat ou d'une mesure de son programme. Autres thèmes et
    autres vérificateurs (AFP Factuel, Les Décodeurs) pas encore recherchés.
  justice: >-
    Recherché le 20 octobre 2026 dans la presse : procédures pénales visant personnellement le candidat, en
    cours ou ayant donné lieu à une décision depuis 2017. Les enquêtes pénales sur ses propres campagnes
    électorales, dans lesquelles il n'est pas mis en cause personnellement, sont présentées à part. Ne sont
    pas retenues les plaintes sans ouverture d'enquête connue, les procédures où le candidat est plaignant ou
    victime, ni les procédures civiles. Aucune procédure correspondante trouvée.
  participation: >-
    Recherché le 20 octobre 2026 dans la presse et les documents de campagne : positions déclarées depuis 2025
    sur le référendum, le RIC, les conventions citoyennes, le 49.3, les ordonnances et la réforme des
    institutions, et recours au 49.3 ou aux ordonnances comme chef du gouvernement. Votes passés sur ces
    sujets pas encore recherchés.
  declarations: >-
    Recherché le 29 octobre 2026 (moteur de recherche, puis lecture des articles, dont certains dans le navigateur intégré) : déclarations du candidat du 1er septembre au 29 octobre 2026 ayant suscité au moins une réaction nommée dans la presse, avec ces réactions. Les positions déjà saisies dans les thèmes ne sont pas répétées. Les réactions anonymes (« entourage ») ne sont pas reprises. Non retenu, hors période : sa réaction à une campagne de désinformation prorusse (été 2026).
  soutiens: >-
    Recherché le 20 octobre 2026 sur les retraites, la fiscalité et le budget, l'immigration (adversaires politiques
    nommés, économistes, syndicats et organisations) : aucune réaction attribuée trouvée.
derniere_verification: 2026-10-30
absences:
  transparence-probite:
    statut: non_trouve
    note: "Recherché le 22 octobre 2026 (presse, sites officiels) : aucune proposition ni déclaration personnelle sur l'inéligibilité, le contrôle de la vie publique ou le lobbying trouvée dans les sources lues."
