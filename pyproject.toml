[project]
name = "presidentielle-checks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["checks"]
pythonpath = ["checks"]

[tool.ruff]
line-length = 120
